<script>
// ===== SHARED DATA: one file in the shared folder, used by every computer =====
// "Tag Tool Data.json" sits next to Tag Tool.html. It holds fix rules, item fixes
// and tag types. Each computer connects to the folder once (Edge/Chrome).
// Every change is merged (newest wins), so two computers can't wipe each other out.
const DATA_FILE = "Tag Tool Data.json";
const SH = { dir:null, ok:false, data:null };
// samples: picture of the tag a fixed tag type (TVs, Computers...) should look like {id:tag type, name, data:data URL, t}
const blankData = () => ({ v:1, rules:[], items:{}, tagTypes:[], samples:[] });

// small key-value store in the browser to remember the folder
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("tagtool",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }

// newest change wins, per rule / tag type / item field
function mergeData(a,b){
  const out=blankData();
  const byId=(x,y)=>{ const m=new Map(); [...(x||[]),...(y||[])].forEach(r=>{ const o=m.get(r.id); if(!o||(r.t||0)>(o.t||0)) m.set(r.id,r); }); return [...m.values()]; };
  out.rules=byId(a.rules,b.rules); out.tagTypes=byId(a.tagTypes,b.tagTypes); out.samples=byId(a.samples,b.samples);
  for(const src of [a.items||{},b.items||{}]) for(const n in src) for(const k in src[n]){
    const cur=(out.items[n]||{})[k], v=src[n][k];
    if(!cur||(v.t||0)>(cur.t||0)){ out.items[n]=out.items[n]||{}; out.items[n][k]=v; } }
  return out;
}
const cache={ get(){ try{ return Object.assign(blankData(),JSON.parse(localStorage.getItem("tagtool.shared"))||{}); }catch(e){ return blankData(); } },
              set(d){ try{ localStorage.setItem("tagtool.shared",JSON.stringify(d)); }catch(e){} } };
SH.data=cache.get();

async function readShared(){
  const fh=await SH.dir.getFileHandle(DATA_FILE,{create:true}), txt=await (await fh.getFile()).text();
  if(!txt.trim()) return blankData();
  try{ return Object.assign(blankData(),JSON.parse(txt)); }catch(e){ throw new Error("the shared data file is damaged"); }
}
async function writeShared(d){
  const fh=await SH.dir.getFileHandle(DATA_FILE,{create:true}), w=await fh.createWritable();
  await w.write(JSON.stringify(d,null,1)); await w.close();
}
function lostShared(e){ SH.ok=false; shareUI(); toast("Lost the shared folder"+(e&&e.message?" ("+e.message+")":"")+" — click Connect",true); }

// pull the latest from the folder (and push anything newer from this computer)
async function syncShared(){
  if(!SH.ok) return;
  try{ const remote=await readShared(), m=mergeData(remote,SH.data), mj=JSON.stringify(m);
    const changed=mj!==JSON.stringify(remote), news=mj!==JSON.stringify(SH.data);   // news: another computer changed something
    SH.data=m; if(news) cache.set(m); if(changed) await writeShared(m); if(news) onSharedChange(); }
  catch(e){ lostShared(e); }
}
// make a change for every computer
async function updateShared(fn){
  if(SH.ok){ try{ SH.data=mergeData(await readShared(),SH.data); }catch(e){} }
  fn(SH.data); cache.set(SH.data);
  if(SH.ok){ try{ await writeShared(SH.data); }catch(e){ lostShared(e); } }
  else toast("Saved on this computer only — click Connect to share",true);
  onSharedChange();
}
function onSharedChange(){
  if(typeof subs!=="function") return;
  if(!TYPE&&subs().length) return useSub();
  if(TYPE&&tags.length) view();       // tag type sizes / names may have changed on another computer
}

// connect / reconnect the shared folder
async function connectShared(pickNew){
  try{
    if(!window.showDirectoryPicker) return toast("Sharing needs Edge or Chrome",true);
    if(!SH.dir||pickNew){ SH.dir=await window.showDirectoryPicker({id:"tagtool",mode:"readwrite"}); await idbSet("dir",SH.dir); }
    if(await SH.dir.requestPermission({mode:"readwrite"})!=="granted") return;
    SH.ok=true; await syncShared(); if(SH.ok){ shareUI(); toast("✓ Connected to "+SH.dir.name); }
  }catch(e){ if(e.name!=="AbortError") toast("Couldn't connect: "+e.message,true); }
}
async function initShared(){
  try{ SH.dir=await idbGet("dir");
    if(SH.dir&&await SH.dir.queryPermission({mode:"readwrite"})==="granted"){ SH.ok=true; await syncShared(); } }catch(e){}
  shareUI();
}
function shareUI(){
  const b=$("shareBtn"); if(!b) return;
  b.hidden=!window.showDirectoryPicker; b.classList.toggle("on",SH.ok);
  b.title=SH.ok?"Shared folder: "+SH.dir.name:(SH.dir?"Reconnect shared folder":"Connect shared folder");
}
window.addEventListener("focus",()=>{ if(SH.ok) syncShared(); });

</script>
<script>
// ===== APP: the screen =====
const $=id=>document.getElementById(id);
let TYPE=null, tags=[], lastLines=null, editIdx=-1, showBack=false;
// built-in tag font for the on-screen previews
// (Print draws on canvas too, so it waits for this.)
const FONT_READY=(async()=>{ try{ const bin=atob(AH_B64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  document.fonts.add(await new FontFace("Atkinson Hyperlegible",u.buffer,{weight:"700"}).load()); redrawAll(); }catch(e){} })();

// ---------- saved on this computer ----------
const store={get(k){try{return JSON.parse(localStorage.getItem("tagtool."+k))}catch(e){return null}},
             set(k,v){try{localStorage.setItem("tagtool."+k,JSON.stringify(v))}catch(e){}}};

// ---------- light / dark ----------
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function setTheme(t){ document.documentElement.dataset.theme=t; store.set("theme",t);
  $("theme").innerHTML=t==="dark"?SUN:MOON; $("theme").title=t==="dark"?"Light mode":"Dark mode"; }
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
setTheme(document.documentElement.dataset.theme||"dark");
$("shopName").textContent=CONFIG.shop||"";

// ---------- little helpers ----------
let toastT;
function toast(t,bad){ const el=$("toast"); el.textContent=t; el.className=bad?"bad":""; el.hidden=false; el.style.opacity=1;
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.style.opacity=0; setTimeout(()=>el.hidden=true,200); },bad?(t.length>90?9000:5000):4200); }
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sel=()=>tags.filter(t=>t.include);
// EXPress Prawn XP (src/prawn.js) + Tide Tales drift-crate gifts (src/tide.js, print only); can never break tag work
const prawn=(k,n)=>{ try{ if(typeof PRAWN!=="undefined") PRAWN.award(k,n); }catch(e){} try{ if(typeof TIDE!=="undefined") TIDE.award(k,n); }catch(e){} };
const twoSided=()=>!!(TYPE&&TYPE.drawBack);

// ---------- tag types (Handguns, Long Guns...): picked for each gun from Bravo's Category ----------
let SUB=null, menuCat=null, editing_=null;
// tag types: built-in (CONFIG.tagTypes) + shared ones (added/edited/deleted in the Sizes menu)
// (a shared copy keeps built-in fields it doesn't have, e.g. group / extrasOnFront on an older saved copy)
const subs=()=>{ const m=new Map(CONFIG.tagTypes.map(x=>[x.id,x])); (SH.data.tagTypes||[]).forEach(x=>m.set(x.id,{...m.get(x.id),...x}));
  return [...m.values()].filter(x=>!x.deleted&&TYPES[x.cat]&&!(CONFIG.retiredTypes||[]).includes(x.id)); };
// Sizes menu heading: General Merchandise sits apart from Guns, though it prints with the same template
const grp=x=>x.group||TYPES[x.cat].name;
// own tag (design set: TVs, Computers, Monitors): fixed size, no editing; the Sizes menu only takes a sample picture of it
const fixed=x=>!!(x&&x.design);
const sampleOf=id=>(SH.data.samples||[]).find(s=>s.id===id&&!s.deleted&&s.data);
// The sample is the spec: when a type's sample is newer than its design (CONFIG.tagTypes designDate),
// the design gets rebuilt to match it. Until then the menu and Edit panel flag it.
const designDate=id=>Date.parse((CONFIG.tagTypes.find(x=>x.id===id)||{}).designDate||"")||0;
const needsDesign=x=>{ const sm=x&&sampleOf(x.id); return !!sm&&(sm.t||0)>designDate(x.id); };
const sampleBox=e=>{ const sm=sampleOf(e.id);
  return `<div class="tesample">${!sm?`<div><div class="tedef"><canvas id="teDefF"></canvas><canvas id="teDefB"></canvas></div>Current design: add a sample to change it</div>`:/^data:image/.test(sm.data)?`<img src="${sm.data}" alt="">`:"📄 "+esc(sm.name)}</div>
    ${needsDesign(e)?'<div class="tenote">Newer than the current design: the tag gets rebuilt to match this sample.</div>':""}
    <input type="file" id="teFile" accept="image/*,application/pdf" hidden>
    <div class="tebtns">${sm?'<button class="link" id="teRm">Remove sample</button>':""}<button class="chip" id="tePick">${sm?"Replace sample":"Add sample"}</button></div>`; };
// no sample: the box shows the current design, drawn with a made-up item
const DEMO={handgun:["Glock","19 Gen 5","9mm","Case, 2 Mags",450], rifle:["Ruger","10/22 Carbine",".22 LR","Scope",329],
  general:["DeWalt","20V Drill","","Charger, 2 Batteries",89], tv:["Samsung",'55" 4K Smart TV',"","Remote",379],
  computer:["Dell","Inspiron 15 Laptop","","Charger",299], monitor:["LG",'27" 1440p Monitor',"","Stand, HDMI Cable",159]};
function paintDefault(e){
  if(!$("teDefF")||!TYPE||e.cat!==TYPE.id||!kinds().some(x=>x.id===e.id)) return;
  const d=DEMO[e.id]||(e.extrasOnFront?DEMO.general:DEMO.handgun);
  const t={kind:e.id,brand:d[0],model:d[1],caliber:d[2],extras:d[3],price:d[4]}, s=settings(e.id), k=Math.min(125/s.W,150/s.H);
  paint($("teDefF"),t,k,false); if(twoSided()) paint($("teDefB"),t,k,true); else $("teDefB").remove();
}
function wireSample(id,keep){
  paintDefault(editing_);
  $("tePick").onclick=()=>$("teFile").click();
  $("teFile").onchange=async()=>{ const f=$("teFile").files[0]; if(!f) return; keep&&keep();
    try{ const data=await sampleData(f); await saveSample({id,name:f.name,data}); toast("✓ Sample saved"); }
    catch(e){ toast(e&&e.message||"Couldn't read that file",true); }
    renderMenu(); };
  if($("teRm")) $("teRm").onclick=async()=>{ keep&&keep(); await saveSample({id,deleted:true}); renderMenu(); };
}
const saveSample=s=>updateShared(d=>{ d.samples=(d.samples||[]).filter(y=>y.id!==s.id); d.samples.push({...s,t:Date.now()}); });
// picture -> JPEG at most 1200px (keeps the shared file small); PDF kept as is, up to 2 MB
async function sampleData(f){
  const url=()=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){ if(f.size>2e6) throw new Error("That PDF is too big (2 MB max) — try a picture instead"); return url(); }
  if(!/^image\//.test(f.type)) throw new Error("Needs a picture or a PDF");
  const b=await createImageBitmap(f), k=Math.min(1,1200/Math.max(b.width,b.height)), c=document.createElement("canvas");
  c.width=Math.round(b.width*k); c.height=Math.round(b.height*k); const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(b,0,0,c.width,c.height); return c.toDataURL("image/jpeg",.85);
}
const kinds=()=>TYPE?subs().filter(x=>x.cat===TYPE.id):[];
const kindOf=id=>{ const l=kinds(); return l.find(x=>x.id===id)||l.find(x=>x.id===CONFIG.defaultTagType)||l[0]; };
// Pistol -> Handguns, Rifle / Shotgun -> Long Guns; any other category -> CONFIG.otherTagType
// (General Merchandise); no category at all (old gun-only report) -> CONFIG.defaultTagType
function autoKind(t){
  const c=String(t.category||"").trim();
  if(c) for(const k of kinds()) if(k.categories&&new RegExp("^("+k.categories+")$","i").test(c)) return k.id;
  return kindOf(c&&CONFIG.otherTagType||CONFIG.defaultTagType).id;
}
// General Merchandise: "Comes with" read from the whole description (bag, 2 batteries, charger...)
const useAccessories=t=>{ if(kindOf(t.kind).extrasOnFront&&t.accessories) t.extras=t.accessories; };
// categories with no tag format yet (Computer, Jewelry) start unchecked
const skipCat=t=>!!CONFIG.skipCategories&&new RegExp("^("+CONFIG.skipCategories+")","i").test(String(t.category||"").trim());
// tags of one tag type, in report order
const ofKind=(list,id)=>list.filter(t=>kindOf(t.kind).id===id);
function saveSubs(list){
  const before=subs(), t=Date.now();
  return updateShared(d=>{
    list.forEach(x=>{ const o=before.find(b=>b.id===x.id); if(!o||JSON.stringify({...o,t:0})!==JSON.stringify({...x,t:0})){ d.tagTypes=d.tagTypes.filter(y=>y.id!==x.id); d.tagTypes.push({...x,isNew:undefined,t}); } });
    before.filter(b=>!list.some(x=>x.id===b.id)).forEach(b=>{ d.tagTypes=d.tagTypes.filter(y=>y.id!==b.id); d.tagTypes.push({id:b.id,cat:b.cat,deleted:true,t}); });
  });
}
// picks the template (guns for now); every tag type of it prints together
function useSub(){
  const list=subs(); SUB=list[0];
  if(!SUB){ TYPE=null; tags=[]; $("emptyMsg").textContent="No tag templates loaded yet."; view(); return; }
  const changed=!TYPE||TYPE.id!==SUB.cat;
  TYPE=TYPES[SUB.cat]; $("ttName").textContent=SUB.name; $("ttMenu").hidden=true;
  $("dlFront").hidden=$("dlBack").hidden=$("flip").hidden=$("lineup").hidden=!twoSided();
  if(!twoSided()) showBack=false;
  if(changed&&lastLines) loadLines(lastLines,true); else view();
}
function renderMenu(){
  const M=$("ttMenu"), list=subs(); if(!Object.keys(TYPES).length){ M.innerHTML='<div class="subs" style="padding:16px;color:var(--ink2)">No tag templates loaded yet.</div>'; return; }   const groups=[...new Set(list.map(grp))]; if(!groups.includes(menuCat)) menuCat=SUB&&groups.includes(grp(SUB))?grp(SUB):groups[0];
  const cats=groups.map(c=>`<button class="cat${c===menuCat?" on":""}" data-cat="${esc(c)}">${esc(c)}<span>›</span></button>`).join("");
  let right;
  if(editing_&&fixed(editing_)){            // own tag (TVs, Computers...): no name / size / delete, just the sample picture
    const e=editing_;
    right=`<div class="ttedit"><b>${esc(e.name)}</b>${sampleBox(e)}
      <div class="tebtns"><button class="btn" id="teCancel">Close</button></div></div>`;
  } else if(editing_){
    const e=editing_, T=TYPES[e.cat];
    right=`<div class="ttedit"><input id="teName" value="${esc(e.name)}" placeholder="Name">
      <select id="teSize">${T.sizes.map((z,i)=>`<option value="${i}"${i==e.size?" selected":""}>${esc(z.label)}</option>`).join("")}</select>
      ${e.isNew?"":sampleBox(e)}
      <div class="tebtns">${e.isNew?"":'<button class="link" id="teDel">Delete</button>'}<button class="chip" id="teCancel">Cancel</button><button class="btn primary" id="teSave">Save</button></div></div>`;
  } else {
    right=list.filter(x=>grp(x)===menuCat).map(x=>`<div class="sub"><button class="pickSub" data-ed="${x.id}">${esc(x.name)}${needsDesign(x)?'<span class="newsample">new sample</span>':""}${fixed(x)?"":`<small>${esc((TYPES[x.cat].sizes[x.size]||TYPES[x.cat].sizes[0]).label)}${x.categories?" · "+esc(x.categories.split("|").slice(0,3).join(", ")):""}</small>`}</button><button class="ed" data-ed="${x.id}" title="${fixed(x)?"Sample tag":"Edit"}">✎</button></div>`).join("")
      +(list.some(x=>grp(x)===menuCat&&fixed(x))?"":`<button class="addsub" id="subAdd">+ New</button>`);
  }
  M.innerHTML=`<div class="cats">${cats}</div><div class="subs">${right}</div>`;
  M.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ menuCat=b.dataset.cat; editing_=null; renderMenu(); });
  M.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ editing_={...list.find(x=>x.id===b.dataset.ed)}; renderMenu(); });
  if($("subAdd")) $("subAdd").onclick=()=>{ const g0=list.find(x=>grp(x)===menuCat)||{};   // a new one joins this heading, same template + front layout
    editing_={id:"t"+Date.now(),cat:g0.cat||Object.keys(TYPES)[0],group:g0.group,extrasOnFront:g0.extrasOnFront,name:"",size:0,isNew:true}; renderMenu(); $("teName").focus(); };
  if(editing_&&fixed(editing_)){
    $("teCancel").onclick=()=>{ editing_=null; renderMenu(); };
    wireSample(editing_.id);
  } else if(editing_){
    $("teCancel").onclick=()=>{ editing_=null; renderMenu(); };
    // keep a typed (unsaved) name / size when the sample box redraws the panel
    if($("tePick")) wireSample(editing_.id,()=>{ editing_={...editing_,name:$("teName").value,size:+$("teSize").value}; });
    $("teSave").onclick=()=>{ const n=$("teName").value.trim(); if(!n) return $("teName").focus();
      const e={...editing_,name:n,size:+$("teSize").value,isNew:undefined}, l=subs().slice(), k=l.findIndex(x=>x.id===e.id);
      if(k<0) l.push(e); else l[k]=e; saveSubs(l); editing_=null; renderMenu(); view(); };
    if($("teDel")) $("teDel").onclick=()=>{ const l=subs().filter(x=>x.id!==editing_.id);
      if(!l.some(x=>grp(x)===grp(editing_))) return toast("Keep at least one",true);
      saveSubs(l); editing_=null; renderMenu(); view(); };
    $("teName").onkeydown=e=>{ if(e.key==="Enter") $("teSave").click(); };
  }
}
$("ttBtn").onclick=e=>{ e.stopPropagation(); const M=$("ttMenu"); if(M.hidden){ menuCat=null; editing_=null; renderMenu(); } M.hidden=!M.hidden; };
$("ttMenu").addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>{ $("ttMenu").hidden=true; });

// ---------- loading the report ----------
// Bravo's own saved report (.prnx, the Save button in Report Preview) — full names, nothing cut off.
async function handleFile(file){
  if(!file) return; if(!TYPE) return toast("No tag templates loaded yet",true);
  if(!/\.prnx$/i.test(file.name)){ toast("Needs Bravo's saved report (.prnx): Save in Bravo's Report Preview",true); return; }
  $("drop").classList.add("busy"); $("dropBig").textContent="Reading…"; $("dropSmall").textContent=file.name;
  try{ if(typeof DecompressionStream==="undefined") throw 0; loadLines(await readPrnxLines(file)); }
  catch(e){ tags=[]; view(); $("emptyMsg").textContent="Couldn't read that file."; }
  finally{ $("drop").classList.remove("busy"); $("dropBig").textContent="Drop Bravo report"; $("dropSmall").textContent="or click to pick it"; }
}
function loadLines(lines,quiet){
  lastLines=lines; const list=TYPE.parse(lines); list.forEach(t=>{ t.kind=autoKind(t); if(skipCat(t)) t.include=false; useAccessories(t); });
  tags=applyFixes(list); skips={}; $("q").value="";             // a tag type changed on the Edit panel is remembered by item #
  if(!tags.length){ $("emptyMsg").textContent="No items found in that file."; view(); return; }
  $("emptyMsg").textContent=""; view(); window.scrollTo({top:0}); if(!quiet) prawn("load",tags.map(t=>t.number||t.raw||""));
  if(!quiet) toast("✓ "+kinds().map(k=>[ofKind(tags,k.id).length,k.name]).filter(x=>x[0]).map(x=>x[0]+" "+x[1]).join(" · "));
}
function newTag(){
  if(!TYPE) return toast("No tag templates loaded yet",true);
  const t={include:true,price:0,cost:NaN,number:"",raw:"",hand:true,kind:kindOf(CONFIG.defaultTagType).id}; TYPE.fields.forEach(f=>t[f[0]]=""); tags.push(t);
  view(); openEditor(tags.length-1); prawn("new");
}

// ---------- which parts show ----------
function view(){
  const has=tags.length>0;
  $("empty").hidden=has; $("tagsView").hidden=$("tools").hidden=$("bar").hidden=!has;
  $("flip").textContent=showBack?"Show fronts":"Show backs"; $("flip").classList.toggle("on",showBack);
  if(has&&TYPE){ checkAll(); buildGrid(); updateBar(); }
}

// ---------- tag grid: one group per tag type, cards drawn only when on screen ----------
let skips={};                                   // start spot per tag type (used sheets)
function settings(kindId){
  const k=kindOf(kindId), z=TYPE.sizes[k.size]||TYPE.sizes[0];
  return {W:z.w*72,H:z.h*72,portrait:z.orient==="portrait",skip:skips[k.id]||0,extrasFront:!!k.extrasOnFront,design:k.design||""};
}
const obs=new IntersectionObserver(es=>es.forEach(e=>{ const c=e.target;
  if(e.isIntersecting) drawCard(c); else if(c._cv){ c._cv.remove(); c._cv=null; } }),{rootMargin:"600px"});
let cardK=1;
const cards=()=>[...$("grid").querySelectorAll(".card")];
function buildGrid(){
  const grid=$("grid"), q=$("q").value.trim().toLowerCase(), gw=grid.clientWidth||1100;

  const maxW=Math.max(...kinds().map(k=>settings(k.id).W)), cols=Math.max(1,Math.floor((gw+18)/(300+18)));
  cardK=Math.floor((gw-18*(cols-1))/cols-1)/maxW; const k=cardK;
  cards().forEach(c=>obs.unobserve(c)); grid.innerHTML="";

  for(const kd of kinds()){
    const s=settings(kd.id), idx=tags.map((t,i)=>i).filter(i=>kindOf(tags[i].kind).id===kd.id);

    head.innerHTML=`${esc(kd.name)}<small>${esc(plural(n,"tag"))} · ${esc(plural(Math.ceil((n+s.skip)/per)||0,"sheet"))} · ${per} per sheet</small>`;
    const wrap=document.createElement("div"); wrap.className="cards";
    grid.appendChild(head); grid.appendChild(wrap);
    idx.forEach(i=>{ const t=tags[i];
      if(q&&!Object.values(t).join(" ").toLowerCase().includes(q)) return; shown++;
      const c=document.createElement("div"); c.className="card"+(t.include?"":" off")+(t._warn?" warn":""); c._i=i;
      if(t._warn) c.title="Some text on this tag prints small — click to fix it";
      c.style.width=s.W*k+"px"; c.style.height=s.H*k+"px";
      c.innerHTML='<button class="tick" title="Print this tag?"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button>';
      c.querySelector(".tick").onclick=e=>{ e.stopPropagation(); t.include=!t.include; c.classList.toggle("off",!t.include); updateBar(); buildGridHeadsOnly(); };
      c.onclick=()=>openEditor(i);
      wrap.appendChild(c); obs.observe(c);
    });
  }
  $("noMatch").hidden=shown>0||!tags.length;
}
function buildGridHeadsOnly(){
  $("grid").querySelectorAll(".grp").forEach((h,j)=>{ const kd=kinds().filter(x=>ofKind(tags,x.id).length)[j]; if(!kd) return;
    const s=settings(kd.id), per=layoutGrid(s).per, n=ofKind(sel(),kd.id).length;

// paint one side of a tag onto a canvas at scale k (size comes from the tag's own tag type)
function paint(cv,t,k,back){
  const s=settings(t.kind), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.ceil(s.W*k*dpr); cv.height=Math.ceil(s.H*k*dpr); cv.style.width=s.W*k+"px"; cv.style.height=s.H*k+"px";
  const ctx=cv.getContext("2d"); ctx.scale(k*dpr,k*dpr);
  (back&&TYPE.drawBack?TYPE.drawBack:TYPE.draw)(canvasG(ctx),1.5,1.5,t,{...s,W:s.W-3,H:s.H-3});
}
function drawCard(c){
  const t=tags[c._i]; if(!t) return;

<script>
// ===== FIXES: the tool's knowledge base for Bravo's weird names =====
// Two kinds, both kept in the shared data file (shared.js) so every computer uses them:
//  1. Item fixes: any name edited in the Edit panel is remembered by item #.
//  2. Rules: fix every matching tag, e.g. model "Spear Rifle" -> "Spear".
// Rules baked into the file itself live in CONFIG.fixes.
const fixRules = () => SH.data.rules.filter(r=>!r.deleted);
const itemFixes = () => { const out={}, it=SH.data.items;
  for(const n in it) for(const k in it[n]) if(!it[n][k].deleted){ out[n]=out[n]||{}; out[n][k]=it[n][k]; } return out; };
const MONEYKEYS = new Set(["price","cost","number","include","raw","hand"]);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function applyRule(t,r){
  if(typeof t[r.field]!=="string") return false;
  if(r.ifField && String(t[r.ifField]||"").toLowerCase()!==r.ifValue.toLowerCase()) return false;
  const re=new RegExp("(^|[^A-Za-z0-9])"+reEsc(r.find)+"(?=$|[^A-Za-z0-9])","gi");
  const out=t[r.field].replace(re,(m,p)=>p+r.replace).replace(/\s+/g," ").trim();
  if(out===t[r.field]) return false; t[r.field]=out; return true;
}
// run after a template parses the report
function applyFixes(list){
  const rules=(CONFIG.fixes||[]).concat(fixRules()), items=itemFixes();
  for(const t of list){
    for(const r of rules) applyRule(t,r);
    t._base={}; for(const k in t) if(!MONEYKEYS.has(k)&&typeof t[k]==="string") t._base[k]=t[k];
    const f=t.number&&items[t.number];
    if(f) for(const k in f) if(k in t) t[k]=f[k].to;
  }
  return list;
}
// called when someone edits a name in the Edit panel (saved after a short pause)
const pendingEdits={}; let editTimer;
function rememberEdit(t,k){
  if(!t.number||MONEYKEYS.has(k)) return;
  const from=(t._base||{})[k]??"", to=String(t[k]);
  pendingEdits[t.number+"\u0000"+k]={n:t.number,k,from,to};
  clearTimeout(editTimer); editTimer=setTimeout(flushEdits,700);
}
function flushEdits(){
  const list=Object.values(pendingEdits); if(!list.length) return; for(const key in pendingEdits) delete pendingEdits[key];
  updateShared(d=>{ for(const e of list){ d.items[e.n]=d.items[e.n]||{};
    d.items[e.n][e.k]=e.to===e.from?{deleted:true,t:Date.now()}:{from:e.from,to:e.to,t:Date.now()}; } });
}

// ---------- manager console (Ctrl+Shift+F) ----------
const CON={open:false,hist:[],hi:0,unlocked:false};
function cprint(txt,cls){ const d=document.createElement("div"); d.className="cl "+(cls||""); d.textContent=txt; $("conOut").appendChild(d); $("conOut").scrollTop=1e9; }
function openConsole(){
  $("console").hidden=false; CON.open=true; $("conIn").value=""; $("conIn").focus();

}
function closeConsole(){ $("console").hidden=true; CON.open=false; }
function args(s){ const out=[]; s.replace(/"([^"]*)"|(\S+)/g,(m,q,w)=>{ out.push(q!==undefined?q:w); }); return out; }
function listRules(){
  const base=CONFIG.fixes||[], mine=fixRules();
  if(!base.length&&!mine.length) return cprint("No rules yet.","dim");
  base.forEach(r=>cprint("   (built-in) "+ruleText(r),"dim"));
  mine.forEach((r,i)=>cprint(String(i+1).padStart(3)+"  "+ruleText(r)));
}
const ruleText=r=>`${r.field} "${r.find}" -> "${r.replace}"`+(r.ifField?`  if ${r.ifField} "${r.ifValue}"`:"");
function itemList(){ const items=itemFixes(), out=[]; for(const n in items) for(const k in items[n]) out.push({n,k,...items[n][k]}); return out; }
async function runCmd(line){
  line=line.trim(); if(!line) return;

    if(line===String(CONFIG.managerPin)){ CON.unlocked=true; $("conIn").type="text"; cprint("Unlocked. Type \"help\".","ok"); }
    else cprint("Wrong PIN.","bad"); return;
  }
  cprint("> "+line,"me"); CON.hist.push(line); CON.hi=CON.hist.length;
  const a=args(line), cmd=(a[0]||"").toLowerCase();
  const reload=()=>{ if(lastLines) loadLines(lastLines,true); };
  if(cmd==="help"){
    [ 'fix <field> "find" -> "replace"           fix every matching tag',
      'fix <field> "find" -> "replace" if <field> "value"   only when, e.g. if brand "Glock"',
      'rules                                     list rules',
      'del <#>                                   delete a rule',
      'edits                                     list remembered single-item fixes',
      'learn <#>                                 turn an item fix into a rule for all items',
      'forget <#>                                delete an item fix',
      'fields                                    field names for this tag type',
      'status / folder                           shared folder: show / pick',
      'export / import                           backup file / load a backup',
      'clear, exit' ].forEach(x=>cprint(x));
  } else if(cmd==="fix"){
    const arrow=a.indexOf("->"); const ifAt=a.findIndex((x,i)=>i>arrow&&x.toLowerCase()==="if");
    if(a.length<5||arrow!==3) return cprint('Use: fix model "Spear Rifle" -> "Spear"',"bad");
    const r={field:a[1],find:a[2],replace:a[4]}; if(ifAt>0){ r.ifField=a[ifAt+1]; r.ifValue=a[ifAt+2]||""; }
    r.id=newId(); r.t=Date.now(); await updateShared(d=>d.rules.push(r));
    const hit=tags.filter(t=>applyRule({...t},r)).length;
    cprint("Saved rule "+fixRules().length+": "+ruleText(r)+(lastLines?`  (${hit} tag${hit===1?"":"s"} in this report)`:""),"ok"); reload();
  } else if(cmd==="rules"||cmd==="list"){ listRules();
  } else if(cmd==="del"){
    const l=fixRules(), n=+a[1]; if(!(n>=1&&n<=l.length)) return cprint("No rule #"+a[1],"bad");
    const r=l[n-1]; await updateShared(d=>{ const x=d.rules.find(y=>y.id===r.id); if(x){ x.deleted=true; x.t=Date.now(); } }); cprint("Deleted: "+ruleText(r),"ok"); reload();
  } else if(cmd==="edits"){
    const l=itemList(); if(!l.length) return cprint("No item fixes yet.","dim");
    l.forEach((x,i)=>cprint(String(i+1).padStart(3)+`  ${x.n}  ${x.k}: "${x.from}" -> "${x.to}"`));
  } else if(cmd==="learn"||cmd==="forget"){
    const l=itemList(), x=l[+a[1]-1]; if(!x) return cprint("No edit #"+a[1],"bad");
    const r={id:newId(),t:Date.now(),field:x.k,find:x.from,replace:x.to};
    await updateShared(d=>{ if(cmd==="learn") d.rules.push(r); d.items[x.n][x.k]={deleted:true,t:Date.now()}; });
    if(cmd==="learn") cprint("Rule added: "+ruleText(r),"ok");
    if(cmd==="forget") cprint("Forgot item fix "+x.n+" "+x.k,"ok"); reload();
  } else if(cmd==="fields"){
    if(!TYPE) return cprint("No tag type loaded.","dim"); cprint(TYPE.fields.map(f=>f[0]+" ("+f[1]+")").join(",  "));
  } else if(cmd==="export"){
    saveFile("Tag Tool Data (backup).json",JSON.stringify(SH.data,null,1),"application/json"); cprint("Backup saved to Downloads.","ok");
  } else if(cmd==="folder"){ closeConsole(); connectShared(true);
  } else if(cmd==="status"){ cprint(SH.ok?"Shared folder: "+SH.dir.name+" ("+DATA_FILE+")":"Not connected — this computer only. Type: folder","dim");
  } else if(cmd==="import"){ $("conFile").click();
  } else if(cmd==="clear"){ $("conOut").innerHTML="";
  } else if(cmd==="exit"||cmd==="quit"){ closeConsole();
  } else cprint('Unknown command. Type "help".',"bad");
}
$("conIn").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ runCmd($("conIn").value); $("conIn").value=""; }
  else if(e.key==="ArrowUp"&&CON.hi>0){ $("conIn").value=CON.hist[--CON.hi]; e.preventDefault(); }
  else if(e.key==="ArrowDown"){ CON.hi=Math.min(CON.hist.length,CON.hi+1); $("conIn").value=CON.hist[CON.hi]||""; }
  else if(e.key==="Escape") closeConsole();
  e.stopPropagation();
});
$("conFile").onchange=async()=>{
  const f=$("conFile").files[0]; $("conFile").value=""; if(!f) return;
  try{ const d=JSON.parse(await f.text()); (d.rules||[]).forEach(r=>{ r.id=r.id||newId(); r.t=r.t||Date.now(); }); await updateShared(cur=>{ const m=mergeData(cur,Object.assign(blankData(),d)); Object.assign(cur,m); });
    cprint("Imported "+(d.rules||[]).length+" rules.","ok"); if(lastLines) loadLines(lastLines,true);
  }catch(e){ cprint("That file isn't a Tag Tool data file.","bad"); }
};
$("console").addEventListener("click",e=>{ if(e.target.id==="console") closeConsole(); else $("conIn").focus(); });
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="f"){ e.preventDefault(); CON.open?closeConsole():openConsole(); }
});

<script>
// ---------- EXPress Prawn: background module (opens from the probe overlay) ----------
// Core: skills, pet care, clock, save. Systems (prawn-reef.js, prawn-dive.js) plug in through G.SYS;
// the screen is prawn-ui.js, which calls G.start(). Progress comes from real elapsed time (advance),
// so it keeps going while tags are made and catches up (capped, slower) after the tool was closed.
// Saved per computer in localStorage "tagtool.prawn". Never uses the app's toast().
var PRAWN=(function(){
  const KEY="tagtool.prawn", MAXL=99;
  const R=()=>Math.random(), now=()=>Date.now()/1000;
  // ---- every balance knob lives here (system files read G.BAL) ----
  const BAL={
    cap:12*3600, offline:.5, xpBase:60, xpGrow:1.12, actXpLv:50,
    hungerSec:600, moodSec:480, cleanSec:600,
    tag:{load:15, print:40, edit:12, new:20, printShells:2, loadInsight:1, printInsight:3, editCap:60, newCap:30, blankCap:25, rushPer:300, rushMax:4*3600, rush:.75},
    reef:{unlock:20, grow:1.22},
    caps:{plankton:300,sand:300,kelp:150,snack:100,castle:40,pearl:12,palace:4,insight:150},
    crew:{arrive:300, eat:.004, house:2, starve:300},
    order:{every:1500, max:3, life:4*3600},
    crit:{befriend:.03, wild:.01, xpBase:25, xpGrow:1.14, capBase:20, capMolt:10, evo:[15,35], stageMult:[1,2.2,4.8], shiny:1/400},
    dive:{hp:12, hpGrow:1.2, atk:1, atkGrow:1.17, cells:10, bossEvery:5, bossHp:6, bossAtk:2, rest:30, shells:2, shellsGrow:1.13, xp:3, xpGrow:1.17, minKill:1, farm:600},
    molt:{base:3, depthGrow:1.1, lvlFrom:60, lvlDiv:6, perkGrow:1.3}
  };
  const XPAT=[0,0]; for(let L=1;L<MAXL;L++) XPAT[L+1]=XPAT[L]+Math.floor(BAL.xpBase*Math.pow(BAL.xpGrow,L));
  const lvl=xp=>{ let L=1; while(L<MAXL&&xp>=XPAT[L+1]) L++; return L; };
  const fmt=n=>{ n=+n||0; const a=Math.abs(n); if(a<1e4) return String(Math.floor(n)); if(a>=1e21) return n.toExponential(2);
    const u=["k","M","B","T","Qa","Qi"]; let i=-1, v=a; while(v>=1000&&i<u.length-1){ v/=1000; i++; } return (n<0?"-":"")+(v<100?v.toFixed(1):Math.floor(v))+u[i]; };

  const SKILLS=[
    {id:"forage",  n:"Foraging",   ic:"🌿", act:3.0, xp:9,  verb:"foraging for plankton"},
    {id:"burrow",  n:"Burrowing",  ic:"⛏️", act:3.6, xp:11, verb:"burrowing for pearls"},
    {id:"swim",    n:"Swimming",   ic:"🌊", act:2.4, xp:8,  verb:"doing laps"},
    {id:"pinch",   n:"Pinching",   ic:"✂️", act:1.8, xp:0,  verb:"pinching"},
    {id:"cook",    n:"Cooking",    ic:"🍳", act:3.0, xp:14, verb:"cooking snacks"},
    {id:"craft",   n:"Shellcraft", ic:"🏰", act:4.2, xp:18, verb:"building sandcastles"},
    {id:"appraise",n:"Appraising", ic:"🏷️", act:0,   xp:0,  verb:"", tagOnly:true}
  ];
  const SK=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
  const MONS=[
    {n:"Sea Louse",e:"🪲",l:1,hp:5,sh:1},{n:"Grumpy Krill",e:"🦐",l:6,hp:12,sh:2},{n:"Hermit Crab",e:"🦀",l:15,hp:25,sh:4},
    {n:"Pufferfish",e:"🐡",l:28,hp:45,sh:8},{n:"Moray Eel",e:"🐍",l:42,hp:80,sh:14},{n:"Octopus",e:"🐙",l:58,hp:130,sh:25},
    {n:"Lobster Lord",e:"🦞",l:75,hp:220,sh:45},{n:"Abyssal Serpent",e:"🐉",l:90,hp:400,sh:90}];
  const SHOP=[
    {id:"feeder", n:"Auto-feeder",     d:"Feeds your prawn when hungry", c:150},
    {id:"filter", n:"Tank filter",     d:"Tank gets dirty half as fast", c:300},
    {id:"bubbler",n:"Bubble castle",   d:"Mood drops half as fast",      c:400},
    {id:"pincers",n:"Golden pincers",  d:"+30% pinch damage",            c:1500, req:["pinch",30]},
    {id:"fins",   n:"Turbo fins",      d:"+10% action speed",            c:2500, req:["swim",40]},
    {id:"hat_party",n:"Party hat",     d:"Hat · +2% XP",  c:60,   req:["craft",3],  hat:.02},
    {id:"hat_cap",  n:"Captain's hat", d:"Hat · +5% XP",  c:400,  req:["craft",20], hat:.05},
    {id:"hat_visor",n:"Pawnbroker visor",d:"Hat · +8% XP",c:1200, req:["appraise",20], hat:.08},
    {id:"hat_crown",n:"Crown",         d:"Hat · +15% XP", c:8000, req:["craft",60], hat:.15}];
  const SELL={castle:4,palace:60,pearl:25};
  const FOOD=[["snack",25,5],["kelp",15,2],["plankton",8,0]];          // item, hunger+, mood+
  const STAGES=[[0,"Shrimplet",.62],[20,"Prawn",.75],[60,"Big Prawn",.88],[150,"Jumbo Prawn",1],[300,"King Prawn",1.12],[500,"EXPress Prawn",1.25]];

  const SYS=[], G={};                                            // systems: {init(S), tick(dt,real), bonus(key), on(ev,...)}
  const bonus=k=>{ let b=0; for(const s of SYS) if(s.bonus) b+=s.bonus(k)||0; return b; };
  const emit=(ev,...a)=>{ for(const s of SYS) if(s.on) try{ s.on(ev,...a); }catch(e){ if(G.debug) throw e; } };
  function fresh(){ const S={v:2,name:"Prawny",t:now(),xp:Object.fromEntries(SKILLS.map(s=>[s.id,0])),train:"forage",prog:0,
    h:80,mo:80,c:80,inv:{plankton:5,kelp:0,snack:0,sand:0,pearl:0,castle:0,palace:0},shells:0,own:{},hat:null,
    mon:{i:0,hp:5},log:[],n:{tags:0,printed:0,kills:0,pets:0,golds:0},stage:0,away:null,unl:{},seen:{}};
    SYS.forEach(s=>s.init&&s.init(S)); return S; }
  let S=null, dirty=false, lastSave=0, started=false;
  function load(){
    try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.v>=1){ const f=fresh();     // v1 saves upgrade in place
      const m=Object.assign(f,d,{v:2,xp:Object.assign(f.xp,d.xp),inv:Object.assign(f.inv,d.inv),n:Object.assign(f.n,d.n),unl:d.unl||{},seen:d.seen||{}});
      SYS.forEach(s=>s.init&&s.init(m)); return m; } }catch(e){ if(G.debug) throw e; }
    return fresh();
  }
  function save(force){ const t=Date.now(); if(!force&&(!dirty||t-lastSave<8000)) return;
    try{ localStorage.setItem(KEY,JSON.stringify(S)); lastSave=t; dirty=false; }catch(e){} }

  const L=id=>lvl(S.xp[id]);
  const total=()=>SKILLS.reduce((a,s)=>a+L(s.id),0);
  const stageOf=tl=>{ let i=0; STAGES.forEach((s,j)=>{ if(tl>=s[0]) i=j; }); return i; };
  const hatBonus=()=>{ const h=SHOP.find(x=>x.id===S.hat); return h?h.hat:0; };
  const xpMult=()=>(1+L("appraise")/200)*(1+hatBonus())*(1+bonus("xp"));
  const care=()=>{ const m=(S.h+S.mo+S.c)/300; return (0.2+0.8*m)*(S.h<=0?0.5:1); };
  const speed=()=>(1+L("swim")/150)*(S.own.fins?1.1:1)*(1+bonus("speed"));
  const mon=()=>{ let i=0; MONS.forEach((m,j)=>{ if(m.l<=L("pinch")) i=j; }); return i; };
  function log(t){ S.log.unshift(t); if(S.log.length>60) S.log.length=60; }
  const pfx=(...o)=>{ if(G.open) G.fx.push(...o); };              // little screen effects, only while the screen is open

  function gain(id,amt,work){                                   // work = from tag-making (ignores care)
    const before=L(id); S.xp[id]=Math.min(S.xp[id]+amt*(work?1+hatBonus():xpMult()*(1+bonus("xp:"+id))),XPAT[MAXL]*1.5);
    const after=L(id); if(after>before){ log(`${SK[id].ic} ${SK[id].n} level ${after}!${after===MAXL?" MAXED 🎉":""}`); pfx({k:"lvl",t:0,txt:SK[id].n+" "+after}); emit("level",id,after);
      const st=stageOf(total()); if(st>S.stage){ S.stage=st; log(`✨ ${S.name} grew into a ${STAGES[st][1]}!`); pfx({k:"lvl",t:0,txt:"Grew up!"}); } }
  }
  // one finished action of the trained skill
  function act(){
    const id=S.train, lv=L(id), sk=SK[id], x=sk.xp*(1+lv/BAL.actXpLv), y=1+bonus("yield:"+id);
    if(id==="forage"){ S.inv.plankton+=(1+(R()<lv/200?1:0))*y; if(lv>=15&&R()<0.1+lv/500) S.inv.kelp+=y; gain(id,x); }
    else if(id==="burrow"){ S.inv.sand+=y; if(R()<(0.01+lv/2000)*(1+bonus("pearl"))){ S.inv.pearl++; log("🦪 Dug up a pearl!"); } gain(id,x); }
    else if(id==="swim"){ if(R()<0.02){ const s=1+Math.floor(R()*3); S.shells+=s; } gain(id,x); }
    else if(id==="cook"){ if(S.inv.plankton<2){ S.stall="Out of plankton"; return; }
      S.inv.plankton-=2; S.stall=null; if(R()<Math.max(0.02,0.4-lv/100)) return; S.inv.snack+=y; gain(id,x); }
    else if(id==="craft"){ if(S.inv.sand<5){ S.stall="Needs 5 sand"; return; }
      S.inv.sand-=5; if(lv>=30&&S.inv.pearl>=1&&R()<0.25){ S.inv.pearl--; S.inv.palace++; gain(id,x*4); } else { S.inv.castle+=y; gain(id,x); } }
    else if(id==="pinch"){ const mi=mon(), m=MONS[mi]; if(S.mon.i!==mi){ S.mon={i:mi,hp:m.hp}; }
      if(R()<Math.min(.95,Math.max(.15,.55+(lv-m.l)*.03))){
        const d=1+Math.floor(R()*(1+lv/4)*(1+(S.own.pincers?.3:0)+bonus("pinch"))); S.mon.hp-=d; gain(id,d*3); pfx({k:"hit",t:0,txt:"-"+d}); }
      if(S.mon.hp<=0){ S.shells+=m.sh; S.n.kills++; if(R()<.05) S.inv.pearl++; S.mon.hp=m.hp; pfx({k:"pop",t:0}); emit("kill",mi); } }
    S.stall=null;
  }
  function stepSim(step,eff){
    const cs=1-Math.min(.8,bonus("care"));
    S.h=Math.max(0,S.h-step*cs/BAL.hungerSec); S.mo=Math.max(0,S.mo-step*cs/(BAL.moodSec*(S.own.bubbler?2:1))); S.c=Math.max(0,S.c-step*cs/(BAL.cleanSec*(S.own.filter?2:1)));
    if(S.own.feeder&&S.h<40) eat(true);
    for(const s of SYS) if(s.tick) try{ s.tick(step*eff,step); }catch(e){ if(G.debug) throw e; }
    const sk=SK[S.train]; if(sk.tagOnly) return;
    S.prog+=step*eff*speed()*care(); let k=0;
    while(S.prog>=sk.act&&k++<2000){ S.prog-=sk.act; act(); if(S.stall){ S.prog=0; break; } }
  }
  const snap=()=>({xp:SKILLS.reduce((a,s)=>a+S.xp[s.id],0),sh:S.shells,ins:S.inv.insight||0});
  // background clock: everything happens here, from real elapsed time
  function advance(){
    const t=now(); let dt=t-S.t; S.t=t;
    if(!(dt>0)) return; if(dt>BAL.cap) dt=BAL.cap;               // clock went backwards / huge gap
    const away=dt>300, s0=away?snap():null, eff=away?Math.min(1,BAL.offline+bonus("offline")):1;
    G.clock=t-dt;
    while(dt>0){ const step=Math.min(dt,60); dt-=step; G.clock+=step; stepSim(step,eff); }
    G.clock=t;
    if(away){ const s1=snap(); S.away=`While you were away: +${fmt(s1.xp-s0.xp)} XP, +${fmt(s1.sh-s0.sh)} shells`+(s1.ins>s0.ins+1?`, +${fmt(s1.ins-s0.ins)} 💡`:""); log("💤 "+S.away); }
    emit("check"); dirty=true; save();
  }
  function eat(auto){
    for(const [it,h,m] of FOOD) if(S.inv[it]>=1&&S.h<100){ S.inv[it]--; S.h=Math.min(100,S.h+h); S.mo=Math.min(100,S.mo+m); if(!auto) pfx({k:"heart",t:0}); dirty=true; return it; }
    return null;
  }
  // tag tool hooks (app.js calls PRAWN.award). Each item # pays once per day, so re-saving can't farm it.
  function award(kind,keys){
    try{ if(!S) return; advance(); const T=BAL.tag, day=new Date(now()*1000).toDateString();
      if(!S.day||S.day.d!==day) S.day={d:day,load:{},print:{},edit:0,new:0,blank:0};
      const D=S.day; let n=0;
      if(kind==="load"||kind==="print"){ const list=Array.isArray(keys)?keys:Array.from({length:Math.max(1,+keys||1)},()=>"");
        for(const k of list){ if(k){ if(D[kind][k]) continue; D[kind][k]=1; n++; } else if(D.blank<T.blankCap){ D.blank++; n++; } } }
      else if(kind==="edit"||kind==="new"){ if(D[kind]>=T[kind+"Cap"]) return; D[kind]++; n=1; }
      if(!n) return;
      if(kind==="load"){ gain("appraise",T.load*n,1); S.inv.plankton+=n; S.mo=Math.min(100,S.mo+5); S.n.tags+=n; log(`📦 Bravo report: ${n} new items → ${n} plankton`); }
      else if(kind==="print"){ gain("appraise",T.print*n,1); S.shells+=T.printShells*n; S.mo=Math.min(100,S.mo+3); S.n.printed+=n; log(`🖨️ ${n} tags out the door → +${T.printShells*n} shells`); }
      else gain("appraise",T[kind],1);
      emit("award",kind,n); emit("check"); dirty=true; save(true);
    }catch(e){ if(G.debug) throw e; }
  }
  // molt/prestige: swap in a fresh save, keep(old,new) copies what survives
  function reset(keep){ const old=S; S=fresh(); keep(old,S); S.t=now(); dirty=true; save(true); }
  function start(){
    if(started) return; started=true; S=load();
    const first=()=>{ try{ advance(); }catch(e){ if(G.debug) throw e; } };   // catch-up can take ~0.1s: not during page load
    if(G.debug) first(); else setTimeout(first,1500);
    setInterval(()=>{ try{ advance(); }catch(e){} },2000);
    window.addEventListener("pagehide",()=>{ try{ advance(); save(true); }catch(e){} });
    document.addEventListener("visibilitychange",()=>{ if(document.hidden) try{ advance(); save(true); }catch(e){} });
  }
  Object.assign(G,{BAL,R,now,fmt,XPAT,MAXL,lvl,L,total,SKILLS,SK,MONS,SHOP,SELL,FOOD,STAGES,SYS,bonus,emit,gain,log,pfx,eat:()=>eat(false),
    advance,save,care,speed,mon,xpMult,hatBonus,stageOf,reset,start,fx:[],open:false,clock:0,touch:()=>{ dirty=true; }});
  Object.defineProperty(G,"S",{get:()=>S});
  return {award, G, slot:{label:"PRAWN",run:h=>G.ui(h)}};
})();

    {id:"r_cap",  n:"Bigger Vaults",    c:2000,   grow:1.5, rep:1, req:"storage", d:"×1.35 storage per level"},
    {id:"r_xp",   n:"Study Habits",     c:3000,   grow:1.7, rep:1, req:"school", d:"+10% skill XP per level"},
    {id:"r_prod", n:"Reef Engineering", c:4000,   grow:1.7, rep:1, req:"bank", d:"+15% reef & crew output per level"},
    {id:"r_power",n:"Sharper Claws",    c:5000,   grow:1.7, rep:1, req:"dive", d:"+20% dive power per level"}];
  const BD=Object.fromEntries(BUILD.map(b=>[b.id,b])), TD=Object.fromEntries(TECH.map(t=>[t.id,t]));
  const CUSTOMERS=[["🐢","Old Tortuga"],["🦭","Sealia"],["🐧","Pip"],["🦦","Otto"],["🐙","Madame Ink"],["🦈","Finley"],["🐳","Big Blue"],["🦩","Flora"]];
  const VALUE={plankton:.3,sand:.3,kelp:.8,snack:2,castle:5,pearl:25,palace:60};

  const has=id=>!!(G.S.tech[id]);
  const tl=id=>G.S.tech[id]||0;
  const owned=id=>G.S.reef[id]||0;
  const avail=b=>!b.tech||has(b.tech);
  const cost=b=>Object.fromEntries(Object.entries(b.cost).map(([k,v])=>[k,Math.ceil(v*Math.pow(b.grow||B.reef.grow,owned(b.id)))]));
  // storage caps (shells and relics are never capped). Stock above a cap is kept, it just stops growing.
  const STORE={plankton:250,sand:250,kelp:100,snack:100,castle:15,pearl:4,palace:1};
  const capOf=k=>{ const base=B.caps[k]; if(base==null) return Infinity; const c=base+owned("vault")*(STORE[k]||0)+(k==="insight"?owned("library")*150*(has("school")?2:1):0);
    return c*(has("storage")?1.5:1)*(has("masonry")?1.5:1)*Math.pow(1.35,tl("r_cap")); };
  function clampAll(){ const S=G.S; if(!S.unl.reef) return; S.prev=S.prev||{}; for(const k in B.caps){ const c=capOf(k), v=S.inv[k]||0, p=S.prev[k];
    if(p!=null&&v>c&&v>p) S.inv[k]=Math.max(c,p); S.prev[k]=S.inv[k]; } }       // first sight: keep what's there
  const amt=k=>k==="shells"?G.S.shells:(G.S.inv[k]||0);
  const take=(k,v)=>{ if(k==="shells") G.S.shells-=v; else G.S.inv[k]-=v; };
  const add=(k,v)=>{ if(k==="shells") G.S.shells+=v; else G.S.inv[k]=(G.S.inv[k]||0)+v; };
  const afford=c=>Object.entries(c).every(([k,v])=>amt(k)>=v);
  const techCost=t=>Math.ceil(t.c*(t.rep?Math.pow(t.grow,tl(t.id)):1));
  const techOpen=t=>(!t.req||has(t.req))&&(t.rep||!has(t.id));
  const housing=()=>owned("hut")*B.crew.house+G.bonus("house");
  const busy=()=>Object.values(G.S.crew.jobs).reduce((a,b)=>a+b,0);
  function bMult(b){ let m=1+G.bonus("prod");
    if(b.id==="kelp"&&has("kelpgen")) m*=2; if(b.id==="sifter"&&has("screens")) m*=2; if(b.id==="library"&&has("school")) m*=2; if(b.id==="oyster"&&has("pearldv")) m*=3; return m; }
  function rates(){                                           // per second, for the screen
    const r={}; BUILD.forEach(b=>{ if(b.prod&&owned(b.id)) for(const k in b.prod) r[k]=(r[k]||0)+b.prod[k]*owned(b.id)*bMult(b); });
    const cm=1+G.bonus("crew");
    JOBS.forEach(j=>{ const n=G.S.crew.jobs[j.id]||0; if(!n||!j.prod) return; const sm=j.id==="scholar"&&has("school")?2:1;
      for(const k in j.prod) r[k]=(r[k]||0)+j.prod[k]*n*cm*sm; for(const k in (j.use||{})) r[k]=(r[k]||0)-j.use[k]*n*cm; });
    if(r.insight) r.insight*=1+G.bonus("insight");
    r.plankton=(r.plankton||0)-G.S.crew.pop*B.crew.eat; return r; }

  // counter orders: a customer wants some items, pays shells + insight
  function newOrder(){
    const S=G.S, sc=1+G.total()/40, pool=["plankton","sand","snack","castle"];
    if(G.L("forage")>=15) pool.push("kelp"); if(S.inv.pearl>0||owned("oyster")) pool.push("pearl"); if(S.inv.palace>0) pool.push("palace");
    const want={}, k=1+(R()<.4?1:0);
    for(let i=0;i<k;i++){ const it=pool[Math.floor(R()*pool.length)]; const base={plankton:40,sand:40,kelp:15,snack:8,castle:4,pearl:1,palace:1}[it];
      want[it]=(want[it]||0)+Math.max(1,Math.round(base*sc*(.6+R()*.8))); }
    const val=Object.entries(want).reduce((a,[it,n])=>a+n*VALUE[it],0), who=CUSTOMERS[Math.floor(R()*CUSTOMERS.length)];
    const o={who,want,sh:Math.ceil(val*1.8),ins:Math.ceil(sc*3),exp:G.clock+B.order.life};

  function fillOrder(i){ const S=G.S, o=S.orders[i]; if(!o||!Object.entries(o.want).every(([k,v])=>amt(k)>=v)) return false;
    for(const [k,v] of Object.entries(o.want)) take(k,v);
    S.shells+=o.sh; add("insight",o.ins); if(o.extra==="candy") S.cr.candy+=3; if(o.extra==="pearl") S.inv.pearl+=2;
    S.n.orders=(S.n.orders||0)+1; G.log(`${o.who[0]} ${o.who[1]} paid ${o.sh} 🐚 + ${o.ins} 💡${o.extra?" + a gift":""}`); S.orders.splice(i,1); G.touch(); return true; }
  function build(id){ const b=BD[id]; if(!b||!avail(b)||(b.max&&owned(id)>=b.max)) return false; const c=cost(b); if(!afford(c)) return false;
    for(const [k,v] of Object.entries(c)) take(k,v); G.S.reef[id]=owned(id)+1; G.S.n.built=(G.S.n.built||0)+1;
    if(owned(id)===1) G.log(`${b.ic} Built your first ${b.n}!`); G.touch(); G.emit("check"); return true; }
  function research(id){ const t=TD[id]; if(!t||!techOpen(t)) return false; const c=techCost(t); if(amt("insight")<c) return false;
    take("insight",c); G.S.tech[id]=tl(id)+1; if(!t.rep) G.S.techOrder.push(id); G.log(`💡 Researched ${t.n}${t.rep?" "+tl(id):""}`); G.pfx({k:"lvl",t:0,txt:t.n});
    G.touch(); G.emit("check"); return true; }
  function job(id,d){ const C=G.S.crew, j=JOBS.find(x=>x.id===id); if(!j||(j.tech&&!has(j.tech))) return;
    if(d>0){ const n=Math.min(d,C.pop-busy()); if(n>0) C.jobs[id]=(C.jobs[id]||0)+n; } else C.jobs[id]=Math.max(0,(C.jobs[id]||0)+d); G.touch(); }
  const sellValue=()=>{ const S=G.S, m=has("polish")?3:1; return Math.floor(S.inv.castle)*G.SELL.castle+S.inv.palace*G.SELL.palace*m+S.inv.pearl*G.SELL.pearl*m; };
  function sellAll(){ const S=G.S, v=sellValue(); if(!v) return 0; S.shells+=v; S.inv.castle-=Math.floor(S.inv.castle); S.inv.palace=S.inv.pearl=0; G.log(`🐚 Sold treasures for ${fmt(v)} shells`); G.touch(); return v; }

  G.SYS.push({
    init(S){ S.reef=S.reef||{}; S.tech=S.tech||{}; S.techOrder=S.techOrder||[]; S.orders=S.orders||[]; S.orderAcc=S.orderAcc||0;
      S.crew=Object.assign({pop:0,acc:0,starve:0,jobs:{}},S.crew||{}); if(S.inv.insight==null) S.inv.insight=0; if(S.inv.relic==null) S.inv.relic=0; },
    tick(dt){ const S=G.S, C=S.crew;
      // buildings
      BUILD.forEach(b=>{ const n=owned(b.id); if(!n||!b.prod) return; const m=bMult(b)*(b.prod.insight?1+G.bonus("insight"):1); for(const k in b.prod) add(k,b.prod[k]*n*m*dt); });
      // crew arrive, eat, work
      if(C.pop<housing()&&S.inv.plankton>=1){ C.acc+=dt*(1+G.bonus("charm"))*(has("diplo")?2:1)/B.crew.arrive;
        while(C.acc>=1&&C.pop<housing()){ C.acc--; C.pop++; if([1,5,10,25,50,100].includes(C.pop)) G.log(`🦐 ${C.pop===1?"A crew shrimp moved in!":C.pop+" crew shrimp live on your reef!"}`); } }
      else C.acc=0;
      const need=C.pop*B.crew.eat*dt;
      if(S.inv.plankton>=need){ S.inv.plankton-=need; C.starve=0; }
      else { S.inv.plankton=0; C.starve+=dt; if(C.starve>B.crew.starve&&C.pop>0){ C.starve=0; C.pop--;
        if(busy()>C.pop){ const j=Object.keys(C.jobs).sort((a,b)=>C.jobs[b]-C.jobs[a])[0]; C.jobs[j]--; } G.log("🥺 A hungry crew shrimp swam away. Keep plankton stocked!"); } }
      const cm=1+G.bonus("crew");
      JOBS.forEach(j=>{ const n=C.jobs[j.id]||0; if(!n||!j.prod) return; let f=1;
        for(const k in (j.use||{})){ const u=j.use[k]*n*cm*dt; f=Math.min(f,u>0?amt(k)/u:1); }
        f=Math.max(0,Math.min(1,f)); for(const k in (j.use||{})) take(k,j.use[k]*n*cm*dt*f);
        const sm=j.id==="scholar"&&has("school")?2:1, im=1+G.bonus("insight");
        for(const k in j.prod) add(k,j.prod[k]*n*cm*dt*f*sm*(k==="insight"?im:1)); });
      // appraising slowly makes insight even without tags
      add("insight",dt*G.L("appraise")*.00004*(1+G.bonus("insight")));
      // counter
      S.orders=S.orders.filter(o=>o.exp>G.clock);
      if(S.unl.reef){ S.orderAcc+=dt; if(S.orderAcc>=B.order.every){ S.orderAcc=0; if(S.orders.length<B.order.max) newOrder(); } }
      clampAll();
    },
    bonus(k){ const S=G.S, T=G.clock||G.now();
      if(k==="yield:forage"&&has("tides")&&tide(T)>.5) return .3;
      if(k==="yield:burrow"&&has("tides")&&tide(T)<-.5) return .3;
      if(k==="pearl"&&fullMoon(T)) return has("moon")?2:1;
      if(k==="power") return owned("shrine")*.08+(S.crew.jobs.guard||0)*.03+tl("r_power")*.2+(has("moon")&&newMoon(T)?.25:0)+(has("script")?S.inv.relic*.02:0);
      if(k==="care") return owned("spa")*.08;
      if(k==="slots") return owned("nest");
      const rush=(S.rush||0)>T?B.tag.rush:0;                     // printing tags = shop rush
      if(k==="xp") return tl("r_xp")*.1+rush/2;
      if(k==="prod"||k==="crew") return tl("r_prod")*.15+rush;
      return 0; },
    on(ev,kind,n){ const S=G.S;
      if(ev==="award"){ const T=B.tag; if(kind==="load") add("insight",T.loadInsight*n); if(kind==="print"){ add("insight",T.printInsight*n); const t=G.now(); S.rush=Math.min(t+T.rushMax,Math.max(S.rush||0,t)+T.rushPer*n); } clampAll(); }
      if(ev==="check"){
        if(!S.unl.reef&&G.total()>=B.reef.unlock){ S.unl.reef=1; G.log("✨ New: the Reef and Research tabs! Build homes and study the sea."); }
        if(!S.unl.crew&&owned("hut")>0){ S.unl.crew=1; G.log("✨ New: the Crew tab! Shrimp will move into your huts."); } } }
  });
  Object.assign(G,{BUILD,JOBS,TECH,BD,TD,tide,moon,moonIc,fullMoon,newMoon,cost,afford,amt,add,take,owned,avail,techCost,techOpen,has,tl,housing,busy,rates,
    build,research,job,fillOrder,sellAll,sellValue,VALUE,capOf,clampAll});
})(PRAWN.G);

<script>
// ---------- EXPress Prawn: critter friends, dives, the Great Molt (prestige), trophies, golden bubbles ----------
(function(G){
  const B=G.BAL, C=B.crit, D=B.dive, R=G.R, fmt=G.fmt;
  const TYPES=[{id:"coral",n:"Coral",ic:"🪸",col:"#ff7b8a",skill:"forage"},{id:"tide",n:"Tide",ic:"🌊",col:"#4fc3f7",skill:"swim"},
               {id:"sand",n:"Sand",ic:"🏖️",col:"#e6c07b",skill:"burrow"},{id:"abyss",n:"Abyss",ic:"🌑",col:"#a58cff",skill:"pinch"}];
  const beats=(a,b)=>(a+1)%4===b;                               // coral > tide > sand > abyss > coral
  const SPECIES=[
    {t:2,a:3,h:14,st:[["🪲","Sandmite"],["🦂","Dunestinger"],["🦖","Dunerex"]]},
    {t:2,a:2,h:20,st:[["🐌","Shellsnail"],["🐢","Mosshell"],["🐊","Mudjaw"]]},
    {t:0,a:3,h:15,st:[["🦐","Krilly"],["🦀","Pinchkin"],["🦞","Coral Baron"]]},
    {t:0,a:4,h:12,st:[["🐚","Conchy"],["🐙","Octavia"],["🦑","Squidlord"]]},
    {t:1,a:3,h:14,st:[["🐟","Finnow"],["🐠","Glimmerfin"],["🐬","Wavesong"]]},
    {t:1,a:2,h:19,st:[["🦦","Otterpup"],["🦭","Sealord"],["🐳","Bigsplash"]]},

    {t:3,a:5,h:10,st:[["🐍","Eelie"],["🐉","Abyssdrake"],["🐲","Elder Drake"]]}];
  const MON_SP=[0,2,1,6,7,3,2,7];                               // Pinching foe -> species that may befriend you
  const PERKS=[
    {id:"study", n:"Quick Study",     b:3,  d:"+15% skill XP"},
    {id:"claws", n:"Mighty Claws",    b:3,  d:"×1.15 dive power per level"},
    {id:"shell", n:"Hard Shell",      b:3,  d:"×1.15 party HP per level"},
    {id:"thumb", n:"Green Thumb",     b:4,  d:"+15% reef & crew output"},
    {id:"head",  n:"Head Start",      b:4,  d:"Start each molt with supplies"},
    {id:"brain", n:"Big Brain",       b:5,  d:"+20% 💡 insight"},
    {id:"charm", n:"Charm",           b:6,  d:"+15% befriend & crew arrival"},
    {id:"memory",n:"Ancestral Memory",b:8,  d:"Keep 1 more research after molting"},
    {id:"nap",   n:"Power Nap",       b:10, d:"+10% speed while the tool is closed", max:5}];
  const TROPHIES=[
    ["lv10","First steps","🥉",S=>G.SKILLS.some(s=>G.L(s.id)>=10)],["tl50","Busy prawn","🎒",()=>G.total()>=50],["tl150","Seasoned","🧂",()=>G.total()>=150],
    ["tl300","Veteran","🎖️",()=>G.total()>=300],["tl500","Legend","🏆",()=>G.total()>=500],["l99","Maxed out","💯",()=>G.SKILLS.some(s=>G.L(s.id)>=99)],
    ["t100","Tag team","🏷️",S=>S.n.printed>=100],["t1k","Tag master","📇",S=>S.n.printed>=1000],["t5k","Tag legend","🗂️",S=>S.n.printed>=5000],
    ["b10","Builder","🧱",S=>(S.n.built||0)>=10],["b100","Architect","🏙️",S=>(S.n.built||0)>=100],["c10","Little crew","👪",S=>S.crew.pop>=10],["c50","Big crew","🎪",S=>S.crew.pop>=50],
    ["cr1","New friend","🤝",S=>S.cr.list.length>=1],["cr8","Collector","📖",S=>new Set(S.cr.list.map(c=>c.sp)).size>=8],["dex","Complete journal","🌈",S=>Object.keys(S.cr.dex).length>=24],
    ["shiny","Sparkly!","✨",S=>S.cr.list.some(c=>c.shiny)],["evo","Glow up","🦋",S=>S.cr.list.some(c=>c.st>0)],["evo2","Final form","👑",S=>S.cr.list.some(c=>c.st>1)],
    ["d10","Snorkeler","🤿",S=>S.molt.best>=10],["d25","Diver","🌊",S=>S.molt.best>=25],["d50","Deep diver","🦑",S=>S.molt.best>=50],["d75","Abyss walker","🌑",S=>S.molt.best>=75],["d100","Trench king","🔱",S=>S.molt.best>=100],
    ["m1","Fresh shell","🥚",S=>S.molt.n>=1],["m5","Shell shocked","🐣",S=>S.molt.n>=5],["m15","Ancient one","🦕",S=>S.molt.n>=15],
    ["o10","Good service","🛎️",S=>(S.n.orders||0)>=10],["o100","Regulars","🏪",S=>(S.n.orders||0)>=100],["pet","Best friends","💞",S=>S.n.pets>=100],
    ["gold","Bubble popper","🫧",S=>S.n.golds>=10],["moon","Moonlit","🌕",()=>G.fullMoon(G.now())&&G.S.unl.reef],["rich","Shell tycoon","💰",S=>S.shells>=1e6],
    ["hats","Fashionista","🎩",S=>["hat_party","hat_cap","hat_visor","hat_crown"].every(h=>S.own[h])]];

  // ---- critters ----
  const sp=c=>SPECIES[c.sp], form=c=>sp(c).st[c.st];
  const cap=()=>Math.min(100,C.capBase+C.capMolt*G.S.molt.n);

  const statM=c=>(1+(c.lv-1)*.3)*C.stageMult[c.st]*(c.shiny?1.25:1);
  const atk=c=>sp(c).a*statM(c), hp=c=>sp(c).h*statM(c);
  const slots=()=>Math.min(6,3+G.bonus("slots"));

    if(S.cr.party.length<slots()) S.cr.party.push(c.id);

  function critXp(c,x){ const S=G.S; if(c.lv>=cap()) return; c.xp+=x;

      if(G.has("evo")&&c.st<2&&c.lv>=C.evo[c.st]){ const was=form(c)[1]; c.st++; S.cr.dex[c.sp+"-"+c.st]=1; G.log(`🦋 ${was} evolved into ${form(c)[1]} ${form(c)[0]}!`); G.pfx({k:"lvl",t:0,txt:"Evolved!"}); } }
    if(c.lv>=cap()) c.xp=0; }
  function feedCandy(id){ const S=G.S, c=S.cr.list.find(x=>x.id===id); if(!c) return; const cost=1+c.st;
    if(S.cr.candy<cost||c.lv>=cap()) return; S.cr.candy-=cost; critXp(c,needXp(c.lv)-c.xp); G.touch(); }
  function togglePartyMember(id){ const P=G.S.cr.party, i=P.indexOf(id); if(i>=0) P.splice(i,1); else if(P.length<slots()) P.push(id); G.touch(); }

  // ---- dives: the crew auto-resolves down, 10 critters per depth, a big one every 5 depths ----
  const ztype=d=>Math.floor((d-1)/5)%4;
  const isBoss=(d,cell)=>d%D.bossEvery===0&&cell===D.cells-1;
  const eHp=(d,cell)=>D.hp*Math.pow(D.hpGrow,d-1)*(isBoss(d,cell)?D.bossHp:1);
  const eAtk=(d,cell)=>D.atk*Math.pow(D.atkGrow,d-1)*(isBoss(d,cell)?D.bossAtk:1);
  const foe=(d,cell)=>{ const zt=ztype(d), list=SPECIES.map((s,i)=>i).filter(i=>SPECIES[i].t===zt), s=list[(d*7+cell)%list.length];

  const leader=()=>1+G.L("pinch")/50;

  const partyHp=()=>party().reduce((a,c)=>a+hp(c),0)*(1+G.bonus("hp"))*Math.pow(1.15,perkLv("shell"));
  function diveTick(dt){ const S=G.S, V=S.dive; if(!V.on||!G.has("dive")) return; const P=party(); if(!P.length) return;
    const pa=partyAtk(V.d), ph=partyHp(); if(V.php<0||V.php>ph) V.php=ph;

  // ---- the Great Molt ----
  const essGain=()=>{ const S=G.S; return S.dive.max<5?0:Math.floor(B.molt.base*Math.pow(B.molt.depthGrow,S.dive.max)+Math.max(0,G.total()-B.molt.lvlFrom)/B.molt.lvlDiv); };

    if(!G.has("evo")) return "Research Evolution Theory so critters can evolve";

    if(!S.molt.n) return `Molt for ✨ essence and permanent perks (+${essGain()} now)`;
    return `Dive deeper: record depth ${S.molt.best} · generation ${S.molt.n+1}`; }

  G.SYS.push({
    init(S){ S.cr=Object.assign({list:[],party:[],candy:0,dex:{},next:1},S.cr||{});
      S.dive=Object.assign({on:0,d:1,cell:0,ehp:-1,php:-1,rest:0,max:0,wipes:0,farm:0},S.dive||{});

<script>
// ---------- EXPress Prawn: screen module (tank view + tabs). Starts the clock at the bottom. ----------
(function(G){

  const IC={plankton:"🦠",kelp:"🥬",snack:"🍤",sand:"⏳",pearl:"🦪",castle:"🏰",palace:"🏯",insight:"💡",relic:"🔮",shells:"🐚",candy:"🍬"};

  // ---------- tank art (draws on any 2D context; size 480×300) ----------
  function prawnArt(g,S,x,y,s,dr,t,o){
    o=o||{}; const pale=!o.mini&&S.h<=0?.35:0, wig=Math.sin(t*(S.train==="swim"&&!o.mini?14:6));

    const hg=g.createRadialGradient(12,-6,3,16,0,24); hg.addColorStop(0,pale?"#ffe8e2":"#ffcabd"); hg.addColorStop(1,pale?"#f2b6ad":"#ff7563");

    g.fillStyle=pale?"#f0b2a8":"#ff6f5e"; g.beginPath(); g.moveTo(26,-12); g.lineTo(50,-20); g.lineTo(32,-4); g.fill();
    g.strokeStyle=pale?"#e5a49a":"#e0574a"; g.lineWidth=1.6;
    for(const k of [0,1]){ const sw=Math.sin(t*2+k*1.7)*14; g.beginPath(); g.moveTo(30,-6+k*4); g.quadraticCurveTo(70,-50+sw-k*10,120+k*10,-30+sw*1.3+k*14); g.stroke(); }
    g.strokeStyle="#c94b3f"; g.lineWidth=3; g.beginPath(); g.moveTo(20,-10); g.lineTo(23,-20); g.stroke();
    const blink=((t+(o.seed||0))%4)<.12;
    g.fillStyle="#fff"; g.beginPath(); g.arc(24,-22,8,0,7); g.fill();
    if(blink){ g.strokeStyle="#222"; g.lineWidth=2; g.beginPath(); g.moveTo(18,-22); g.lineTo(30,-22); g.stroke(); }
    else { g.fillStyle="#1d1d2b"; g.beginPath(); g.arc(26,-21,4.8,0,7); g.fill(); g.fillStyle="#fff"; g.beginPath(); g.arc(27.5,-23,1.7,0,7); g.fill(); }
    g.fillStyle="rgba(255,90,120,.45)"; g.beginPath(); g.ellipse(24,4,5,3,0,0,7); g.fill();
    g.strokeStyle="#8a2c25"; g.lineWidth=1.8; g.beginPath();

      if(S.hat==="hat_crown"){ g.fillStyle="#ffcc00"; g.beginPath(); g.moveTo(-13,0); g.lineTo(-13,-16); g.lineTo(-6,-8); g.lineTo(0,-20); g.lineTo(6,-8); g.lineTo(13,-16); g.lineTo(13,0); g.fill(); g.fillStyle="#e0245e"; g.beginPath(); g.arc(0,-6,2.5,0,7); g.fill(); }
      g.restore(); }
    g.restore();
  }
  function makeTank(){
    const V={px:150,py:150,dir:1,tx:200,ty:150,anim:0,crew:[],cr:[],gold:null,nextGold:45,
      bub:Array.from({length:14},()=>({x:R()*480,y:R()*300,r:1+R()*3,s:10+R()*20})),
      weeds:Array.from({length:6},(_,i)=>({x:20+i*85+R()*30,h:50+R()*60}))};
    V.frame=function(g,t,dt){ const S=G.S, id=S.train, sk=G.SK[id];
      const tide=G.tide(G.now()), surf=18+(1-tide)*6, hr=new Date(G.now()*1000).getHours(), night=hr<7||hr>=19;
      const sea=g.createLinearGradient(0,0,0,300); sea.addColorStop(0,night?"#3a8fd0":"#5fd0ff"); sea.addColorStop(1,night?"#0d3f7a":"#1667b8");
      g.fillStyle=sea; g.fillRect(0,0,480,300);
      const sky=g.createLinearGradient(0,0,0,surf); sky.addColorStop(0,night?"#1b2550":"#bfe9ff"); sky.addColorStop(1,night?"#33407a":"#e8f8ff");
      g.fillStyle=sky; g.beginPath(); g.moveTo(0,0); g.lineTo(480,0); g.lineTo(480,surf); for(let x=480;x>=0;x-=20) g.lineTo(x,surf+Math.sin(x/30+t*2)*1.5); g.fill();
      g.font="14px serif"; g.textAlign="center"; g.fillText(night?G.moonIc(G.now()):"☀️",456,Math.max(13,surf-3)); g.textAlign="left";
      g.fillStyle="rgba(255,255,255,.08)"; for(let i=0;i<4;i++){ g.beginPath(); g.moveTo(60+i*110+Math.sin(t+i)*20,surf); g.lineTo(100+i*110,surf); g.lineTo(40+i*120,300); g.lineTo(10+i*120,300); g.fill(); }
      V.weeds.forEach((w,i)=>{ g.strokeStyle="#2fae6a"; g.lineWidth=7; g.lineCap="round"; g.beginPath(); g.moveTo(w.x,282);
        g.quadraticCurveTo(w.x+Math.sin(t*1.3+i)*16,282-w.h*.6,w.x+Math.sin(t*1.1+i)*10,282-w.h); g.stroke(); });
      g.fillStyle="#f1d79a"; g.beginPath(); g.moveTo(0,300); g.lineTo(0,278); for(let x=0;x<=480;x+=40) g.quadraticCurveTo(x+20,272+(x%80?4:-3),x+40,278); g.lineTo(480,300); g.fill();
      // reef buildings along the sand
      let bx=30; g.font="20px serif"; G.BUILD.forEach(b=>{ const n=G.owned(b.id); if(!n) return; g.fillText(b.ic,bx-10,291);
        if(n>1){ g.font="bold 10px sans-serif"; g.fillStyle="#7a5a1c"; g.fillText(n,bx+10,296); g.font="20px serif"; } bx+=44; });
      if(S.inv.castle+S.inv.palace>=1){ g.font="24px serif"; g.fillText(S.inv.palace>=1?"🏯":"🏰",446,288); }

      // crew shrimp
      const nc=Math.min(8,S.crew.pop); while(V.crew.length<nc) V.crew.push({x:R()*480,y:120+R()*140,tx:R()*480,ty:120+R()*140,d:1,s:R()*9}); V.crew.length=nc;
      const hue=[0,330,35,285,195,150][S.molt.n%6];               // each generation gets a new shell color
      V.crew.forEach(c=>{ if(Math.hypot(c.tx-c.x,c.ty-c.y)<5){ c.tx=30+R()*420; c.ty=110+R()*150; } const sp=25*dt;
        c.x+=Math.max(-sp,Math.min(sp,c.tx-c.x)); c.y+=Math.max(-sp,Math.min(sp,c.ty-c.y))*.6; if(Math.abs(c.tx-c.x)>2) c.d=c.tx>c.x?1:-1;
        prawnArt(g,S,c.x,c.y,.24,c.d,t+c.s,{mini:1,seed:c.s}); });
      // where the prawn goes
      if(id==="pinch"&&!S.stall){ V.tx=250; V.ty=170; }
      else if(id==="burrow"){ V.ty=245; if(Math.abs(V.px-V.tx)<8) V.tx=120+R()*240; }
      else if(id==="swim"){ V.ty=120+Math.sin(t)*40; if(Math.abs(V.px-V.tx)<10) V.tx=V.tx>240?130:350; }
      else if(Math.abs(V.px-V.tx)<6&&Math.abs(V.py-V.ty)<6&&R()<.01){ V.tx=120+R()*240; V.ty=100+R()*120; }
      const sp=(id==="swim"?140:45)*dt; V.px+=Math.max(-sp,Math.min(sp,V.tx-V.px)); V.py+=Math.max(-sp,Math.min(sp,V.ty-V.py))*.7;
      if(Math.abs(V.tx-V.px)>2) V.dir=V.tx>V.px?1:-1; if(id==="pinch") V.dir=1;

      E.set("starter"); E.set("pickedAll"); E.addMon(id,5); E.set("starterId",id);
      await E.say(`{P} chose ${sp.n}! It wiggled happily!`); E.jingle();
      const rid=COUNTER[id];
      await E.say("Hey, I want one too! Then I'll take this one!",R.toUpperCase());
      await E.say(`${R} took ${SPECIES[rid].n}!`);
      await E.say("Come on, {P}! Let's see whose partner is tougher!",R.toUpperCase());
      const res=await E.battle({name:R,rival:1,team:[[rid,5]],lose:"What?! That was beginner's luck!",canLose:1});
      await E.say(res==="win"?"Hmph. I'll get you next time!":"Ha! Told you mine was tougher!",R.toUpperCase());
      await E.say("I'm off to Coralbrook to win the Pearl Badge. Catch you on the next current!",R.toUpperCase());
      await E.npcWalk("kip",[[8,7],[5,7],[5,8]]); E.set("kipLeft");

      E.set("journal"); E.give("snack",5);
      await E.say("And these 5 Bubble Snacks! Offer one to a worn-out wild critter and it may join your team.","PROF. KELPWELL");
      await E.say("North, past the Seagrass Path, is Coralbrook. Elder Brine guards the Pearl Badge there.","PROF. KELPWELL");
      await E.say("Win all eight Reef Badges and the Great Trench will open for you. Good luck, {P}!","PROF. KELPWELL");
    },

      if(!E.f("gruntGone")){ await E.say("H-help! That crab wants my whole shell collection!","MR. WHELK"); await E.trainer("grunt"); return; }

      await E.say("Team Trawl has been dragging nets all over the reef lately. Be careful.","MR. WHELK");
    },
    async gruntWin(E){ await E.npcWalk("grunt",[[9,0]]); E.set("gruntGone"); await EV.whelk(E); },
    async nurse(E){
      const y=await E.yes("Welcome to the Bubble Clinic! Shall I rest your critters?","NURSE INKA");

      if(E.f("badge1")){ await E.say("Seven more Elders are waiting across the Coral Sea. Keep swimming, {P}.","ELDER BRINE"); return; }
      await E.say("Hrmph. Another young swimmer after the Pearl Badge?","ELDER BRINE");
      await E.say("I've guarded this hall for sixty tides. My critters' shells are tougher than barnacles!","ELDER BRINE");
      await E.say("Show me what you've got!","ELDER BRINE");
      const res=await E.battle({name:"Elder Brine",boss:1,team:[["oldhorn",10],["snipsnap",11],["starlet",12]],lose:"Well, I'll be..."});
      if(res!=="win") return;
      await E.say("Your bond with your critters is the real thing.","ELDER BRINE");
      await E.say("Take the Pearl Badge. You've earned it!","ELDER BRINE");
      E.set("badge1"); E.set("kipOutside"); E.jingle(1);
      await E.say("{P} received the PEARL BADGE!");
      await E.say("Seven more Elders are waiting across the Coral Sea. Keep swimming!","ELDER BRINE");
    },
    async coralEnter(E){ if(E.f("kipOutside")) await EV.kipOutside(E); },
    async kipOutside(E){
      E.faceNpc("kip2");
      await E.say("{P}! You got the Pearl Badge too?! Then I'll race you to the next one!",R.toUpperCase());
      await E.say("Oh, and watch out. I saw Team Trawl dragging a huge net toward the Sunken Ship...",R.toUpperCase());
      await E.say("Catch you on the next current!",R.toUpperCase());
      await E.npcWalk("kip2",[[11,10],[10,10],[10,14]]); E.set("kipOutside",0); E.set("kipDone");
      await E.chapterEnd();
    }
  };

  return {TYPES,CHART,eff,MOVES,SPECIES,STARTERS,ITEMS,PERKS,MAPS,EV,RIVAL:R,EVO_LV,TEAM_MAX:4};

        for(let t=0;t<=1;t+=.02){ const x=3+t*21, y=26-t*12+Math.sin(t*Math.PI*2)*4; e(x,y,3.6-t*.4,3.6-t*.4,t%.1<.05?dk(c,.1):c); }
        b(25,11,5.5,4.5,c); e(26,14,3.6,1.6,lt(c,.4)); e(26,9,2,2,"#ffffff"); p(27,9,INK); l(27,14,30,13,INK);
        for(let i=0;i<5;i++) p(8+i*4,20-i*2.4,"#ffe14d");
      } else {   // ghost shrimp
        l(25,10,31,1,lt(c,.3)); l(24,10,30,4,lt(c,.3));
        for(let i=0;i<6;i++){ const x=24-i*3.6, y=14+Math.sin(i*.55)*7; b(x,y,4.6-i*.4,4-i*.3,i%2?c:lt(c,.25),false); }
        e(5,24,3,2,lt(c,.4)); e(26,12,2,2,"#ffffff"); p(26,12,"#5f7fd8");
        for(let i=0;i<4;i++) l(12+i*3,19,11+i*3,25,dk(c,.15));
      }
    },true);
    return MC[id]=cv; }

  return {CLS,SPCLS,SK,GEAR,ITEMS,MON,ZONES,MAPS,EV,tile,ANIM,ent,mon};
})();
