<script>
// ---- self-update: checks the public mirror when online, keeps the newest build on this computer ----
// Newer build saved earlier -> run that instead of this file. Add ?local to the address to skip it.
var TT_BUILD=1795183736614;
(function(){
  var REMOTE="https://raw.githubusercontent.com/blsxf/express-pawn-tools/main/tagtool/", KEY="tagtool.update";
  function db(){ return new Promise(function(res,rej){ var r=indexedDB.open("tagtool",1);
    r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function get(k){ return db().then(function(d){ return new Promise(function(res,rej){ var q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); }; }); }); }
  function put(k,v){ return db().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=function(){ rej(t.error); }; }); }); }
  // Builds are stamped with the build time (ms); one dated more than a day ahead is a bad stamp -> ignore it,
  // or it would outrank every real build forever.
  function sane(v){ return v>0 && v<=Date.now()+864e5; }
  function saved(){ try{ var v=+localStorage.getItem(KEY)||0; return sane(v)?v:0; }catch(e){ return 0; } }
  function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} put("build",null).catch(function(){}); }
  var local=/[?&]local\b/.test(location.search);
  if(!window.TT_RUNNING && !local && saved()>TT_BUILD){        // swap to the saved newer build
    document.write('<plaintext hidden>');                      // stop this (older) page from running
    var html=get("build");
    window.addEventListener("DOMContentLoaded",function(){ html.then(function(b){
      if(!b||b.v!==saved()) throw 0;
      window.TT_RUNNING=b.v; document.open(); document.write(b.html); document.close();
    }).catch(function(){ forget(); location.reload(); }); });
    return;
  }
  if(!window.TT_RUNNING){ window.TT_RUNNING=TT_BUILD;                 // this file is newest
    var raw=0; try{ raw=+localStorage.getItem(KEY)||0; }catch(e){}
    if(raw && (raw<=TT_BUILD || !sane(raw))) forget(); }
  window.addEventListener("load",function(){ setTimeout(function(){
    fetch(REMOTE+"version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
      if(!sane(+j.v) || !(+j.v>window.TT_RUNNING) || +j.v===saved()) return;
      return fetch(REMOTE+encodeURIComponent(j.file||"Tag Tool.html")+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
        if(t.indexOf("var TT_BUILD="+j.v+";")<0) return;           // incomplete / mismatched download
        return put("build",{v:+j.v,html:t}).then(function(){
          localStorage.setItem(KEY,String(j.v));
          var b=document.createElement("div");
          b.textContent="Tag Tool update ready — click here to switch (or it switches next time you open it)";
          b.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;background:#0F2A5C;color:#fff;padding:10px 16px;border-radius:8px;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)";
          b.onclick=function(){ location.reload(); }; document.body.appendChild(b);
        });
      });
    }).catch(function(){});                                     // offline or mirror not set up: keep going
  },3000); });
})();
</script>
<script>
/* =====================================================================
   TAG TOOL SETTINGS  —  change things here.
   Open this file in Notepad, edit, save, then reload the page.
   Keep the quotes and commas exactly as they are.
   ===================================================================== */
const CONFIG = {

  shop: "Express Pawn",

  // Screen parts hidden by default: hand, search, selall, add, spot, save
  hidden: [],

  // ---- Colors on the printed tags (hex codes) --------------------------
  colors: {
    navy:   "#0F2A5C",   // header bands
    yellow: "#FFD400",   // price box (front) + layaway total (back)
    red:    "#C8102E",   // the 0 marks on the "Line up backs" test sheet
    white:  "#FFFFFF",
  },

  // ---- Words printed on the tags --------------------------------------
  words: {
    layaway:  "12-MONTH LAYAWAY!",  // navy header on the back
    frontLayaway: "LAYAWAY ON BACK!", // big navy band at the bottom of the front
    frontDown: " Down",           // front payment row (only if layout.front.payments > 0)
    backTotal: "",                // small word after the back's layaway total, e.g. "total" ("" = none)
    perMonth: "/mo",              // front: "$21/mo"
    backPerMonth: " monthly",     // back:  "$21 monthly"
    backDown: " Down",            // back:  "$62 Down"
    barcode:  "Barcode",          // back: "Barcode sticker" hint where the sticker goes
    withPrefix: "w/ ",   // printed before the extras on the back: "w/ Case, 2 Mags"
  },

  // ---- Layaway math ----------------------------------------------------
  layaway: {
    markupPercent: 10,   // price + 10%
    roundUpTo:     10,   // total rounds UP to the next $10
    downPercent:   20,   // 20% down
    months:        12,   // rest split over 12 months
  },

  // ---- Tag shape (in "units": every tag is 216 units tall) ---------------
  layout: {
    header:      22,      // navy LAYAWAY! band on the back
    lineWeight: .013,     // grid line thickness (share of tag width)
    barcodeH:    1.05,    // blank space kept at the bottom of the back for the 2.5" x 1" sticker, inches
    extras:      34,      // extras row on the back (blank when the gun has none, so every back matches)
    // white edge around the BACK of each tag, inches. Two-sided printers never land the back
    // exactly behind the front (this one moves ~1/16" from sheet to sheet). The back has no
    // outline or box, just this wide white edge, so a small drift doesn't show when you cut.
    backMargin:  .15,
    // how far the back's navy/yellow bands and black rules run PAST the left/right cut, inches. They line up
    // with the next tag's, so any cut lands inside them and two-sided drift never shows a white sliver.
    backBleed:   .1,
    // The shop printer lands backs a little off the fronts, the same way every time.
    // Every back page is moved this much (inches) to make up for it, as you look at the
    // printed back sheet held tall: right = to the right, down = toward the bottom.
    // Set 11-18-2026 from test print #3 (backs came out ~1/8" right and a bit high on the tag).
    // "Line up backs…" on a computer adds its own small fix on top of this.
    backShift: { right:.06, down:.125 },
    // true = the back reads right side up when you flip the tag UP (over its top edge),
    // the way it hangs on a gun. false = reads right when you turn it over sideways like a page.
    backFlipUp: true,
    // size of the text on the BACK (1 = old size, 1.2 = 20% bigger). Text never grows past its box.
    backText:    1.2,
    // front of the gun tag, under the make/model/caliber rows. The yellow price gets everything else.
    // payments: 0 = no payment row (front just says LAYAWAY ON BACK!). ~28 adds "$20 Down | $7/mo" under the band.
    front: { layawayBand:32, payments:0, downScale:.8 },
  },

  // ---- Checked before every print ---------------------------------------
  // Smallest text allowed (font size in points; 72 = 1 inch). A tag that would print smaller
  // gets fixed automatically (extras on 2 lines, words below shortened) or listed before printing.
  minText: { brand:16, model:10, caliber:12, price:30, monthly:14, hook:14, total:18, totalLabel:7, down:11, extras:9 },
  // Words the tool may shorten on the MODEL line, only when the full name won't fit big enough.
  shorten: [["Government","Gov't"],["Semi-Automatic","Semi-Auto"],["Automatic","Auto"],["Tactical","Tac"],
            ["Standard","Std"],["Limited","Ltd"],["Edition","Ed."],["Anniversary","Anniv."],["Commemorative","Comm."]],

  // ---- Manager fixes console: Ctrl+Shift+F.  PIN ("" = no PIN) ---------
  managerPin: "1234",
  // Built-in name fixes for every computer, e.g.
  //   {field:"model", find:"Spear Rifle", replace:"Spear"}
  //   {field:"model", find:"G19", replace:"19", ifField:"brand", ifValue:"Glock"}
  fixes: [],

  // ---- Tag templates -----------------------------------------------------
  // fields: boxes in the Edit panel.  rows: the big lines at the top of the
  // front ([field, height, text size, may wrap to 2 lines]).
  // sizes: sheet choices (w/h in inches), first one is the default.
  types: {
    guns: {
      name:  "Guns",
      twoSided: true,
      fields: [["brand","Make"],["model","Model"],["caliber","Caliber"],["extras","Comes with (back)"]],
      rows:   [["brand",36,.74,false],["model",28,.68,true],["caliber",24,.78,false]],
      sizes: [
        {label:'4 per sheet (big)', w:4.1, h:3.62, orient:"landscape"},
        {label:'6 per sheet (3 x 2)', w:3.5, h:4.0, orient:"landscape"},
        {label:'9 per sheet (small)', w:3.0, h:2.65, orient:"landscape"},
        {label:'12 per sheet (compact)', w:2.625, h:2.65, orient:"landscape"},   // narrowest that still fits the 2.5" barcode sticker
      ],
    },
  },

  // Tag types.  The tool picks one for each gun from Bravo's "Category" column,
  // and prints them all in one go (each type on its own sheets).
  // size: which sheet size above (0 = first).  categories: Bravo categories for this type.
  // group: its own heading in the Sizes menu (default: the template's name, "Guns").
  // designDate: when this type's design last matched its sample (Sizes menu ✎ > Add sample). A sample added after
  //   this date is the spec: rebuild the design to match it, then move designDate up. No date = no design yet.
  // Change sizes here or with "Sizes ▾" in the top bar.
  tagTypes: [
    {id:"handgun", cat:"guns", name:"Handguns",  size:3, designDate:"2026-11-19", categories:"Pistol|Revolver|Handgun|Derringer"},
    {id:"rifle",   cat:"guns", name:"Long Guns", size:0, designDate:"2026-11-19", categories:"Rifle|Shotgun"},
    {id:"general", cat:"guns", group:"General Merchandise", name:"General Merchandise", size:3, designDate:"2026-11-19",   // same small format as Handguns
     extrasOnFront:true},   // "Comes with" (bag, batteries, charger...) prints in the caliber row; back leaves it off
    // Electronics: each has its own tag design (design: drawing code in src/types.js DESIGNS; placeholders for now)
    {id:"tv",       cat:"guns", group:"Electronics", name:"TVs",       design:"tv",       size:3, extrasOnFront:true, categories:"TV|TVs|Television|Televisions"},
    {id:"computer", cat:"guns", group:"Electronics", name:"Computers", design:"computer", size:3, extrasOnFront:true, categories:"Computer|Computers|Laptop|Laptops"},
    {id:"monitor",  cat:"guns", group:"Electronics", name:"Monitors",  design:"monitor",  size:3, extrasOnFront:true, categories:"Monitor|Monitors"},
  ],
  // No Category column (old gun-only report): this tag type (change it on the tag's Edit panel)
  defaultTagType: "rifle",
  // Any other Bravo category (tools, electronics, music...): this tag type
  otherTagType: "general",
  // Categories with no tag format yet: they land on General Merchandise but start unchecked (Skip).
  // Matched at the start of the category, so "Jewel" covers Jewelry / Jewelry - Gold.
  skipCategories: "Computer|Jewel",

  // Game consoles we take in.  First match wins, so keep the specific ones (Lite, Pro, Digital) above the general.
  //  match: words in Bravo's make/model/description.  kit: what a complete one comes with ("2 Controllers" = two).
  //  price: what a complete one sells for.  When the tag's price is lower by the deductions below
  //  (e.g. PS5 Slim Disc $410 = no controller, $400 = no controller + no HDMI), the tag leaves those off
  //  even if the description doesn't say.  Leave price out (or null) to skip that check.
  // Power cords / chargers are required to take a console in, so they always print.
  consoles: [
    {name:"Switch Lite",      match:"SWITCH LITE",                                kit:["Charger"]},
    {name:"Switch",           match:"NINTENDO.*\\bSWITCH|SWITCH (?:OLED|2)",     kit:["Joy-Cons","Dock","Power Cord","HDMI Cord"]},
    {name:"PS5 Pro",          match:"(PS ?5|PLAYSTATION ?5).*\\bPRO\\b",          kit:["Controller","Power Cord","HDMI Cord"]},
    {name:"PS5 Slim Digital", match:"(PS ?5|PLAYSTATION ?5).*\\bDIGITAL|\\bDIGITAL\\b.*(PS ?5|PLAYSTATION ?5)", kit:["Controller","Power Cord","HDMI Cord"]},
    {name:"PS5 Slim Disc",    match:"(PS ?5|PLAYSTATION ?5)",                     kit:["Controller","Power Cord","HDMI Cord"], price:440},
    {name:"Xbox Series X",    match:"SERIES ?X",                                  kit:["Controller","Power Cord","HDMI Cord"]},
    {name:"Xbox Series S",    match:"SERIES ?S",                                  kit:["Controller","Power Cord","HDMI Cord"]},
    {name:"Meta Quest 3",     match:"QUEST ?3S?",                                 kit:["2 Controllers","Charger"]},
    {name:"Handheld PC",      match:"STEAM ?DECK|ROG ?ALLY|LEGION ?GO|MSI ?CLAW",  kit:["Charger"]},
  ],
  // Taken off the price for each missing piece (used with the console prices above)
  consoleDeduct: {"Controller":30, "Joy-Cons":30, "HDMI Cord":10},
  // Always on a console tag: we don't take one in without it
  consoleRequired: ["Power Cord","Charger"],
  // Cordless tools (M18, 20V, FUEL...): we require at least 1 battery and a charger, so these always print
  toolRequired: ["Battery","Charger"],
  // Old tag types, no longer shown
  retiredTypes: ["wall","smallwall"],
};

</script>
<script>
// ---- "Tag Tool Settings.js" sits next to this page: managers change words, sizes and colors in Notepad ----
// Only what's written in that file changes; everything else stays as built.
// No file = normal settings. A typo in it = normal settings + a message on screen.
var SETTINGS={state:"bad",unknown:[]};
function TAG_SETTINGS(o){
  var bad=[];
  (function check(dst,src,path){                      // first make sure every value fits
    for(var k in src){ var p=path?path+"."+k:k, v=src[k], d=dst[k];
      if(!(k in dst)) bad.push(p);
      else if(d&&typeof d==="object"&&!Array.isArray(d)){ if(v&&typeof v==="object"&&!Array.isArray(v)) check(d,v,p); else bad.push(p); }
      else if(Array.isArray(d)!==Array.isArray(v)||typeof d!==typeof v) bad.push(p);
    }
  })(CONFIG,o||{},"");
  (function merge(dst,src,path){                      // then copy over the ones that fit
    for(var k in src){ var p=path?path+"."+k:k, v=src[k], d=dst[k];
      if(bad.indexOf(p)>=0) continue;
      if(d&&typeof d==="object"&&!Array.isArray(d)) merge(d,v,p); else dst[k]=v;
    }
  })(CONFIG,o||{},"");
  SETTINGS.unknown=bad; SETTINGS.state="ok";
}
</script>
<script src="Tag Tool Settings.js" onerror="SETTINGS.state='missing'"></script>

}

  --bg:#0B1628;--panel:#13223F;--panel2:#1A2C4F;--line:#24365C;--line2:#33497A;
  --ink:#E8ECF3;--ink2:#A9B4C8;--ink3:#7686A3;--acc:var(--yellow);

.card:hover{transform:translateY(-2px);outline:2px solid var(--acc);outline-offset:2px}
.card canvas{display:block;background:#fff;border-radius:2px}
.card .tick{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:var(--yellow);color:var(--onyellow);display:flex;align-items:center;justify-content:center;font-size:14px;padding:0}
.card .tick svg{stroke-width:3.2}
.card.off{opacity:.25}
.card.warn::after{content:"!";position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:var(--warn);color:#1a1a1a;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.card.off .tick{background:var(--off)}.card.off .tick svg{visibility:hidden}
#noMatch{color:var(--ink3);padding:30px 0}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:10}
#bar .in{padding:10px 64px 10px 16px;display:flex;align-items:center;gap:20px}
#count{font-size:15px;font-weight:700;line-height:1.25}
#count small{font-size:13px;font-weight:400;color:var(--ink3);margin-left:6px}
#count em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--ink3)}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
#spots{display:flex;gap:14px;align-items:center}
.spot{display:flex;align-items:center;gap:6px}
.spot span{font-size:12px}
.sp{display:inline-grid;gap:3px}
#spots button{border:0;border-radius:2px;background:var(--line2);padding:0}
#spots button.used{background:repeating-linear-gradient(45deg,var(--panel2) 0 3px,var(--line) 3px 6px)}
#spots button.start{background:var(--yellow)}
#spots button:hover{outline:1px solid var(--ink)}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
#print{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);border:0;color:var(--onyellow);font-size:15px;font-weight:800;height:40px;padding:0 22px;border-radius:8px}
#print:hover{background:var(--yellow2)}
#print:disabled{opacity:.35;cursor:default}
#print svg{font-size:17px}
.menuwrap{position:relative}
#saveMenu{position:absolute;bottom:44px;right:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.35);padding:5px;min-width:190px}
#saveMenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:6px;font-size:14px}
#saveMenu button:hover{background:var(--panel2)}
#saveMenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* shared-folder icon (bottom right) */
#shareBtn{position:fixed;right:14px;bottom:14px;z-index:12;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:17px;padding:0}
#shareBtn:hover{color:var(--ink)}
#shareBtn i{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
#shareBtn.on i{background:var(--good)}

/* drawer */
.shade{position:fixed;inset:0;background:var(--shade);z-index:30}
.pr-ov{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center}
.pr-view{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.pr-grid{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;padding:16px}
.pr-slot{width:220px;height:150px;border:3px solid #333;border-radius:10px;background:#111;color:#ddd;font:700 26px/1 monospace;letter-spacing:3px;cursor:pointer}
.pr-slot.pr-on{border-color:var(--yellow);color:#fff;box-shadow:0 0 22px rgba(255,212,0,.35)}
/* EXPress Prawn (hidden, in the probe overlay) */
.xp-root{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:960px;width:100%;padding:16px;max-height:100vh;overflow:auto;color:#eaf6ff;font:600 14px system-ui,sans-serif}
.xp-left{flex:0 1 480px;min-width:0;display:flex;flex-direction:column;gap:8px}
.xp-right{flex:1 1 300px;min-width:260px;max-width:420px;display:flex;flex-direction:column;gap:8px;background:#0d2a4a;border-radius:14px;padding:12px}
.xp-head{display:flex;align-items:baseline;gap:10px}
.xp-name{background:none;border:0;border-bottom:2px dashed #2f5b8a;color:#ffd1c8;font:800 24px system-ui,sans-serif;width:10ch;outline:none}
.xp-stage{color:#8fb7dd;font-size:13px}
.xp-tank{width:100%;aspect-ratio:8/5;border-radius:14px;border:4px solid #8fd3ff;background:#1667b8}
.xp-doing{color:#bfe3ff;min-height:18px}
.xp-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xp-bar span{font-size:12px;color:#8fb7dd}.xp-bar i{display:block;height:10px;border-radius:6px;background:#0a1e36;overflow:hidden}
.xp-bar b{display:block;height:100%;background:#ff8f80;transition:width .4s}.xp-bar b.low{background:#ff4d6d}
.xp-care{display:flex;gap:8px}.xp-care button,.xp-tabs button,.xp-sell button{flex:1;border:0;border-radius:10px;padding:9px;background:#1d4f82;color:#fff;font:700 14px system-ui,sans-serif;cursor:pointer}
.xp-care button:hover,.xp-tabs button:hover,.xp-sell button:hover{background:#2a66a6}
.xp-inv{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:#cfe7ff}.xp-inv small{color:#7fa6cc;font-size:11px}.xp-inv .xp-full{color:#ffd400}
.xp-title{font:900 26px system-ui,sans-serif;letter-spacing:1px;color:#ffd400;text-align:center;text-shadow:0 2px 0 #ff6f5e}
.xp-tabs{display:flex;gap:6px}.xp-tabs button.on{background:#ffd400;color:#0F2A5C}
.xp-panel{flex:1;overflow:auto;max-height:52vh;display:flex;flex-direction:column;gap:6px}
.xp-sk,.xp-item{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:2px 8px;border:2px solid transparent;border-radius:10px;background:#123a63;color:#eaf6ff;padding:7px 10px;text-align:left;cursor:pointer;font:600 14px system-ui,sans-serif}
.xp-sk:hover,.xp-item:hover{border-color:#2f6aa5}.xp-sk.on,.xp-item.on{border-color:#ffd400}
.xp-ic{font-size:20px}.xp-skn small,.xp-item small{display:block;font-size:11px;color:#8fb7dd;font-weight:500}
.xp-lv{font:800 18px system-ui,sans-serif;color:#ffd400}
.xp-prog{grid-column:1/-1;height:5px;border-radius:3px;background:#0a1e36;overflow:hidden}.xp-prog b{display:block;height:100%;background:#3ecf74}
.xp-item{grid-template-columns:1fr auto}.xp-item small{grid-column:1}.xp-item span{grid-row:1/3;grid-column:2;color:#ffd400;font-weight:800}
.xp-item.dim{opacity:.45}
.xp-goal{background:#123a63;border-radius:10px;padding:6px 10px;color:#ffe680;font-size:13px}
.xp-tabs{flex-wrap:wrap}.xp-tabs button{flex:1 0 auto;position:relative;padding:6px 8px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:1px}
.xp-tabs button span{font-size:10px;font-weight:700}.xp-tabs button i{position:absolute;top:3px;right:5px;width:8px;height:8px;border-radius:50%;background:#ff4d6d}
.xp-row,.xp-cr{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:2px 8px;border:2px solid transparent;border-radius:10px;background:#123a63;color:#eaf6ff;padding:7px 10px;text-align:left;font:600 14px system-ui,sans-serif}
button.xp-row{cursor:pointer}button.xp-row:hover{border-color:#2f6aa5}.xp-row.on,.xp-cr.on{border-color:#ffd400}.xp-row.dim{opacity:.5}
.xp-row:not(:has(.xp-ic)):not(:has(.xp-crf)){grid-template-columns:1fr auto}
.xp-skn em{font-style:normal;color:#ffd400;font-size:12px}.xp-cost{color:#cfe7ff!important}.xp-no{color:#ff8a9a}
.xp-price{color:#ffd400;font-weight:800}
.xp-pm{display:flex;gap:4px}.xp-pm button{border:0;border-radius:8px;background:#1d4f82;color:#fff;font:700 13px system-ui,sans-serif;padding:5px 8px;cursor:pointer}
.xp-pm button:disabled{opacity:.4;cursor:default}
.xp-crf{font-size:26px;line-height:1}.xp-crf sup{font-size:11px}
.xp-meter{display:block;height:8px;border-radius:5px;background:#0a1e36;overflow:hidden;margin:4px 0}.xp-meter b{display:block;height:100%;background:#3ecf74}
.xp-meter.xp-thin{grid-column:1/-1;height:5px;margin:2px 0 0}.xp-meter.xp-hp b{background:#ff6f7d}
.xp-note{font-size:12px;color:#a9cdee;line-height:1.45;padding:2px 4px}.xp-note b{color:#fff}
.xp-sub{font-weight:800;color:#ffd400;margin-top:6px}
.xp-dex{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:22px;text-align:center}.xp-dex span{background:#123a63;border-radius:8px;padding:3px 0}
.xp-big{border:0;border-radius:12px;padding:12px;background:#ff8f80;color:#2a0d0a;font:900 16px system-ui,sans-serif;cursor:pointer}
.xp-big.on{background:#3ecf74}.xp-big.warn{background:#ffd400}.xp-big:disabled{opacity:.4;cursor:default}
.xp-fight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:#123a63;border-radius:10px;padding:8px;text-align:center}
.xp-fight small{display:block;font-size:11px;color:#a9cdee}.xp-vs{font-weight:900;color:#ffd400}
.xp-total,.xp-foot{font-size:12px;color:#8fb7dd;text-align:center}
.xp-log div{padding:4px 2px;border-bottom:1px solid #16406b;font-size:13px}
.pr-x{position:absolute;top:8px;right:10px;background:none;border:0;color:#666;font-size:22px;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .top{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .top h3{margin:0;font-size:16px;margin-right:auto}
.x{border:0;background:none;font-size:18px;color:var(--ink3);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--panel2);color:var(--ink)}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.drawer .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:4px}
.field input{width:100%;height:38px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:0 10px;font-size:15px}
.field input:focus{outline:0;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.raw{font-size:12px;color:var(--ink3);margin:-2px 0 12px;word-break:break-word}
.sides{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 auto 16px}
.sides canvas{display:block;border-radius:2px;background:#fff;box-shadow:var(--shadow)}
.sides span{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);font-weight:700;margin-top:4px}
.btn{height:38px;border-radius:8px;padding:0 16px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--onyellow);font-weight:800}
.btn.grow{flex:1}

/* line up backs */
.lu p{margin:0 0 12px;font-size:15px}
.lu .step{font-size:17px;font-weight:800;margin:6px 0 8px}
.lu .btn{width:100%;height:44px;font-size:16px;margin-bottom:18px}
.lu .num{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lu .num label{flex:1;font-size:16px;font-weight:700}
.lu .num button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:22px;font-weight:700;padding:0}
.lu .num output{width:52px;text-align:center;font-size:24px;font-weight:800}
.lu small{display:block;color:var(--ink3);font-size:13px;margin-top:6px}

#dragOver{position:fixed;inset:0;z-index:50;background:rgba(11,22,40,.9);border:3px dashed var(--yellow);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:24px;font-weight:700;pointer-events:none}
#dragOver svg{font-size:48px;color:var(--yellow)}

/* manager console */
#console{position:fixed;inset:0;z-index:70;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;padding:20px}
.con{width:900px;max-width:100%;height:60vh;background:#07101F;border:1px solid #24365C;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;font:14px/1.5 Consolas,"Courier New",monospace;color:#cfd6e1;overflow:hidden}
#conOut{flex:1;overflow:auto;padding:14px 16px;white-space:pre-wrap}
.cl.me{color:#FFD400}.cl.ok{color:#3ecf74}.cl.bad{color:#ff6b6b}.cl.dim{color:#7686A3}
.conrow{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #24365C;color:#FFD400}
#conIn{flex:1;background:none;border:0;outline:0;font:inherit;color:#E8ECF3}

#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--navy);border:1px solid var(--yellow);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .2s;max-width:90vw;text-align:center}
#toast.bad{border-color:var(--bad);background:var(--panel);color:var(--bad)}

/* screen parts hidden in CONFIG.hidden */
.ui-hidden{display:none!important}
</style>

<body>
<header>
  <h1><b id="shopName"></b>Tag Tool</h1>
  <div class="tt"><button id="ttBtn" title="Tag types and sizes"><b id="ttName" hidden></b><span>Sizes</span><i>▾</i></button><div id="ttMenu" hidden></div></div>
  <div id="tools" hidden>
    <div class="search" data-ui="search" data-ui-name="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="q" placeholder="Find"></div>
    <button class="chip" id="toggleAll" data-ui="selall" data-ui-name="Check all / none">Uncheck all</button>
    <button class="chip" id="flip" title="Show the back of the tags">Show backs</button>
    <button class="chip" id="add" data-ui="add" data-ui-name="Add button">+ Add</button>
  </div>
  <button class="chip" id="theme" title="Light / dark"></button>
</header>

<main>
  <section id="empty">
    <div id="drop">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
      <div class="big" id="dropBig">Drop Bravo report</div>
      <div class="small" id="dropSmall">or click to pick it</div>
    </div>
    <input id="file" type="file" accept=".prnx" hidden>
    <div id="emptyMsg"></div>
    <button class="link" id="addFirst" data-ui="hand" data-ui-name="Add by hand">or add a tag by hand</button>
  </section>

  <section id="tagsView" hidden>
    <div id="grid"></div>
    <div id="noMatch" hidden>No tags match that search.</div>
  </section>
</main>

<div id="bar" hidden><div class="in">
  <div id="count"></div>
  <div class="ctl" data-ui="spot" data-ui-name="Start spot" title="Used sheet? Click the first empty spot.">Start <div id="spots"></div></div>
  <div class="right">
    <div class="menuwrap" data-ui="save" data-ui-name="Save button"><button class="chip" id="saveBtn">Save ▾</button>
      <div id="saveMenu" hidden><button id="dl">Save PDF</button><button id="dlFront">Fronts only</button><button id="dlBack">Backs only</button><hr><button id="lineup">Line up backs…</button></div></div>
    <button id="print"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button>
  </div>
</div></div>

<button id="shareBtn" hidden><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><i></i></button>

<div id="shade" class="shade" hidden></div>
<aside id="drawer" class="drawer" hidden></aside>

<div id="dragOver" hidden><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Drop it</div>
<div id="toast" hidden></div>
<div id="console" hidden><div class="con"><div id="conOut"></div><div class="conrow"><span>&gt;</span><input id="conIn" autocomplete="off" spellcheck="false"></div></div><input id="conFile" type="file" accept=".json" hidden></div>

// brands that sometimes appear as the first word of the model (importer listed as maker)
const MODEL_BRANDS = {"CANIK":"Canik"};
const ACRONYMS = new Set(("MCX LT XD XDS XDM SKS BPS SXP MOS EZ TS FDE UFX BLK WSM LCP LCR RS RXM RXP II III IV VI M&P CC RF PA SA SC MC AR RR PG CF " +
  "BMAG NATO ACP LR SF TP SP DA SAO DAO HD SBR SBS OD ODG FS LE PC CO2 SS CA EC EC9S XL XR CS USA TRP").split(" "));
const SMALL_TITLE = new Set(["HI","MAX","GUN","PRO","GEN","AIR","ONE","TAC","OPS","MAG","OF","IN","ON","TO","A","AN","OR","BY","FOR","AND","THE","WITH"]);

function titleWord(w){
  if(/\d/.test(w)) return w.toUpperCase();
  return w.split("-").map(p=>{
    if(!p) return p;
    const U=p.toUpperCase();
    if(ACRONYMS.has(U)) return U;
    if(/\d/.test(p) || /[.&\/]/.test(p)) return U;          // P365, 43X, M&P, M.F.R.
    if(p.length<=2 && !SMALL_TITLE.has(U)) return U;          // LT, CM
    return U[0]+U.slice(1).toLowerCase();
  }).join("-");
}
function titleCase(s){ return s.split(/\s+/).filter(Boolean).map(titleWord).join(" "); }

function cleanBrand(raw){
  let k = raw.replace(/…|\.\.\.$/g,"").trim().toUpperCase();
  if(BRAND_MAP[k]!==undefined) return BRAND_MAP[k];
  // fuzzy: truncated names
  for(const key of Object.keys(BRAND_MAP)) if(key.startsWith(k) || k.startsWith(key)) return BRAND_MAP[key];
  k = k.replace(/\b(FIREARMS|ARMS|MANUFACTURING|MFG|INC\.?|CO\.?|COMPANY|CORP\.?)\b/g,"").replace(/\s+/g," ").trim();
  return titleCase(k);
}

function cleanModel(raw, brandRaw){
  let m = " "+raw.toUpperCase()+" ";
  m = m.replace(/\((?=[^)]*\d)[A-Z0-9\- ]+\)/g," ");          // (PV1950203) (57552)
  m = m.replace(/\s22 LONG RIFLE\b/g," ").replace(/\b[A-Z]{2}\d{6,}[A-Z]*\b/g," ");
  m = m.replace(/\s-\s(RIFLE|SHOTGUN|PISTOL)\b/g," ").replace(/\s(RIFLE|SHOTGUN|PISTOL)\s*$/," ");
  m = m.replace(/\s(\d{2})\s?GA\b/g," ").replace(/\s\d+\s?GAUGE\b/g," ");
  m = m.replace(/\s22 LONG RIFLE\b/g," ").replace(/\s7\.62 X 39\b/g," ").replace(/\s9MM\s/g," ").replace(/\s(ACP)\s*$/," ");
  m = m.replace(/\sGEN\s?(\d)/g," GEN $1");
  m = m.replace(/\s+/g," ").trim();
  // drop caliber tokens repeated in the model (6.5CM, 9MM, WSM...) unless that's the whole model
  const kept = m.split(" ").filter(w=>!/^(\d*\.\d+(CM|MM)?|\d+MM|WSM|WMR|NATO|CREEDMOOR)$/.test(w));
  if(kept.length) m = kept.join(" ");
  const b = (brandRaw||"").replace(/…/g,"").trim().toUpperCase().split(/\s+/)[0];
  if(b && m.startsWith(b+" ")) m = m.slice(b.length+1);       // "FNH 5.7X28" under FNH
  const cb = cleanBrand(brandRaw||"").toUpperCase();
  if(cb && m.startsWith(cb+" ")) m = m.slice(cb.length+1);    // "CZ P-10 C" under CZ
  return titleCase(m);
}

const CAL_RULES = [
  [/^9\s?(MM|X19|X19MM|MM PARABELLUM|MM LUGER)?$|^9MM|^9X19/, "9mm"],

  [/^22 S\/L\/LR/, ".22 S/L/LR"], [/^22 ?(WMR|MAG)/, ".22 WMR"], [/^22 ?(LONG|LR|L\b|\(22L)/, ".22 LR"], [/^22LR/, ".22 LR"],

function cleanCaliber(raw){
  const u = raw.replace(/…/g,"").replace(/\s*\([^)]*$/,"").toUpperCase().replace(/\s+/g," ").trim();   // "45 ACP (4…" -> "45 ACP"
  for(const [re,out] of CAL_RULES) if(re.test(u)) return out;
  return titleCase(u);
}
const money = s => parseFloat(String(s).replace(/[$,]/g,""));

// ---- "Comes with" extras from Bravo's Description ("... W/CASE/2MAGS") ----
// Words staff use, in the order to match. Bravo cuts long descriptions short,
// so a cut-off last word ("SLI") is matched to the start of a known word.
const EXTRAS = [
  ["HARD CASE","Hard Case"],["SOFT CASE","Soft Case"],["CASE","Case"],["ORIGINAL BOX","Box"],["BOX","Box"],
  ["SLING","Sling"],["SCOPE","Scope"],["HOLSTER","Holster"],["BAG","Bag"],["RED DOT","Red Dot"],["OPTIC","Optic"],
  ["LIGHT","Light"],["LASER","Laser"],["BIPOD","Bipod"],["CHOKES","Chokes"],["CHOKE","Choke"],["LOCK","Lock"],
  ["MANUAL","Manual"],["PAPERS","Papers"],["STRAP","Strap"],["RAIL","Rail"],["SUPPRESSOR","Suppressor"],
];
const NOT_EXTRA = /^(PISTOL|RIFLE|SHOTGUN|REVOLVER|THREADED|NIB|USED|NEW|\d*\.?\d+\s?(MM|LR|GA|ACP|SPL|NATO|S&W|WIN|MAG|CM|CR\w*)?|\d+X\d+)$/;
function parseExtras(desc){
  const d = String(desc||"").toUpperCase().replace(/…/g,"");
  const m = d.match(/(?:^|[\s|])W\s*\/\s*(.*)$/); if(!m) return "";
  const parts = m[1].split(/[\/|,+&]|\bAND\b/).map(p=>p.replace(/\s+/g," ").trim()).filter(Boolean);
  const out = [];
  parts.forEach((p,i)=>{
    const last = i===parts.length-1;
    let mm = p.match(/^(\d+)\s*-?\s*(MAGS?|MAGAZINES?|MAGZ)$/);
    if(mm){ const n=+mm[1]; out.push(n+(n===1?" Mag":" Mags")); return; }
    if(/^(MAGS?|MAGAZINES?|MAGZ)$/.test(p)){ out.push(/S$/.test(p)?"Mags":"1 Mag"); return; }
    if(NOT_EXTRA.test(p)) return;
    const hit = EXTRAS.find(([k])=>p===k) || (last && p.length>=2 && EXTRAS.find(([k])=>k.startsWith(p)));
    out.push(hit ? hit[1] : titleCase(p));
  });
  return [...new Set(out)].join(", ");
}

// Printed in this order every time, so tags read the same way: what makes it work first,

const ACC_ORDER=["Joy-Cons","Controller","Power Cord","HDMI Cord","Battery","Charger","Adapter","Cord","Cable","Remote","Dock",
  "Headset","Headphones","Game","Lens","Blade","Bit","Strap","Stand","Key",

const accRank=n=>{ const i=ACC_ORDER.indexOf(n); return i<0?ACC_ORDER.indexOf("Hard Case")-.5:i; };
// "NO CONTROLLER", "W/O CHARGER", "MISSING HDMI": left off (and taken off a console's defaults)
const NOT_WITH=/(?:\bNO|\bW\s*\/\s*O|\bWITHOUT|\bMISSING|\bLESS)\s+(?:THE\s+|\w+\s+)?$/;

const NOT_CONSOLE=/\b(PORTAL|CONTROLLERS?|GAMES?|HEADSETS?|CHARGING|CHARGERS?|DOCK|JOY-?CONS?|REMOTE|CASES?|BAGS?|SKINS?|STAND|GRIPS?)\b/;
const kitItem=s=>{ const m=String(s).match(/^(\d+)\s+(.*)$/), w=(m?m[2]:s).toUpperCase(), n=m?+m[1]:1;
  const a=ACCESSORIES.find(a=>new RegExp("^(?:"+a[0]+")$").test(w))||[w,s,s];
  return {name:a[1],n,text:n>1?n+" "+(a[2]||a[1]+"s"):a[1]}; };
function findConsole(item){
  const c=(CONFIG.consoles||[]).find(c=>new RegExp("\\b(?:"+c.match+")\\b").test(item));
  return c&&!NOT_CONSOLE.test(item)?c:null;
}
// price lower than a complete console's: which missing pieces add up to the difference (null if none do)
function missingByPrice(c,price,kit,said){
  if(!c.price||!(price>0)||price>=c.price) return [];
  const D=CONFIG.consoleDeduct||{}, opts=kit.filter(k=>D[k.name]&&!said.has(k.name)), diff=Math.round(c.price-price);
  let best=null;
  (function go(i,sum,take){ if(sum===diff&&(!best||take.length<best.length)) best=take.slice(); if(i>=opts.length||sum>=diff) return;
    for(let q=0;q<=opts[i].n;q++){ go(i+1,sum+q*D[opts[i].name],q?take.concat([[opts[i].name,q]]):take); } })(0,0,[]);
  return best||[];
}
// Power tool kits: "DRILL/DRIVER" (or "IMPACT DRILL/DRIVER") is ONE tool; "HAMMER DRILL/IMPACT DRIVER",
// "DRILL & IMPACT", "2-TOOL COMBO", "2PC KIT" are sets. A set prints "2-Tool Kit" first.
const TOOLS=["HAMMER ?DRILL","DRILLDRIVER","IMPACT DRIVER","IMPACT WRENCH","DRILL","IMPACT(?! ?DRILL)",
  "CIRCULAR SAW","RECIP(?:ROCATING)? SAW","SAWZALL","JIG ?SAW","MITER SAW","BAND ?SAW","GRINDER","OSCILLATING","MULTI-?TOOL",
  "SANDER","ROUTER","BLOWER","(?:STRING )?TRIMMER","HEDGE TRIMMER","NAILER","STAPLER","(?:WORK ?|FLASH ?)?LIGHT","RADIO","VACUUM|VAC"];
function toolCount(s){
  s=s.replace(/\bDRILL\s*\/\s*DRIVER\b|\bDRILL[- ]DRIVER\b/g,"DRILLDRIVER");
  const n=s.match(/\b(\d)\s*-?\s*(?:TOOL|PC|PIECE)S?\s*(?:COMBO|KIT|SET)\b|\b(\d)\s*-?\s*TOOLS?\b/); if(n) return +(n[1]||n[2]);
  const seen=new Set(), re=new RegExp("\\b("+TOOLS.map(t=>"(?:"+t+")").join("|")+")\\b","g"); let x;
  while((x=re.exec(s))) seen.add(TOOLS.findIndex(t=>new RegExp("^(?:"+t+")$").test(x[1])));
  return seen.size;
}
// cordless tool: needs a battery + charger (CONFIG.toolRequired)
const CORDLESS=/\b(M12|M18|MX FUEL|FUEL|\d{1,2}(?:\.\d)?\s?V(?:OLT)?|V\d{2}|\d{2}V MAX|FLEXVOLT|ONE\+|CORDLESS|BRUSHLESS)\b/;
function parseAccessories(desc,model,category,price){
  const vg=s=>String(s||"").toUpperCase().replace(/…|\.\.\.$/g,"").replace(/\b(?:VIDEO ?)?GAME ?(?:CONSOLE|SYSTEM)\b/g,"CONSOLE");
  const d=vg(desc), mo=vg(model);
  const m=d.match(/(?:^|[\s|(])(?:W\s*\/(?!\s*O\b)|WITH\b(?!OUT)|INCL(?:UDES?|\.)?\b|COMES WITH\b)\s*(.*)$/), seg=m?m[1]:d;
  const accRe="(?:"+ACCESSORIES.map(a=>a[0]).join("|")+")";
  const item=((m?d.slice(0,m.index):d)+" "+mo)           // what the item itself is (before W/, minus "NO CONTROLLER")
    .replace(new RegExp("(?:\\bNO|\\bW\\s*\\/\\s*O|\\bWITHOUT|\\bMISSING|\\bLESS)\\s+(?:\\S+\\s+)?"+accRe+"\\b","g")," ");
  const out=[], gone=new Set(), re=new RegExp("(?:\\(?\\b(\\d+|"+Object.keys(NUMWORD).join("|")+")\\)?\\s*(?:X\\s*|-\\s*)?)?\\b("+ACCESSORIES.map(a=>"(?:"+a[0]+")").join("|")+")\\b","g");
  let x; while((x=re.exec(d))){
    const a=ACCESSORIES.find(a=>new RegExp("^(?:"+a[0]+")$").test(x[2])); if(!a) continue;
    if(NOT_WITH.test(d.slice(0,x.index))){ gone.add(a[1]); continue; }
    if(m&&x.index<d.length-seg.length) continue;           // before W/: part of the item's name
    const n=x[1]?(NUMWORD[x[1]]||+x[1]):0;
    out.push({name:a[1],n:n||1,text:n>1?n+" "+(a[2]||a[1]+"s"):a[1]});
  }
  let list=out;
  const con=findConsole(item);
  if(con){
    if(/\bCORDS\b|\bCABLES\b/.test(d)&&gone.has("Cord")) gone.add("HDMI Cord");     // "NO CORDS" (power cord is required)
    if(/\b(?:CONSOLE|SYSTEM|UNIT) ONLY\b/.test(d)) con.kit.forEach(k=>gone.add(kitItem(k).name));   // "CONSOLE ONLY"
    const req=CONFIG.consoleRequired||[], said=new Set([...gone,...list.map(o=>o.name)]);
    let kit=con.kit.map(kitItem).filter(k=>req.includes(k.name)||!gone.has(k.name)).map(k=>list.find(o=>o.name===k.name)||k);
    for(const [name,q] of missingByPrice(con,price,kit,said))             // price says a controller / HDMI is missing
      kit=kit.map(k=>k.name!==name?k:k.n-q>0?kitItem((k.n-q)+" "+k.name):null).filter(Boolean);
    const names=new Set(con.kit.map(k=>kitItem(k).name));
    list=kit.concat(list.filter(o=>!names.has(o.name)&&o.name!=="Cord"&&o.name!=="Cable"));
  } else if(!m&&!gone.size&&list.length<2) list=[];   // no W/ or WITH: one lone word is usually the item itself ("M18 BATTERY", "CASE KNIFE")
  const tools=Math.max(toolCount(d.slice(0,m?m.index:d.length)),toolCount(mo));
  if(!con&&tools>=1&&CORDLESS.test(item))                                 // cordless tool: at least 1 battery + charger
    for(const r of CONFIG.toolRequired||[]) if(!list.some(o=>o.name===r)) list.push(kitItem(r));
  let texts=[...new Set(list.slice().sort((a,b)=>accRank(a.name)-accRank(b.name)).map(o=>o.text))];
  const pc=texts.indexOf("Power Cord"), hc=texts.indexOf("HDMI Cord");                  // shorter, reads better
  if(pc>=0&&hc>=0){ texts[pc]="Power & HDMI Cords"; texts.splice(hc,1); }

}

// rows: [{cells:[{x,w,str}], page}] sorted; returns raw records.
// Works with the old "Custom" report and the newer one with Category / Description columns,
// read from Bravo's own saved report (.prnx).
function parseRows(lines){
  let cols=null; const out=[];
  const NAMES={Manufacturer:"mfr",Model:"model",Number:"number",Category:"category",Description:"desc",Caliber:"rest",Barcode:"rest",Cost:"rest",Price:"rest"};
  for(const line of lines){
    const txt = line.map(c=>c.str).join(" ");
    if(/Manufacturer/.test(txt) && /Caliber/.test(txt)){
      cols = line.map(c=>{ const n=c.str.trim().split(/\s+/)[0]; return NAMES[n]?{key:NAMES[n],x:c.x}:null; }).filter(Boolean).sort((a,b)=>a.x-b.x);
      continue;
    }
    if(!cols) continue;
    const parts={mfr:[],model:[],number:[],category:[],desc:[],rest:[]};
    for(const c of line){
      const cx = c.x + (c.w ? Math.min(c.w/2,40) : 0.5);       // middle of the text decides its column
      let col=cols[0]; for(const k of cols) if(cx>=k.x-2) col=k;
      parts[col.key].push(c.str);
    }
    const number = parts.number.join("").trim();
    if(!/^[A-Z]{0,3}\d{5,}$/.test(number)) continue;
    const m = parts.rest.join(" ").replace(/\s+/g," ").match(/^(.*?)\s*\$([\d,]+\.\d\d)\s*\$([\d,]+\.\d\d)\s*$/);
    if(!m) continue;
    const j = a => a.join(" ").replace(/\s+/g," ").replace(/\s*…/g,"…").trim();
    out.push({mfr:j(parts.mfr), model:j(parts.model), number, category:j(parts.category), desc:j(parts.desc),
              caliberRaw:m[1].trim(), price:money(m[3]), cost:money(m[2])});
  }
  return out;
}

// Finish / colour words that belong on their own, not in the model name (longest first)
const FINISHES=[
  [/\bRealtree Max-?7\b/i,"Realtree Max-7"],[/\bMossy Oak\b[\w -]*/i,"Mossy Oak"],[/\bRose Gold\b/i,"Rose Gold"],
  [/\bStone Gr[ae]y\b/i,"Stone Gray"],[/\bOD Green\b/i,"OD Green"],[/\bTwo[- ]Tone\b/i,"Two-Tone"],
  [/\bNickel\b/i,"Nickel"],[/\bStainless\b/i,"Stainless"],[/\bBlued?\b/i,"Blued"],[/\bFDE\b/,"FDE"],
  [/\bBLK\b/i,"Black"],[/\bCamo\b/i,"Camo"],[/\bTungsten\b/i,"Tungsten"],[/\bBronze\b/i,"Bronze"]];
// Model names Bravo gets wrong or abbreviates
const MODEL_FIXES=[
  {brand:/^FN$/, model:/^5\.7X28$/i, to:"Five-seveN"},
  {brand:/^Remington$/, model:/^Seven$/i, to:"Model Seven"},
  {brand:/^Savage$/, model:/^BMAG 17$/i, to:"B-Mag"},
  {brand:/^Savage$/, model:/^Model II$/i, to:"Model 11"},
  {brand:/^Savage$/, model:/^M220 Slug$/i, to:"220 Slug"},
  {brand:/^Kel-Tec$/, model:/^Sub 2000$/i, to:"Sub-2000"},
  {brand:/^Heckler & Koch$/, model:/^45C$/i, to:"HK45 Compact"},
  {brand:/^Russian$/, model:/^Mosin Nagant$/i, to:"Mosin-Nagant"},
  {brand:/^Mosin Nagant$/, model:/^M91-30$/i, to:"M91/30", brandTo:"Mosin-Nagant"},
  {brand:/^Benelli$/, model:/^Nova Pump Action$/i, to:"Nova Pump"},
  {brand:/^H&R$/, model:/^1871 Pardner Pump$/i, to:"Pardner Pump"},
  {brand:/^CD Defense$/, model:/^AR12S-12GA$/i, to:"AR12S"},
  {brand:/^Armscor$/, model:/^30$/, to:"M30"},
  {brand:/^Sig Sauer$/, model:/^Wilson Combat P320$/i, to:"P320 Wilson Combat"},
  {brand:/^Blue Line$/, model:/^Mauser\s+/i, to:"", brandTo:"Mauser"},
  {brand:/^Heritage$/, model:/\s*RR22\w+$/i, to:""},
  {brand:/^Glock$/, model:/^43X 15RD$/i, to:"43X 15-Round"},
  {brand:/^Glock$/, model:/^G?(\d+)\s?V$/i, to:"$1 V"},
  {brand:/^Browning$/, model:/^Buck Mark Micro Bull Barrel/i, to:"Buck Mark Micro Bull"},

function toTag(r){
  const mfrCut=/…|\.\.\.$/.test(r.mfr), modelCut=/…|\.\.\.$/.test(r.model);
  // long maker names can spill the model into the maker column (not when Bravo cut the maker short with "…")
  r={...r, mfr:r.mfr.replace(/\s*(…|\.\.\.)\s*/g," ").trim(), model:r.model.replace(/\s*(…|\.\.\.)\s*$/,"").trim()};
  // Bravo cut the model short: drop the half word at the end ("BLACK LABEL 1911 TH…")
  if(modelCut && r.model.includes(" ")) r.model=r.model.replace(/\s+\S+$/,"");
  const up=r.mfr.toUpperCase();
  const key= mfrCut||BRAND_MAP[up]!==undefined ? null : Object.keys(BRAND_MAP).filter(k=>up.startsWith(k+" ")).sort((a,b)=>b.length-a.length)[0];
  if(key){ r={...r, mfr:r.mfr.slice(0,key.length), model:(r.mfr.slice(key.length)+" "+r.model).trim()}; }
  let brand = cleanBrand(r.mfr), model = cleanModel(r.model, r.mfr);
  const first = r.model.toUpperCase().split(/\s+/)[0];
  if(MODEL_BRANDS[first]){ brand = MODEL_BRANDS[first]; model = cleanModel(r.model.slice(first.length), ""); }

  // 1) pull finish/colour words out of the model ("Detective Special Nickel" -> model "Detective Special", finish "Nickel")
  let finish="";
  for(const [re,name] of FINISHES){ if(re.test(model)){ finish=finish||name; model=model.replace(re," ").replace(/\s+/g," ").trim(); } }
  // 2) drop a bare gauge number repeated in the model ("A300 Ultima 12" when caliber is 12 Gauge)
  const g=caliber.match(/^(\d+) Gauge$/); if(g) model=model.replace(new RegExp("(^|\\s)"+g[1]+"(?=\\s|$)"),"$1").replace(/\s+/g," ").trim();
  // 3) known model-name corrections

  return {include:true, brand, model, caliber, extras:parseExtras(r.desc), accessories:parseAccessories(r.desc,r.mfr+" "+r.model,r.category,r.price), finish, category:r.category||"", price:r.price, cost:r.cost, number:r.number,
          raw:[r.mfr, r.model, r.desc, r.caliberRaw].filter(Boolean).join(" | ")};
}

<script>
// ===== ENGINE: shared math, drawing, report reading, PDF output, printing =====
const hex2rgb = h => { h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); };
const C = {}; for(const k in CONFIG.colors) C[k]=hex2rgb(CONFIG.colors[k]);

// ---- money, layaway ----
function layaway(price){
  const L=CONFIG.layaway;
  const raw=Math.round(price*(1+L.markupPercent/100)*100)/100;
  const total=Math.ceil(raw/L.roundUpTo)*L.roundUpTo;
  const down=Math.ceil(total*L.downPercent/100);
  const monthly=Math.ceil((total-down)/L.months);
  return {total, down, monthly};
}
const fmt$ = n => "$"+Math.round(n).toLocaleString("en-US");

// ---- graphics adapters: same drawing code goes to screen and to PDF ----
function canvasG(ctx){
  const F="'Atkinson Hyperlegible', Arial, sans-serif", rgb=c=>"rgb("+c.join(",")+")";
  return {
    role(){},
    rect(x,y,w,h,c){ctx.fillStyle=rgb(c);ctx.fillRect(x,y,w,h)},
    rrect(x,y,w,h,r,c){ctx.fillStyle=rgb(c);ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()},
    lw(v){ctx.lineWidth=v},
    strokeRect(x,y,w,h){ctx.strokeStyle="#000";ctx.strokeRect(x,y,w,h)},
    line(a,b,c,d,col){ctx.strokeStyle=col?rgb(col):"#000";ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()},
    fitSize(str,maxW,maxSize){ctx.font="bold 10px "+F;return Math.min(maxSize,maxW/(ctx.measureText(str).width/10))},
    // ol: optional outline {k: width as share of text size, col}. Drawn under the fill, so the letters keep their full size.
    fitText(str,cx,cy,maxW,maxSize,col,ol){ if(!str)return; const sz=this.fitSize(str,maxW,maxSize);
      ctx.font="bold "+sz+"px "+F;ctx.textAlign="center";ctx.textBaseline="middle";
      if(ol){ ctx.save(); ctx.lineJoin="round"; ctx.lineWidth=2*sz*ol.k; ctx.strokeStyle=rgb(ol.col||[0,0,0]); ctx.strokeText(str,cx,cy+sz*.04); ctx.restore(); }
      ctx.fillStyle=col?rgb(col):"#000";ctx.fillText(str,cx,cy+sz*.04)},
  };
}
function pdfG(doc){
  return {
    role(){},
    rect(x,y,w,h,c){doc.setFillColor(c[0],c[1],c[2]);doc.rect(x,y,w,h,"F")},
    rrect(x,y,w,h,r,c){doc.setFillColor(c[0],c[1],c[2]);doc.roundedRect(x,y,w,h,r,r,"F")},
    lw(v){doc.setLineWidth(v)},
    strokeRect(x,y,w,h){doc.setDrawColor(0);doc.rect(x,y,w,h,"S")},
    line(a,b,c,d,col){if(col)doc.setDrawColor(col[0],col[1],col[2]);else doc.setDrawColor(0);doc.line(a,b,c,d)},
    fitSize(str,maxW,maxSize){doc.setFont("AH","bold");doc.setFontSize(10);return Math.min(maxSize,maxW/(doc.getTextWidth(str)/10))},
    fitText(str,cx,cy,maxW,maxSize,col,ol){ if(!str)return; const sz=this.fitSize(str,maxW,maxSize); doc.setFontSize(sz);
      if(ol){ const c=ol.col||[0,0,0]; doc.setDrawColor(c[0],c[1],c[2]); doc.setLineWidth(2*sz*ol.k); doc.setLineJoin("round");
        doc.text(str,cx,cy,{align:"center",baseline:"middle",renderingMode:"stroke"}); doc.setLineJoin("miter"); doc.setDrawColor(0); }
      if(col) doc.setTextColor(col[0],col[1],col[2]); else doc.setTextColor(0);
      doc.text(str,cx,cy,{align:"center",baseline:"middle",renderingMode:"fill"})},
  };
}

// one line of big text; splits onto two lines if it would get too small
function fitRow(g,str,cx,top,maxW,h,scale,wrap,col){
  if(!str) return;
  const words=str.split(" ");
  if(wrap && words.length>1 && g.fitSize(str,maxW,h*scale)<h*.42){
    let best=null;
    const commas=words.some((w,i)=>i<words.length-1&&w.endsWith(","));    // a list ("Bag, 2 Batteries"): break only between items
    for(let i=1;i<words.length;i++){ if(commas&&!words[i-1].endsWith(",")) continue; const a=words.slice(0,i).join(" "),b=words.slice(i).join(" ");
      const sz=Math.min(g.fitSize(a,maxW,h*.42),g.fitSize(b,maxW,h*.42)), bal=-Math.abs(a.length-b.length);
      if(!best||sz>best[2]+.01||(Math.abs(sz-best[2])<=.01&&bal>best[3])) best=[a,b,sz,bal];}
    g.fitText(best[0],cx,top+h*.29,maxW,best[2],col); g.fitText(best[1],cx,top+h*.72,maxW,best[2],col);
  } else g.fitText(str,cx,top+h/2,maxW,h*scale,col);
}

// Top rows from a type's CONFIG.rows. Blank rows give their space to a neighbor (the main row first).
function topGroups(type,t){
  const rows=type.rows.map((r,i)=>({text:String((t.fit&&t.fit[r[0]])||t[r[0]]||"").trim(),h:r[1],scale:r[2],wrap:r[3],i}));
  const main=Math.min(1,rows.length-1), filled=rows.filter(r=>r.text).map(r=>r.i);
  if(!filled.length) return [{owner:0,text:"",h:rows.reduce((a,r)=>a+r.h,0),scale:.7,wrap:false,start:0,n:rows.length}];
  const owner=rows.map(r=>{ if(r.text) return r.i;
    return filled.slice().sort((a,b)=>(Math.abs(a-r.i)-Math.abs(b-r.i))||((a===main)?-1:(b===main)?1:a-b))[0]; });
  const out=[];
  rows.forEach((r,i)=>{ const last=out[out.length-1];
    if(last && last.owner===owner[i]){ last.h+=r.h; last.n++; }
    else { const o=rows[owner[i]]; out.push({owner:owner[i],text:o.text,h:r.h,scale:o.scale,wrap:o.wrap,baseH:o.h,start:i,n:1}); } });
  return out;
}

// ---- reading the Bravo report into lines of {x,w,str} (x/w in points, top to bottom) ----
// Groups text pieces that sit on the same row (within 2 points).
function groupRows(items,up){
  const map=new Map();
  for(const it of items){
    if(!it.str||!it.str.trim()) continue;
    let key=[...map.keys()].find(k=>Math.abs(k-it.y)<=2);
    if(key===undefined){ key=it.y; map.set(key,[]); }
    map.get(key).push({x:it.x,w:it.w,str:it.str});
  }
  return [...map.keys()].sort((a,b)=>up?b-a:a-b).map(k=>map.get(k).sort((a,b)=>a.x-b.x));
}
// Bravo's own saved report (.prnx: the Save button in Bravo's Report Preview).
// Gzipped XML; every text box has its full text (nothing cut short) and a Rect "x,y,w,h" in 1/300 inch.
async function readPrnxLines(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  let xml;
  if(buf[0]===0x1f&&buf[1]===0x8b) xml=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  else xml=new TextDecoder().decode(buf);
  return prnxXmlLines(xml.replace(/^\uFEFF/,""));
}
function prnxXmlLines(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("bad prnx");
  const root=doc.documentElement, K=72/300, lines=[];
  let pages=[...root.childNodes].filter(n=>n.nodeType===1&&/^Page\d+$/.test(n.nodeName)).sort((a,b)=>+a.nodeName.slice(4)-+b.nodeName.slice(4));
  if(!pages.length) pages=[root];
  for(const pg of pages){
    const items=[];
    for(const el of [...pg.getElementsByTagName("*")]){
      if(el.getAttribute("BrickType")!=="Text") continue;
      const r=(el.getAttribute("Rect")||"").split(",").map(Number); if(r.length<4||r.some(isNaN)) continue;
      const str=el.getAttribute("Text")??el.getAttribute("TextValue")??"";
      items.push({x:r[0]*K,y:Math.round(r[1]*K),w:r[2]*K,str});
    }
    lines.push(...groupRows(items,false));
  }
  return lines;
}

// ---- sheet layout ----
// Layout is worked out on the sheet the way the tags sit (landscape for all gun sizes),
// then each page goes into the PDF as a PORTRAIT letter page, turned a quarter turn.
// Portrait + "flip on long edge" is every printer's normal two-sided setting, so there is
// nothing to pick in the print box.
function layoutGrid(s){
  const M=18, PW=s.portrait?612:792, PH=s.portrait?792:612;
  const cols=Math.max(1,Math.floor((PW-2*M+0.5)/s.W)), rows=Math.max(1,Math.floor((PH-2*M+0.5)/s.H));
  return {cols,rows,per:cols*rows,land:!s.portrait,ox:(PW-cols*s.W)/2,oy:(PH-rows*s.H)/2};
}
// Turning a landscape layout onto a portrait page (jsPDF thinks the page is 612 x 792).
// Fronts turn one way, backs the other; with the mirrored column that puts every back right
// behind its front, upright when you turn the tag over left-to-right.
const TURN = { front:[0,-1,1,0,-180,792], back:[0,1,-1,0,792,0], none:[1,0,0,1,0,0] };
// Sheets are drawn onto a "target": a PDF (Save PDF) or 300 dpi canvases (Print).
// Turns are PDF "cm" matrices [a b c d e f]; the canvas target converts them so both match.
// nudge (backs only): {x,y} in points, right / down as you look at the back. Fixes a printer
// that always lands the back a little off (set with "Line up backs").
function beginPage(T,turn,nudge){
  const m=TURN[turn], nx=(nudge&&nudge.x)||0, ny=(nudge&&nudge.y)||0;
  T.push([m[0],m[1],m[2],m[3],m[4]+nx,m[5]-ny]);
}
// Back upside down inside its own spot (CONFIG.layout.backFlipUp), so it reads right side up
// when the tag is flipped up over its top edge. The spot itself stays exactly behind its front.
const flipBack = () => CONFIG.layout.backFlipUp!==false;
const beginFlip = (T,x,y,s) => T.push([-1,0,0,-1,2*x+s.W,1584-2*y-s.H]);
function newDoc(){
  const doc=new jspdf.jsPDF({unit:"pt",format:"letter",orientation:"portrait"});
  doc.addFileToVFS("AH-Bold.ttf",AH_B64); doc.addFont("AH-Bold.ttf","AH","bold");
  // print box: two-sided, flip on long edge, actual size (Edge / Chrome / Acrobat read this)
  try{ doc.viewerPreferences({Duplex:"DuplexFlipLongEdge",PrintScaling:"None"}); }catch(e){}
  return doc;
}
function pdfTarget(){
  let doc=null, G=null; const f=n=>(+n.toFixed(3)).toString();
  return {
    page(){ if(!doc){ doc=newDoc(); G=pdfG(doc); } else doc.addPage("letter","portrait"); return G; },
    push(m){ doc.internal.write("q "+m.map(f).join(" ")+" cm"); },
    pop(){ doc.internal.write("Q"); },
    done(){ if(!doc) this.page(); return doc; },
  };
}
// Each page is a white portrait letter canvas. PDF space has y going up from the bottom,
// canvas has y going down, so each matrix M becomes S·M·S (S = flip at 792).
function canvasTarget(dpi){
  const k=dpi/72, blobs=[]; let cv=null, ctx=null, G=null;
  const finish=()=>{ if(!cv) return; const c=cv; cv=null;
    blobs.push(new Promise(res=>c.toBlob(b=>{ c.width=c.height=0; res(b); },"image/png"))); };
  return {
    page(){ finish(); cv=document.createElement("canvas"); cv.width=Math.round(612*k); cv.height=Math.round(792*k);
      ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.setTransform(k,0,0,k,0,0);
      G=canvasG(ctx); return G; },
    push([a,b,c,d,e,f]){ ctx.save(); ctx.transform(a,-b,-c,d,792*c+e,792-792*d-f); },
    pop(){ ctx.restore(); },
    done(){ if(!cv&&!blobs.length) this.page(); finish(); return Promise.all(blobs); },
  };
}
// The whole run onto one target. groups: [{sel:[tags], s:settings}] — each group (tag size) gets its own sheets.
// sides: "both" (front page, then its back page), "front" or "back"
function drawSheets(T,type,groups,sides,nudge){
  const two=!!type.drawBack;
  sides = two ? (sides||"both") : "front";
  for(const {sel,s} of groups){
    const g=layoutGrid(s), sheets=[];            // tags grouped by sheet, with their spot
    sel.forEach((t,i)=>{ const slot=i+(s.skip||0), sh=Math.floor(slot/g.per);
      (sheets[sh]=sheets[sh]||[]).push({t,pos:slot%g.per}); });
    sheets.forEach(list=>{
      if(sides!=="back"){ const G=T.page(); beginPage(T,g.land?"front":"none");
        list.forEach(({t,pos})=>type.draw(G, g.ox+(pos%g.cols)*s.W, g.oy+Math.floor(pos/g.cols)*s.H, t, s)); T.pop(); }
      if(sides!=="front"){ const G=T.page(); beginPage(T,g.land?"back":"none",nudge);
        list.forEach(({t,pos})=>{ const x=g.ox+(g.cols-1-pos%g.cols)*s.W, y=g.oy+Math.floor(pos/g.cols)*s.H;
          if(flipBack()) beginFlip(T,x,y,s);
          type.drawBack(G,x,y,t,s);
          if(flipBack()) T.pop(); });
        T.pop(); }
    });
  }
  return T.done();
}
const buildPdf = (...a) => drawSheets(pdfTarget(),...a);

// ---- line-up test sheet (two pages: front lines, back rulers) ----
// Print it two-sided, hold it up to a light, read the number each front line lands on.
const NUDGE_STEP = 4.5;            // 1/16 inch per number
function drawTestSheet(T,nudge){
  const s=NUDGE_STEP, ink=[40,40,40];
  let G=T.page();
  const say=(str,x,y,size,col)=>G.fitText(str,x,y,1e4,size,col);
  // front
  beginPage(T,"none");
  say("LINE-UP TEST",306,70,26); say("Print two-sided on cardstock, same as tags.",306,104,13,ink);
  say("Left-right",306,150,16); G.lw(2); G.line(306,170,306,330);
  say("Up-down",306,450,16); G.line(150,500,462,500);
  say("Then turn it over.",306,640,13,ink);
  T.pop();
  // back
  G=T.page(); beginPage(T,"none",nudge);
  say("LINE-UP TEST (back)",306,70,22);
  say("Hold up to a light (a phone light behind it works).",306,100,13,ink);
  say("Which number does the line from the front land on?",306,120,13,ink);
  // ticks 1/16" apart; numbers in 3 staggered rows so they're big enough to read
  const row=k=>((k%3)+3)%3, col=k=>k===0?C.red:null;
  say("Left-right",306,165,16);
  for(let k=-8;k<=8;k++){ const x=306+k*s, r=row(k);
    G.lw(k?.6:1.2); G.line(x,180+r*14+8,x,320,col(k)); say(String(k),x,180+r*14,10,col(k)); }
  say("Up-down",306,395,16);
  for(let k=-8;k<=8;k++){ const y=500+k*s, r=row(k);
    G.lw(k?.6:1.2); G.line(250-r*22+10,y,362,y,col(k)); say(String(k),250-r*22,y,10,col(k)); }
  say("Type both numbers into the Tag Tool. Both 0 = lined up.",306,640,13,ink);
  T.pop();
  return T.done();
}

// ---- CHECK BEFORE PRINTING ----
// Runs every tag through the real drawing code on a "measuring" page (nothing is printed),
// then checks: text inside its tag, text big enough to read, backs inside their white edge,
// every back sitting exactly behind its front on the paper, and every tag inside the area a
// printer can reach. Problems it can fix, it fixes (t.fit); anything left gets listed.
let _mdoc=null;
function measureG(){
  if(!_mdoc){ _mdoc=new jspdf.jsPDF({unit:"pt",format:"letter"}); _mdoc.addFileToVFS("AH-Bold.ttf",AH_B64); _mdoc.addFont("AH-Bold.ttf","AH","bold"); }
  const base=pdfG(_mdoc), items=[]; let role="";
  const box=(k,x,y,w,h)=>items.push({k,role,x:Math.min(x,x+w),y:Math.min(y,y+h),w:Math.abs(w),h:Math.abs(h)});
  return { items, role(r){ role=r; }, lw(){},
    rect(x,y,w,h){ box("rect",x,y,w,h); }, rrect(x,y,w,h){ box("rect",x,y,w,h); }, strokeRect(x,y,w,h){ box("rect",x,y,w,h); },
    line(a,b,c,d){ box("line",a,b,c-a,d-b); },
    fitSize(str,maxW,maxSize){ return base.fitSize(str,maxW,maxSize); },
    fitText(str,cx,cy,maxW,maxSize){ if(!str) return; const sz=base.fitSize(str,maxW,maxSize); _mdoc.setFontSize(sz);
      const w=_mdoc.getTextWidth(str); items.push({k:"text",role,str,size:sz,x:cx-w/2,y:cy-sz*.36,w,h:sz*.72}); } };
}
// smallest text (font size in points) allowed on a printed tag, by part
const MIN_TEXT = Object.assign({brand:16,model:10,caliber:12,price:30,monthly:14,band:6,total:18,down:11,extras:9,label:6},CONFIG.minText||{});
function tagProblems(type,t,s){
  const out=[], m=(CONFIG.layout.backMargin||0)*72;
  for(const side of ["front","back"]){
    if(side==="back"&&!type.drawBack) continue;
    const g=measureG(); (side==="front"?type.draw:type.drawBack)(g,0,0,t,s);
    // backs drift only left-right, so only the sides need the white edge
    const lo=side==="back"?m-.5:-.5, hiW=s.W-lo, loY=-.5, hiH=s.H+.5;
    for(const it of g.items){
      if(it.k==="text"&&it.size<(MIN_TEXT[it.role]||0)-.01) out.push({side,role:it.role,why:"small",str:it.str,size:it.size});
      if(it.role!=="bg"&&it.role!=="bleed"&&(it.x<lo-1||it.y<loY-1||it.x+it.w>hiW+1||it.y+it.h>hiH+1)) out.push({side,role:it.role,why:"outside",str:it.str||it.k});
    }
  }
  return out;
}
// words that may be shortened on a tag when the full name won't fit big enough (model line only)
const SHORTEN = CONFIG.shorten||[];
function shortenWords(str){ let s=str; for(const [a,b] of SHORTEN) s=s.replace(new RegExp("\\b"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","gi"),b); return s; }
// try fixes in order until the tag passes; returns what's still wrong
function fitTag(type,t,s){
  t.fit={};
  let p=tagProblems(type,t,s); if(!p.length) return {fixed:false,left:[]};
  const steps=[
    ()=>{ if(p.some(x=>x.role==="extras")) t.fit.extras2=true; },
    ()=>{ if(p.some(x=>x.role==="extras")) t.fit.extrasTall=true; },
    ()=>{ for(const k of ["model","brand"]) if(p.some(x=>x.role===k)){ const v=shortenWords(String(t[k]||"")); if(v!==t[k]) t.fit[k]=v; } },
  ];
  const score=q=>{ const worst={}; let o=0;      // worst shortfall per part, outside = very bad
    q.forEach(x=>{ if(x.why==="outside") o+=100; else worst[x.role]=Math.max(worst[x.role]||0,1+MIN_TEXT[x.role]-x.size); });
    return o+Object.values(worst).reduce((a,b)=>a+b,0); };
  for(const step of steps){ const keep={...t.fit}; step(); const q=tagProblems(type,t,s);
    if(score(q)<score(p)) p=q; else t.fit=keep;          // keep a fix only if it makes the tag better
    if(!p.length) break; }
  return {fixed:Object.keys(t.fit).length>0, left:p};
}
// where a tag spot lands on the physical sheet (portrait inches, seen from the front)
function physRect(g,s,pos,side){
  const col=pos%g.cols, row=Math.floor(pos/g.cols), c=side==="back"?g.cols-1-col:col;
  const x=g.ox+c*s.W, y=g.oy+row*s.H, m=TURN[g.land?side:"none"];
  const P=(px,py)=>{ const X=px, Y=792-py, u=m[0]*X+m[2]*Y+m[4], v=m[1]*X+m[3]*Y+m[5]; return [u,792-v]; };
  let pts=[P(x,y),P(x+s.W,y+s.H)];
  if(side==="back") pts=pts.map(([u,v])=>[612-u,v]);       // turned over on the long edge
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  return {x:Math.min(...xs),y:Math.min(...ys),w:Math.abs(xs[1]-xs[0]),h:Math.abs(ys[1]-ys[0])};
}
const PRINTABLE = 13;   // points (0.18") most printers can't reach at the paper edge
function sheetProblems(s){
  const g=layoutGrid(s), out=[];
  for(let pos=0;pos<g.per;pos++){
    const f=physRect(g,s,pos,"front"), b=physRect(g,s,pos,"back");
    if(Math.abs(f.x-b.x)>.01||Math.abs(f.y-b.y)>.01||Math.abs(f.w-b.w)>.01||Math.abs(f.h-b.h)>.01) out.push("back "+(pos+1)+" isn't behind its front");
    if(f.x<PRINTABLE||f.y<PRINTABLE||f.x+f.w>612-PRINTABLE||f.y+f.h>792-PRINTABLE) out.push("spot "+(pos+1)+" runs off the printable area");
  }
  return out;
}
// whole run: groups = [{kind, sel, s}]. Fixes what it can; returns a short report.
function preflight(type,groups){
  const rep={tags:0,fixed:[],left:[],sheet:[]};
  for(const gr of groups){
    rep.sheet.push(...sheetProblems(gr.s).map(x=>(gr.kind?gr.kind.name+": ":"")+x));
    for(const t of gr.sel){ rep.tags++; const r=fitTag(type,t,gr.s);
      if(r.fixed&&!r.left.length) rep.fixed.push(t); if(r.left.length) rep.left.push({t,why:r.left}); }
  }
  return rep;
}

// ---- printing right from the tool (no PDF tab) ----
// build(target) draws the sheets; here they go onto 300 dpi canvases, then into a hidden
// frame whose page size is fixed to portrait letter, no margins, so the print box can't
// turn or shrink the sheet. Returns once the print box has opened.
const PRINT_DPI = 300;
async function printSheets(build,ready){
  const urls=(await build(canvasTarget(PRINT_DPI))).map(b=>URL.createObjectURL(b));
  const old=document.getElementById("printFrame"); if(old) old.remove();
  const f=document.createElement("iframe"); f.id="printFrame"; f.setAttribute("aria-hidden","true");
  f.style.cssText="position:fixed;left:-10000px;top:0;width:816px;height:1056px;border:0";
  document.body.appendChild(f);
  const d=f.contentDocument;
  d.open(); d.write('<!DOCTYPE html><html><head><title>Tags</title><style>'
    +'@page{size:8.5in 11in;margin:0}html,body{margin:0;padding:0;background:#fff}'
    +'.pg{width:8.5in;height:11in;overflow:hidden;break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}'
    +'img{display:block;width:8.5in;height:11in}</style></head><body>'
    +urls.map(u=>'<div class="pg"><img src="'+u+'"></div>').join("")+'</body></html>'); d.close();
  await Promise.all([...d.images].map(i=>i.decode().catch(()=>{})));
  const done=()=>{ urls.forEach(u=>URL.revokeObjectURL(u)); setTimeout(()=>f.remove(),1000); };
  f.contentWindow.addEventListener("afterprint",done,{once:true});
  if(ready) ready();
  f.contentWindow.focus(); f.contentWindow.print();
}

// ---- saving files (normal browser download) ----
async function saveFile(name,data,mime){
  const url=URL.createObjectURL(new Blob([data],{type:mime||"application/octet-stream"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

</script>
<script>
// ===== TAG TEMPLATES =====
// Each template = an entry in CONFIG.types (name, fields, rows, sizes) plus an entry here:
//   parse(lines) -> list of tags
//   draw(g,x,y,tag,settings)       front of the tag
//   drawBack(g,x,y,tag,settings)   back of the tag (two-sided tags only)
const W_ = CONFIG.words, LAY = CONFIG.layout;
const tagBox = s => ({ W:s.W, H:s.H, k:s.H/216, pad:s.W*.035, thick:Math.max(3,s.W*LAY.lineWeight) });

// ---------- GUN TAG: front = make / model / caliber, big price, layaway payment ----------
// No OUR PRICE! / SALES TAX PAID! bars (11-18-2026): the price gets that room.
function drawGunFront(g,x,y,t,s){
  const {W,H,k,pad,thick}=tagBox(s), F=LAY.front;
  g.role("bg"); g.rect(x,y,W,H,C.white);
  // General Merchandise: the "Comes with" list takes the caliber row (and may wrap to two lines)
  let type=TYPES.guns;
  if(s.extrasFront){ t={...t,caliber:t.extras||"",fit:t.fit&&{...t.fit,caliber:undefined}};
    // a long list gets a taller row (two lines) from the price box, which has room to spare
    const long=g.fitSize(t.caliber,W-2*pad,1000)<(MIN_TEXT.caliber||12)+2;
    type={...type,rows:type.rows.map(r=>r[0]==="caliber"?[r[0],long?r[1]*1.7:r[1],r[2],true]:r)}; }
  const groups=topGroups(type,t), top=groups.reduce((a,r)=>a+r.h,0)*k;
  const lb=F.layawayBand*k, pr=F.payments*k;
  const yPrice=y+top, yLay=y+H-pr-lb, ph=yLay-yPrice, yPay=yLay+lb;
  let cy=y; const ys=groups.map(gr=>{ const r=[cy,gr.h*k]; cy+=gr.h*k; return r; });
  // big yellow price
  g.rect(x,yPrice,W,ph,C.yellow);
  g.role("price"); g.fitText(fmt$(t.price||0),x+W/2,yPrice+ph/2,W-3*pad,ph*.82);
  // big navy "LAYAWAY ON BACK!" band pinned to the bottom (11-19-2026): makes customers ask to see
  // the item, and the back closes it. layout.front.payments > 0 adds a "$20 Down | $7/mo" row under it.
  const l=layaway(t.price||0);
  g.rect(x,yLay,W,lb,C.navy);
  g.role("hook"); g.fitText(W_.frontLayaway||W_.layaway,x+W/2,yLay+lb/2+1,W-2.8*pad,lb*.7,C.white);
  if(pr>0){ g.rect(x,yPay,W,pr,C.white);
    pairRow(g,fmt$(l.down)+(W_.frontDown??" Down"),fmt$(l.monthly)+W_.perMonth,x+W/2,yPay+pr/2+1,W-3*pad,pr*.72,F.downScale??.8,"down","monthly"); }
  // lines + text
  g.lw(thick);
  for(let i=1;i<ys.length;i++) g.line(x,ys[i][0],x+W,ys[i][0]);
  [yPrice,yLay].concat(pr>0?[yPay]:[]).forEach(v=>g.line(x,v,x+W,v));
  groups.forEach((gr,i)=>{ g.role(type.rows[gr.owner??0][0]); fitRow(g,gr.text,x+W/2,ys[i][0],W-2*pad,ys[i][1],gr.scale,gr.wrap); });
  g.lw(thick); g.strokeRect(x,y,W,H);      // the front's outer line is the cut line
}

// Two amounts on one line with a divider: "$62 Down | $21 monthly". a is drawn at ka x the size of b, same baseline.
const C_SOFT=[200,205,214], C_HINT=[175,180,190];
function pairRow(g,a,b,cx,cy,maxW,maxSize,ka,ra,rb,dcol,dw){
  const per1=str=>1000/g.fitSize(str,1000,1e9);            // width of the text at size 1
  const wa=per1(a)*ka, wb=per1(b), sepK=.9;                 // gap around the divider = 0.9 x text size
  const vs=Math.min(maxSize,maxW/(wa+wb+sepK)), sa=vs*ka;
  const xs=cx-(wa+wb+sepK)*vs/2, xd=xs+wa*vs+sepK*vs/2;
  g.role(ra); g.fitText(a,xs+wa*vs/2,cy+(vs-sa)*.3,999,sa);
  g.role(rb); g.fitText(b,xd+sepK*vs/2+wb*vs/2,cy,999,vs);
  const w=dw?dw(vs):1.2; g.role(""); g.rect(xd-w/2,cy-vs*.4,w,vs*.8,dcol||C_SOFT);
}

// ---------- GUN TAG: back = layaway panel, "Comes with" extras, spot for the barcode sticker ----------
// Item # and cost code are on the barcode sticker, so the tag doesn't print them.
// 11-19-2026: two-sided printing drifts the back left-right (~1/16") against the front's cut, so there are
// NO side lines or outlines. The ink runs edge to edge and past the cut ("bleed", layout.backBleed): navy
// "12-MONTH LAYAWAY!" header flush with the top edge (black rule on the top cut), full-width yellow total,
// black rules under each band and around the extras. Every back in a row lines up, so the bands join across
// the sheet and any cut lands inside them. Text stays inside the left/right white edge (layout.backMargin).
const BACK_PANEL = { band:.27, total:.32, row:.19, extras:.22 };   // share of the panel's height (fixed, so rows line up)
function drawGunBack(g,x0,y0,t,s0){
  const m=(LAY.backMargin||0)*72, BL=(LAY.backBleed??.1)*72;
  g.role("bg"); g.rect(x0,y0,s0.W,s0.H,C.white); g.role("");
  const x=x0+m, y=y0+m, s={...s0,W:s0.W-2*m,H:s0.H-2*m};
  const {W,H,k,pad}=tagBox(s), cx=x+W/2, B=LAY.backText||1;   // B: back text size (CONFIG.layout.backText)
  const l=layaway(t.price||0), extras=s0.extrasFront?"":String(t.extras||"").trim();   // General Merchandise: already on the front
  // sticker spot: from the tag's own bottom edge (the sticker goes on by hand after cutting)
  const zone=Math.min(LAY.barcodeH*72-m,H*.5);
  const lw=Math.max(1.5,s0.W*.009), xa=x0-BL, xb=x0+s0.W+BL, K=[0,0,0];
  const top=y0, BT=.04*72;
  // shares are of the old panel (top white edge included); the height freed at the top goes to the yellow total
  const pH=(y+H-zone-Math.max(3,4*k))-top-lw, F=BACK_PANEL, U=(pH-m)/(F.band+F.total+F.row+F.extras);
  const hb=F.band*U, ht=F.total*U+m, hr=F.row*U, he=F.extras*U;
  const yt=top+hb, yr=yt+ht, ye=yr+hr+lw/2, yEnd=ye+he;
  // header: navy, edge to edge, white letters with a black outline
  g.role("bleed"); g.rect(xa,top-BT,xb-xa,hb+BT,C.navy); g.rect(xa,top-lw/2,xb-xa,lw,K);
  g.role("band"); g.fitText(W_.layaway,cx,top+hb/2+1,W-2*pad-hb*.12,Math.min(hb*.7,hb*.6*B),C.white,{k:.075,col:K});
  // layaway total: full-width yellow band, black rules under the navy and yellow bands
  const p=Math.max(3,5*k), by=yt, bh=ht-p*.7;
  g.role("bleed"); g.rect(xa,by,xb-xa,bh,C.yellow); g.rect(xa,yt-lw/2,xb-xa,lw,K); g.rect(xa,by+bh-lw/2,xb-xa,lw,K);
  const num=fmt$(l.total), lab=W_.backTotal||"", lk=.42, per1=str=>1000/g.fitSize(str,1000,1e9);
  const wn=per1(num), wl=lab?per1(lab)*lk+.22:0, ts=Math.min(bh*.72*B,bh*.86,(W-2*pad)/(wn+wl));
  const xn=cx-(wn+wl)*ts/2, cyT=by+bh/2+1;
  g.role("total"); g.fitText(num,xn+wn*ts/2,cyT,999,ts);
  if(lab){ g.role("totalLabel"); g.fitText(lab,xn+(wn+.22)*ts+per1(lab)*lk*ts/2,cyT+ts*(1-lk)*.3,999,ts*lk,C.navy); }
  // "$62 Down | $21 monthly"
  pairRow(g,fmt$(l.down)+(W_.backDown??" Down"),fmt$(l.monthly)+(W_.backPerMonth||W_.perMonth),cx,yr+hr/2+1,W-pad,hr*.62*B,1,"down","down",K,v=>Math.max(1.2,v*.08));
  // black rules, edge to edge, around Comes with: "w/ Case, 2 Mags" (row always there so every back matches)
  g.role("bleed"); g.rect(xa,ye-lw/2,xb-xa,lw,K); g.rect(xa,yEnd,xb-xa,lw,K);
  g.role("extras");
  const ey=ye+he/2, ew=W-2*pad;
  if(extras){ const line=W_.withPrefix+extras, two=t.fit&&t.fit.extras2&&extras.includes(", ");
    if(!two) g.fitText(line,cx,ey+1,ew,he*.5*B);
    else { const q=extras.split(", "), h=Math.ceil(q.length/2), a=W_.withPrefix+q.slice(0,h).join(", ")+",", b=q.slice(h).join(", ");
      const sz=Math.min(g.fitSize(a,ew,he*.36*B),g.fitSize(b,ew,he*.36*B));
      g.fitText(a,cx,ye+he*.3,ew,sz); g.fitText(b,cx,ye+he*.7,ew,sz); } }
  // sticker spot: a quiet hint (the sticker covers it)
  const yz=y+H-zone;
  g.role("label"); g.fitText(W_.barcode+" sticker",cx,yz+(zone+m)/2,W*.6,8,C_HINT);
}

// ---------- DESIGNS: a tag type's own look (CONFIG.tagTypes design:"tv") ----------
// Same report reading, sheet sizes and printing; only the drawing changes. No design = the gun / General Merchandise tag.
// Electronics: placeholders for now (General Merchandise look) until each gets its own layout.
//   front(g,x,y,t,s) / back(g,x,y,t,s): same arguments as drawGunFront / drawGunBack.
function drawTvFront(g,x,y,t,s){ drawGunFront(g,x,y,t,s); }             // TODO: TV tag
function drawTvBack(g,x,y,t,s){ drawGunBack(g,x,y,t,s); }
function drawComputerFront(g,x,y,t,s){ drawGunFront(g,x,y,t,s); }       // TODO: Computer tag
function drawComputerBack(g,x,y,t,s){ drawGunBack(g,x,y,t,s); }
function drawMonitorFront(g,x,y,t,s){ drawGunFront(g,x,y,t,s); }        // TODO: Monitor tag
function drawMonitorBack(g,x,y,t,s){ drawGunBack(g,x,y,t,s); }
const DESIGNS = {
  tv:       {front:drawTvFront,       back:drawTvBack},
  computer: {front:drawComputerFront, back:drawComputerBack},
  monitor:  {front:drawMonitorFront,  back:drawMonitorBack},
};
const design=s=>DESIGNS[s&&s.design]||{};

const TYPE_CODE = {
  guns: {
    parse:    lines => parseRows(lines).map(toTag),          // proven gun cleanup in core.js
    draw:     (g,x,y,t,s)=>(design(s).front||drawGunFront)(g,x,y,t,s),
    drawBack: (g,x,y,t,s)=>(design(s).back||drawGunBack)(g,x,y,t,s),
  },
};

// Merge settings + code into one list
const TYPES = {};
for(const id in CONFIG.types) if(TYPE_CODE[id]) TYPES[id]=Object.assign({id}, CONFIG.types[id], TYPE_CODE[id]);
