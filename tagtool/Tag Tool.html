<script>
// ---------- Lantern Deep: the second PRAWN panel mode (scene "deep"; data + art: src/deep-data.js) ----------
// tide.js shares its kit (dialog, menus, tweens, input, drawing, growMon/moltMon) through DEEP.attach. The party is
// the PRAWN team: each critter's class comes from its species (DEEPDATA.SPCLS), level and XP are shared, and its
// Lantern Deep state (HP, MP, gear, bought skills, poison) lives in critter.dp. Map progress is saved as S.deep.
var DEEP=(function(){
  const D=DEEPDATA, W=240, H=160, SPEED=5.5, SOLID="T#ouwkmXSELPC~ZHR";
  let K=null, Q=null, mode="map", QB=null, banner=null;
  const g=()=>K.g, rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const box=(...a)=>K.box(...a), T=(...a)=>K.T(...a), TD=()=>TIDEDATA;

  // ---------- party math: class from species; stats from class growth + the critter's own base stats ----------
  const team=()=>K.S.team;
  const CI=m=>D.SPCLS[m.sp]||["landlord",0], C=m=>D.CLS[CI(m)[0]], tier=m=>CI(m)[1];
  const cname=m=>C(m).n[tier(m)], nm=m=>TD().SPECIES[m.sp].n, B4=m=>TD().SPECIES[m.sp].b, G=id=>id?D.GEAR[id]:null;
  const gr=(m,k)=>{ const c=C(m)[k]; return c[0]+c[1]*(m.lv-1); };
  const mhp=m=>Math.floor((gr(m,"hp")+B4(m)[0]/5)*(tier(m)?1.12:1)), mmp=m=>Math.floor(gr(m,"mp")*(tier(m)?1.15:1));
  const str=m=>Math.floor(gr(m,"str")+B4(m)[1]/12), agi=m=>Math.floor(gr(m,"agi")+B4(m)[3]/12), intl=m=>Math.floor(gr(m,"int")*(tier(m)?1.1:1));
  // Deep-only state, made the first time a critter shows up here; level-ups and molts add the difference to HP/MP
  function dp(m){ if(!m.dp) m.dp={hp:0,mp:0,mh:0,mm:0,w:null,a:null,sk:[],poi:0}; const d=m.dp, h=mhp(m), p=mmp(m);
    if(!d.mh){ d.hp=h; d.mp=p; } else { if(h!==d.mh&&d.hp>0) d.hp=Math.max(1,d.hp+h-d.mh); if(p!==d.mm) d.mp=Math.max(0,d.mp+p-d.mm); }
    d.mh=h; d.mm=p; d.hp=Math.min(d.hp,h); d.mp=Math.min(d.mp,p); return d; }
  const atk=m=>{ const w=G(dp(m).w); return Math.floor(str(m)/2)+(w?w.atk:0)+(C(m).fist?2+m.lv*2:0); };
  const def=m=>{ const a=G(dp(m).a); return (a?a.def:0)+Math.floor(B4(m)[2]/14)+Math.floor(m.lv/3); };
  const hits=m=>1+Math.floor((m.lv-1)/C(m).hits);
  function skills(m){ const t=tier(m), L=C(m).sk.filter(([lv,id])=>m.lv>=lv&&(!D.SK[id].t2||t)).map(x=>x[1]);
    for(const id of dp(m).sk) if(!L.includes(id)&&(!D.SK[id].t2||t)) L.push(id); return L; }
  function rest(m){ const d=dp(m); d.hp=mhp(m); d.mp=mmp(m); d.poi=0; }
  const canUse=(m,id)=>{ const it=G(id); return (it.k==="w"?C(m).wpn:C(m).arm).includes(it.cat); };
  const canBuy=(m,id)=>CI(m)[0]===D.SK[id].cls&&!dp(m).sk.includes(id);
  const up=m=>dp(m).hp>0, give=(it,n)=>{ Q.bag[it]=(Q.bag[it]||0)+n; };
  const has=c=>team().filter(m=>up(m)&&CI(m)[0]===c);
  function fresh(){ return {on:1,gold:400,bag:{tonic:3},stash:[],map:"deep",x:4,y:3,dir:3,f:{},inn:["harbor",3,8],chest:{},steps:0,safe:3}; }

  // ---------- look: the critters' own 24px icons, flipped to face the foes in rounds ----------
  const FLI=new Map(), flipI=im=>FLI.get(im)||(FLI.set(im,K.A.flip(im)),FLI.get(im));
  const icon=(m,left)=>left?flipI(K.A.icon(m.sp)):K.A.icon(m.sp);
  const leader=()=>team().find(up)||team()[0];
  // ---------- map ----------
  let MAP=null, MID="", ents=[];
  const P={x:0,y:0,dir:0,mv:0,t:0,fx:0,fy:0,step:0};
  const DIRS={down:[0,1,0],up:[0,-1,1],left:[-1,0,2],right:[1,0,3]}, DV=[[0,1],[0,-1],[-1,0],[1,0]];
  function loadMap(id){ MID=id; const m=D.MAPS[id]; MAP={...m,id,w:m.rows[0].length,h:m.rows.length};
    ents=(m.ents||[]).map(d=>({d,id:d.id,x:d.x,y:d.y,dir:d.dir||0})); }
  function place(map,x,y,dir){ loadMap(map); P.x=Q.x=x; P.y=Q.y=y; P.dir=Q.dir=dir==null?P.dir:dir; P.mv=0; Q.map=map; }
  const vis=e=>{ const d=e.d; if(d.hide&&Q.f[d.hide]) return false; if(d.show&&!Q.f[d.show]) return false; return true; };
  const tileAt=(x,y)=>(y<0||y>=MAP.h||x<0||x>=MAP.w)?"T":MAP.rows[y][x];
  const bldAt=(x,y)=>(MAP.bld||[]).find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);
  const entAt=(x,y)=>ents.find(e=>vis(e)&&e.x===x&&e.y===y);
  function solid(x,y){ const t=tileAt(x,y); if(t==="M") return false; return SOLID.includes(t)||!!bldAt(x,y)||!!entAt(x,y); }
  const faceTo=(x,y,tx,ty)=>Math.abs(tx-x)>Math.abs(ty-y)?(tx>x?3:2):(ty>y?0:1);

  async function warp(map,x,y,dir){ await K.fade(.2,1); const prev=MAP&&MAP.name; place(map,x,y,dir); Q.safe=Math.max(Q.safe,2);
    if(MAP.name!==prev) banner={t:MAP.name,a:0}; await K.fade(.2,0); }

  function update(){
    if(!Q||!MAP||mode!=="map"||P.mv) return;
    if(K.take("M")){ K.run(fieldMenu); return; }
    if(K.take("A")){ K.run(interact); return; }
    const held=K.held; let best=null, bt=0; for(const k in DIRS) if(held[k]&&held[k]>bt){ bt=held[k]; best=k; }
    if(!best) return;
    const [dx,dy,dir]=DIRS[best];
    if(P.dir!==dir&&performance.now()-held[best]<90){ P.dir=dir; return; }
    P.dir=dir; const nx=P.x+dx, ny=P.y+dy, b=bldAt(nx,ny);
    if(b&&dir===1&&b.doors.some(d=>d[0]===nx&&d[1]===ny)){ K.run(()=>shop(b.ev)); return; }
    if(solid(nx,ny)) return;
    P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.mv=1; P.t=0;
    K.tween(1/SPEED,k=>{ P.t=k; }).then(()=>{ P.mv=0; P.step^=1; onStep(); });
  }
  function onStep(){ Q.x=P.x; Q.y=P.y; Q.dir=P.dir; Q.map=MID;
    const w=(MAP.warps||[]).find(w=>w[0]===P.x&&w[1]===P.y); if(w){ K.run(()=>warp(w[2],w[3],w[4],w[5])); return; }
    const tr=(MAP.trig||[]).find(t=>t[0]===P.x&&t[1]===P.y); if(tr&&D.EV[tr[2]]){ K.run(()=>D.EV[tr[2]](E)); return; }
    if(++Q.steps%4===0) team().forEach(m=>{ const d=dp(m); if(d.poi&&d.hp>1) d.hp--; });
    if(!MAP.zone) return; if(Q.safe>0){ Q.safe--; return; }
    const t=tileAt(P.x,P.y), r=t==="g"?1/9:t===","?1/40:MAP.dark?1/14:1/20;
    if(Math.random()<r){ const F=D.ZONES[MAP.zone(P.x,P.y)]; K.run(()=>battle(F[Math.floor(Math.random()*F.length)])); }
  }
  async function interact(){
    const [dx,dy]=DV[P.dir]; const e=entAt(P.x+dx,P.y+dy); if(!e) return;
    const d=e.d; if(!["sign","chest","lantern"].includes(d.kind)) e.dir=faceTo(e.x,e.y,P.x,P.y);
    if(d.chest) return openChest(e);
    if(d.kind==="lantern") return K.say(Q.f.lit?"The Harbor Lantern blazes warm and bright.":"The Harbor Lantern flickers. Its lens frame sits empty and cold.");
    if(d.ev&&D.EV[d.ev]) await D.EV[d.ev](E);
  }
  async function openChest(e){
    if(Q.chest[e.id]) return K.say("The chest is empty.");
    Q.chest[e.id]=1; const [it,n]=e.d.chest; K.jingle();
    if(it==="gold"){ Q.gold+=n; return K.say(`Inside the chest: ${n} G!`); }
    if(D.GEAR[it]){ Q.stash.push(it); return K.say(`Inside the chest: ${D.GEAR[it].n}!\nEquip it from the menu (C).`); }
    give(it,n); return K.say(`Inside the chest: ${n>1?n+" ":""}${D.ITEMS[it].n}${n>1?"s":""}!`);
  }

  // ---------- script API (deep-data.js EV) ----------
  const E={
    say:(t,w)=>K.say(t,w), yes:(t,w)=>K.yes(t,w), f:k=>Q.f[k], set:(k,v)=>{ Q.f[k]=v===undefined?1:v; },
    give, take:it=>{ delete Q.bag[it]; }, gold:n=>{ Q.gold+=n; }, battle:(f,o)=>battle(f,o), jingle:b=>K.jingle(b),
    leave, card:lines=>K.menu("qcard",{items:[{t:""}],lines,cancel:false}),
    relight:async()=>{ for(let i=0;i<6;i++){ K.jingle(i%2); await K.wait(.3); } }
  };
  async function leave(){ await K.fade(.35,1); Q.on=0; place("deep",4,3,3); Q.safe=3; K.toTown(9,14,1); await K.fade(.35,0); }

  // ---------- entering from Tidepool Town ----------
  async function enter(){
    await K.fade(.4,1); K.setScene("deep"); QB=null;
    if(K.S.deep&&K.S.deep.f){ Q=K.S.deep; Q.on=1; place("deep",4,3,3); Q.safe=3; mode="map"; banner={t:MAP.name,a:0}; await K.fade(.4,0); return; }
    Q=fresh(); team().forEach(rest); mode="title"; await K.fade(.4,0);
    await K.menu("qpress",{items:[{t:""}],cancel:false});
    await K.fade(.4,1); K.S.deep=Q; place("deep",4,3,3); mode="map"; await K.fade(.4,0);
    banner={t:MAP.name,a:0}; await D.EV.arrive(E);
  }
  function resume(){ Q=K.S.deep; mode="map"; QB=null; place(Q.map,Q.x,Q.y,Q.dir); Q.safe=Math.max(Q.safe||0,2); banner={t:MAP.name,a:0}; }
  function sync(){ if(Q&&MAP&&!P.mv){ Q.map=MID; Q.x=P.x; Q.y=P.y; Q.dir=P.dir; } }

  // ---------- town buildings ----------
  async function shop(kind){
    if(kind==="hall") return warp("lhall",5,7,1);
    if(kind==="inn"){
      if(!(await K.yes("Welcome to the Driftwood Inn! A sponge bed for the night is 25 G. Stay?","INNKEEPER"))) return K.say("Swim safe out there!","INNKEEPER");
      if(Q.gold<25) return K.say("Oh dear, you're a little short on gold.","INNKEEPER");
      Q.gold-=25; await K.fade(.5,1); team().forEach(m=>{ if(up(m)) rest(m); }); Q.inn=["harbor",3,8]; await K.wait(.5); await K.fade(.5,0);
      K.jingle(); K.save(); await K.say("Good morning! Everyone's rested.","INNKEEPER");
      if(team().some(m=>!up(m))) await K.say("Your knocked-out friend needs the Shrine, though. It's just down the lane.","INNKEEPER");
      return; }
    if(kind==="shrine"){
      for(;;){ const opts=["Wake a friend",...(Q.f.lit?["Molt Rite"]:[]),"Leave"];
        const c=opts[await K.ask("Shrine of the Tide. How can the current help?",opts,"SHRINE KEEPER")];
        if(!c||c==="Leave") return K.say("May the current carry you.","SHRINE KEEPER");
        if(c==="Wake a friend"){ const L=team().filter(m=>!up(m)); if(!L.length){ await K.say("All your friends are awake and well.","SHRINE KEEPER"); continue; }
          const i=await shopMenu({title:"WAKE A FRIEND",items:L.map(m=>({t:nm(m),p:20+m.lv*10,d:`Wake ${nm(m)} up with 1 HP.`}))}); if(i<0) continue; const m=L[i];
          if(Q.gold<20+m.lv*10){ await K.say("You don't have enough gold.","SHRINE KEEPER"); continue; }
          Q.gold-=20+m.lv*10; dp(m).hp=1; K.jingle(); await K.say(`${nm(m)} opens its eyes!`,"SHRINE KEEPER"); }
        if(c==="Molt Rite"){
          await K.say("The Molt Rite coaxes a critter into its grown-up form early. Its calling changes too. It needs level 12 and 300 G.","SHRINE KEEPER");
          const i=await pickAlly("Who will molt?",m=>m.lv>=12&&!!TD().SPECIES[m.sp].evo); if(i<0) continue; const m=team()[i];
          if(Q.gold<300){ await K.say("You don't have enough gold.","SHRINE KEEPER"); continue; }
          Q.gold-=300; await K.say(`The keeper hums an old tide song over ${nm(m)}...`,"SHRINE KEEPER"); await K.molt(m); } } }
    if(kind==="item"){
      const ids=Object.keys(D.ITEMS).filter(k=>D.ITEMS[k].p);
      for(;;){ const i=await shopMenu({title:"ITEM SHOP",items:ids.map(id=>({t:D.ITEMS[id].n,p:D.ITEMS[id].p,d:D.ITEMS[id].d+`  (have ${Q.bag[id]||0})`}))});
        if(i<0) return K.say("Come again!","SHOPKEEP"); const id=ids[i];
        if(Q.gold<D.ITEMS[id].p){ await K.say("You don't have enough gold.","SHOPKEEP"); continue; }
        if((Q.bag[id]||0)>=99){ await K.say("Your bag can't hold any more.","SHOPKEEP"); continue; }
        Q.gold-=D.ITEMS[id].p; give(id,1); } }
    if(kind==="arms"){
      for(;;){ const c=await K.ask("Arms and shells! Buy or sell?",["Buy","Sell","Leave"],"ARMORER"); if(c<0||c===2) return;
        if(c===1){ await sellGear(); continue; }
        const ids=Object.keys(D.GEAR).filter(k=>D.GEAR[k].p);
        for(;;){ const i=await shopMenu({title:"ARMS",items:ids.map(id=>({t:D.GEAR[id].n,p:D.GEAR[id].p,d:gearDesc(id)}))});
          if(i<0) break; const id=ids[i], it=G(id);
          if(Q.gold<it.p){ await K.say("You don't have enough gold.","ARMORER"); continue; }
          const j=await pickAlly(`Who gets the ${it.n}?`,m=>canUse(m,id)); if(j<0) continue;
          const m=team()[j], d=dp(m), slot=it.k; Q.gold-=it.p; if(d[slot]) Q.stash.push(d[slot]); d[slot]=id;
          await K.say(`${nm(m)} equips the ${it.n}!`); } } }
    if(kind==="tutor"){
      const ids=Object.keys(D.SK).filter(k=>D.SK[k].buy&&team().some(m=>CI(m)[0]===D.SK[k].cls));   // only callings on the team (17 won't fit)
      if(!ids.length) return K.say("I've nothing to teach your team's callings. Come back with new friends!","TUTOR");
      for(;;){ const i=await shopMenu({title:"SKILL TUTOR",items:ids.map(id=>{ const s=D.SK[id]; return {t:s.n,p:s.buy,d:`${s.d} For a ${D.CLS[s.cls].n[0]}.`}; })});
        if(i<0) return K.say("Practice makes perfect. Mostly.","TUTOR"); const id=ids[i], s=D.SK[id];
        if(Q.gold<s.buy){ await K.say("You don't have enough gold.","TUTOR"); continue; }
        const j=await pickAlly(`Who learns ${s.n}?`,m=>canBuy(m,id)); if(j<0) continue;
        const m=team()[j]; Q.gold-=s.buy; dp(m).sk.push(id); K.jingle(); await K.say(`${nm(m)} learned ${s.n}!`); } }
  }
  const gearDesc=id=>{ const it=G(id), who=team().filter(m=>(it.k==="w"?C(m).wpn:C(m).arm).includes(it.cat)).map(nm);   // team members only: 17 callings won't fit
    return (it.k==="w"?`Attack +${it.atk}. `:`Defense +${it.def}. `)+(who.length?"For: "+who.join(", ")+".":"No one on your team can use it."); };
  async function sellGear(){
    for(;;){ if(!Q.stash.length) return K.say("You have no spare gear to sell.","ARMORER");
      const i=await shopMenu({title:"SELL",items:Q.stash.map(id=>({t:G(id).n,p:Math.floor((G(id).p||60)/2),d:gearDesc(id)}))});
      if(i<0) return; const id=Q.stash.splice(i,1)[0]; Q.gold+=Math.floor((G(id).p||60)/2); }
  }

  // ---------- pickers (shared by field and rounds) ----------
  const shopCur={}, shopMenu=o=>K.menu("qshop",Object.assign(o,{cur:Math.max(0,Math.min(shopCur[o.title]||0,o.items.length-1))})).then(i=>{ if(i>=0) shopCur[o.title]=i; return i; });
  async function pickAlly(prompt,ok){ const items=team().map(m=>({t:nm(m),m,dis:!ok(m)})); return K.menu("qally",{prompt,items,cur:Math.max(0,items.findIndex(it=>!it.dis))}); }
  const fieldOk=s=>["heal","revive","mp"].includes(s.fx)||(s.cure&&s.tg!=="foe");
  async function pickSkill(m,field){
    const L=skills(m); if(!L.length){ await K.say(`${nm(m)} hasn't found its calling yet.`); return null; }
    const i=await K.menu("qskill",{m,items:L.map(id=>({t:D.SK[id].n,id,dis:dp(m).mp<D.SK[id].mp||(field&&!fieldOk(D.SK[id]))}))});
    return i<0?null:L[i]; }
  async function pickItem(inBattle){
    const ids=Object.keys(Q.bag).filter(k=>Q.bag[k]>0&&D.ITEMS[k]);
    if(!ids.length){ await K.say("The bag is empty."); return null; }
    const i=await K.menu("qitem",{items:ids.map(id=>({t:D.ITEMS[id].n,n:Q.bag[id],id,d:D.ITEMS[id].d,dis:D.ITEMS[id].key||(inBattle&&D.ITEMS[id].field)}))});
    return i<0?null:ids[i]; }
  // who a skill or item can go to: knocked-out friends only for revives
  const allyOk=o=>m=>(o.fx==="revive"||o.use==="revive")?!up(m):up(m);

  // ---------- field menu ----------
  async function fieldMenu(){
    for(;;){
      const opts=["ITEMS","SKILLS","EQUIP","STATUS","ORDER","SAVE"];
      const i=await K.menu("qmain",{items:opts.map(t=>({t}))}); if(i<0) return; const o=opts[i];
      if(o==="ITEMS") await fieldItem();
      if(o==="SKILLS") await fieldSkill();
      if(o==="EQUIP") await equip();
      if(o==="STATUS"){ const j=await pickAlly("Whose status?",()=>true); if(j>=0) await K.menu("qstat",{items:[{t:""}],m:team()[j]}); }
      if(o==="ORDER"){ if(team().length<2) continue; const a=await pickAlly("Swap who?",()=>true); if(a<0) continue; const b=await pickAlly(`Swap ${nm(team()[a])} with?`,m=>m!==team()[a]);
        if(b>=0){ const t=team()[a]; team()[a]=team()[b]; team()[b]=t; } }
      if(o==="SAVE"){ K.save(); await K.say("Your journey has been saved."); }
    }
  }
  async function fieldItem(){
    for(;;){ const id=await pickItem(false); if(!id) return; const I=D.ITEMS[id];
      if(I.use==="camp"){ if(MID!=="deep"){ await K.say("You can only camp out on the open sea floor."); continue; }
        Q.bag[id]--; await K.fade(.5,1); team().forEach(m=>{ if(up(m)) rest(m); }); await K.wait(.4); await K.fade(.5,0); K.jingle(); await K.say("Everyone curls up in a Sleep Sponge and wakes up refreshed!"); return; }
      const j=await pickAlly(`Use the ${I.n} on who?`,allyOk(I)); if(j<0) continue;
      await useItem(id,team()[j],false); }
  }
  async function fieldSkill(){
    const c=await pickAlly("Who uses a skill?",m=>up(m)&&skills(m).some(id=>fieldOk(D.SK[id]))); if(c<0) return; const m=team()[c];
    for(;;){ const id=await pickSkill(m,true); if(!id) return; const s=D.SK[id]; let t=null;
      if(s.tg==="ally"){ const j=await pickAlly(`${s.n} on who?`,allyOk(s)); if(j<0) continue; t=team()[j]; }
      await useSkill(m,id,t,false); }
  }
  async function useItem(id,t,inB){
    const I=D.ITEMS[id], d=dp(t), i=team().indexOf(t); if(!(Q.bag[id]>0)){ await say2("But there are none left!",inB); return; }
    Q.bag[id]--;
    if(I.use==="heal"){ if(!up(t)){ await say2(`${nm(t)} is knocked out. Nothing happens.`,inB); return; } const h=Math.min(I.v,mhp(t)-d.hp); d.hp+=h; pop(i,h,"#7dffa0",inB); await say2(`${nm(t)} recovers ${h} HP.`,inB); }
    if(I.use==="mp"){ const h=Math.min(I.v,mmp(t)-d.mp); d.mp+=h; await say2(`${nm(t)} recovers ${h} MP.`,inB); }
    if(I.use==="cure"){ d.poi=0; await say2(`${nm(t)} is no longer poisoned.`,inB); }

  }

  // ---------- skills: one routine for the field and for rounds ----------
  const EC={tide:"#9fe6ff",kelp:"#7be08a",vent:"#ff7a3d",shell:"#ffe0a0",spark:"#ffe14d",ink:"#a98cff"};
  async function useSkill(m,id,tgt,inB){
    const s=D.SK[id], d=dp(m), mi=team().indexOf(m);
    if(d.mp<s.mp){ await say2(`${nm(m)} is out of MP!`,inB); return; }
    d.mp-=s.mp; if(inB) await msg(`${nm(m)}: ${s.n}!`,.55);
    if(s.hpcost) d.hp=Math.max(1,d.hp-Math.ceil(mhp(m)*s.hpcost));
    if(s.tg==="foe"||s.tg==="foes"||s.tg==="foes2"){
      let L=s.tg==="foe"?[tgt&&!tgt.dead?tgt:aliveFoes()[0]]:aliveFoes();
      if(s.tg==="foes2") L=L.sort(()=>Math.random()-.5).slice(0,2);
      let strong=0, weak=0, said=[];
      for(const f of L.filter(Boolean)){ const M=D.MON[f.id];
        if(s.fx==="evict"&&!M.boss&&f.hp<=M.hp*.35){ f.hp=0; await killFoe(f); said.push(`${M.n} was evicted!`); continue; }
        if(s.pw||s.mul){ const e=s.el?TD().eff(s.el,M.t):1; let dmg=0;
          for(let h=0;h<(s.hits||1);h++){ const a0=atk(m)*buffAtk(mi);
            dmg+=s.pw?rnd(s.pw[0],s.pw[1])+Math.floor(intl(m)/2):Math.max(1,Math.floor(rnd(a0,a0*2)*s.mul)-(s.pierce?0:M.def)); }
          if(QB.ms[mi].amb){ dmg*=2; QB.ms[mi].amb=0; }
          if(CI(m)[0]==="somm"&&s.el==="tide") dmg*=1.2; if(CI(m)[0]==="courier"&&s.el==="spark") dmg*=1.2; if(CI(m)[0]==="poet"&&s.el==="ink") dmg*=1.2;
          dmg=Math.max(1,Math.floor(dmg*e)); if(e>1) strong=1; if(e<1) weak=1;
          parts(f.x+fsz(f)/2,f.y+fsz(f)/2,EC[s.el]||"#ffffff",12); hurtFoe(f,dmg); }
        if(f.dead) continue;
        if(s.fx==="poison"&&Math.random()<(s.ch||1)){ f.poi=1; }
        if(s.fx==="sleep"){ if(M.boss) said.push(`${M.n} shrugs it off!`); else if(Math.random()<s.ch){ f.sleep=rnd(1,2); said.push(`${M.n} stops to stare. It won't act!`); } else said.push(`${M.n} isn't fooled.`); }
        if(s.fx==="atkDn") f.atkDn=1; if(s.fx==="hitDn") f.hitDn=1;
        if(CI(m)[0]==="painter"&&s.el==="ink"&&!f.hitDn&&Math.random()<.35){ f.hitDn=1; said.push(`${M.n} gets ink in its eyes!`); }
        if(s.fx==="steal"){ if(f.stolen){ said.push("Nothing left to swipe!"); continue; } f.stolen=1;
          if(Math.random()<.5){ const n=M.g*2+rnd(0,10); Q.gold+=n; said.push(`Swiped ${n} G!`); }
          else { const it=Math.random()<.7?"tonic":"spritz"; give(it,1); said.push(`Swiped a ${D.ITEMS[it].n}!`); } }
      }
      await K.wait(.4);
      if(s.fx==="atkDn") said.push("The foes hit softer now."); if(s.fx==="hitDn") said.push("The foes can barely see!");
      if(s.fx==="poison"&&L.some(f=>f&&f.poi&&!f.dead)) said.push("Poisoned!");
      if(strong) said.unshift("It's extra effective!"); else if(weak) said.unshift("It barely stings...");
      const fell=L.filter(f=>f&&f.dead&&!f.told); fell.forEach(f=>f.told=1); if(fell.length) said.push(fell.length>1?"The foes are defeated!":`${D.MON[fell[0].id].n} is defeated!`);
      if(s.self){ d.hp=Math.max(1,d.hp-Math.ceil(mhp(m)*s.self)); pop(mi,Math.ceil(mhp(m)*s.self),"#ffffff",1); }
      for(const t of said) await msg(t,.55);
      return; }
    if(s.fx==="flow") return flow(m,inB);
    const L=s.tg==="self"?[m]:s.tg==="ally"?[tgt]:team().filter(up);
    const lines=[];
    for(const t of L){ const td=dp(t), i=team().indexOf(t);
      if(s.fx==="revive"){ if(up(t)){ lines.push(`${nm(t)} is already awake.`); continue; } td.hp=Math.max(1,Math.floor(mhp(t)*s.pct)); pop(i,td.hp,"#7dffa0",inB); lines.push(`${nm(t)} wakes up!`); continue; }
      if(!up(t)) continue;
      if(s.fx==="heal"){ const h=Math.min(mhp(t)-td.hp,s.pct?Math.floor(mhp(t)*s.pct):rnd(s.pw[0],s.pw[1])+Math.floor(intl(m)/2)); td.hp+=h; pop(i,h,"#7dffa0",inB); }
      if(s.cure) td.poi=0;
      if(s.fx==="mp"){ const h=Math.min(s.v,mmp(t)-td.mp); td.mp+=h; lines.push(`${nm(t)} gets ${h} MP.`); }
      if(inB){ const ms=QB.ms[i];
        if(s.fx==="guard"){ ms.guard=1; lines.push(`${nm(t)} hunkers down. Come at it!`); }
        if(s.fx==="counter"){ ms.counter=1; lines.push(`${nm(t)} puffs up, spines out!`); }
        if(s.fx==="hide"){ ms.hide=1; ms.amb=1; lines.push(`${nm(t)} is just some seaweed now.`); }
        if(s.fx==="defUp") ms.def+=5; if(s.fx==="atkUp") ms.atk=Math.min(2,ms.atk+1); if(s.fx==="agiUp"){ ms.agi+=6; ms.eva+=8; } if(s.fx==="evaUp") ms.eva+=15; }
    }
    if(s.fx==="heal"){ if(CI(m)[0]==="sauce") team().filter(up).forEach(t=>{ dp(t).hp=Math.min(mhp(t),dp(t).hp+3); });
      lines.push(L.length>1?"Everyone feels better!":`${nm(L[0])} feels better!`); }
    if(s.cure&&s.fx!=="heal") lines.push("Cured!");
    if(s.fx==="defUp") lines.push("Everyone's shell hardens!"); if(s.fx==="atkUp") lines.push("Everyone's fired up!");
    if(s.fx==="agiUp") lines.push("Everyone sways to the beat. Quicker now!"); if(s.fx==="evaUp") lines.push("Everyone's harder to hit!");
    for(const t of lines) await say2(t,inB);
  }
  async function flow(m,inB){   // Go With the Flow: the current picks the song
    const r=Math.random();
    if(r<.3){ team().filter(up).forEach(t=>{ const h=Math.floor(mhp(t)*.3); dp(t).hp=Math.min(mhp(t),dp(t).hp+h); pop(team().indexOf(t),h,"#7dffa0",inB); }); return say2("A warm current! Everyone feels better.",inB); }
    if(r<.6&&inB){ for(const f of aliveFoes()) hurtFoe(f,rnd(10,18)+Math.floor(intl(m)/2)); await K.wait(.4); return msg("A riptide crashes into every foe!"); }
    if(r<.85&&inB){ QB.ms.forEach(x=>x.atk=Math.min(2,x.atk+1)); return msg("An upbeat current! Everyone's fired up."); }
    return say2("The current took the song somewhere else. Nothing happens.",inB);
  }

  // ---------- rounds ----------
  // smaller teams meet smaller groups; a big foe keeps its helpers
  function mkFoes(form){ const n=team().length, L=[];
    for(const [id,c] of form){ const k=n>=4||D.MON[id].boss?c:Math.max(1,Math.round(c*(n+1)/5)); for(let i=0;i<k;i++) L.push({id,hp:D.MON[id].hp,dead:0,fade:0,fl:0,lx:0}); }
    const F=L.slice(0,6), big=F.find(f=>D.MON[f.id].art[2]&&D.MON[f.id].art[2].big);
    if(big){ big.x=8; big.y=26; F.filter(f=>f!==big).forEach((f,i)=>{ f.x=64+(i>=3?32:0); f.y=16+(i%3)*30; }); }
    else { const cols=F.length>3?2:1; F.forEach((f,i)=>{ const c=cols===2?Math.floor(i/3):0, r=cols===2?i%3:i; f.x=cols===2?14+c*48:36; f.y=(cols===2?16:Math.round((3-F.length)*15)+16)+r*30; }); }   // rows clear of the message bar
    return F; }
  const msg=async(t,s)=>{ QB.msg=t; await K.wait((K.held.A?.45:1)*(s||.75)); };
  const say2=(t,inB)=>inB&&QB?msg(t):K.say(t);
  const py=i=>16+i*22;   // team icons on the right, clear of the message bar
  function pop(i,n,c,inB){ if(!inB||!QB) return; QB.pops.push({x:212,y:py(i)+6,s:String(n),c,t:0}); }
  const aliveFoes=()=>QB.foes.filter(f=>!f.dead);
  function parts(x,y,c,n){ for(let i=0;i<(n||10);i++) QB.parts.push({x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*20,vx:(Math.random()-.5)*40,vy:-20-Math.random()*30,life:.6+Math.random()*.3,c}); }
  const fsz=f=>D.mon(f.id).width, buffAtk=i=>1+.3*QB.ms[i].atk;
  const STANCE=["guard","counter","hide"];
  const mkMs=()=>({atk:0,def:0,agi:0,eva:0,guard:0,counter:0,hide:0,amb:0});

  async function battle(form,opt){ opt=opt||{};
    K.fadeKind("bubbles"); await K.fade(.45,1);
    QB={foes:mkFoes(form),opt,boss:!!opt.boss,msg:"",pops:[],parts:[],cur:-1,act:-1,ms:team().map(mkMs),shake:team().map(()=>0),dark:!!MAP.dark};
    mode="battle"; K.fadeKind("black"); await K.fade(.35,0);
    await msg(QB.boss?`${D.MON[QB.foes[0].id].n} blocks the way!`:QB.foes.length>1?"Foes swim out of the gloom!":"A foe swims out of the gloom!",.9);
    let res=null, round=0;
    while(!res){ round++;
      const acts=[], n=team().length; let i=0;
      while(i<n){ const m=team()[i]; if(!up(m)){ i++; continue; }
        QB.cur=i; QB.msg=`${nm(m)} the ${cname(m)}`; const a=await command(m);
        if(!a){ let j=i-1; while(j>=0&&!up(team()[j])) j--; if(j>=0){ acts.pop(); i=j; } continue; }
        a.side="p"; a.i=i; acts.push(a); i++; }
      QB.cur=-1;
      for(const f of QB.foes) if(!f.dead) acts.push({side:"f",f});
      acts.forEach(a=>a.spd=(a.side==="p"?agi(team()[a.i])+QB.ms[a.i].agi:D.MON[a.f.id].agi)+rnd(0,12)+(a.k==="skill"&&STANCE.includes(D.SK[a.id].fx)?999:0));
      acts.sort((a,b)=>b.spd-a.spd);   // stances (guard, puff up, blend in) always go first
      for(const a of acts){
        if(a.side==="p"){ const m=team()[a.i]; if(!up(m)) continue; QB.act=a.i; const r=await partyAct(m,a); QB.act=-1; if(r){ res=r; break; } }
        else { if(a.f.dead) continue; await foeAct(a.f,round); }
        if(QB.foes.every(f=>f.dead)){ res="win"; break; }
        if(!team().some(up)){ res="lose"; break; }
      }
      if(!res) res=await roundEnd();
      QB.msg="";
    }
    if(res==="win"){
      let xp=0, gold=0; for(const f of QB.foes){ xp+=D.MON[f.id].xp; gold+=D.MON[f.id].g; }
      const rent=Math.max(0,...has("landlord").map(m=>tier(m)?.3:.15))+Math.max(0,...has("grocer").map(m=>tier(m)?.2:.1)); gold=Math.floor(gold*(1+rent));
      const live=team().filter(up), each=Math.max(1,Math.floor(xp*(K.S.perks.pearl?1.2:1)/live.length)); Q.gold+=gold; QB.msg="";
      await K.say(`Victory! The team gets ${gold} G${rent?" (rent included)":""} and ${each} XP each.`);
      if(has("curator").length&&Math.random()<.15){ const it=Math.random()<.6?"spritz":"spark"; give(it,1); await K.say(`${nm(has("curator")[0])} appraised the loot and found a ${D.ITEMS[it].n}!`); }
      if(has("impostor").length&&Math.random()<.2){ const it=Math.random()<.7?"tonic":"spritz"; give(it,1); await K.say(`${nm(has("impostor")[0])} swiped a ${D.ITEMS[it].n} on the way out!`); }
      for(const m of live) await K.grow(m,each);
    }
    if(res==="lose"){
      await K.say("The whole team is knocked out..."); await K.say("A kind current sweeps them all the way back to the harbor.");
      await K.fade(.6,1); mode="map"; QB=null; Q.gold=Math.floor(Q.gold/2); team().forEach(rest); const h=Q.inn; place(h[0],h[1],h[2],0); Q.safe=3;
      await K.fade(.6,0); await K.say("You wake up at the Driftwood Inn, sore but safe. Half your gold washed away."); return res; }
    await K.fade(.3,1); mode="map"; QB=null; Q.safe=2; await K.fade(.3,0);
    return res;
  }
  async function roundEnd(){
    for(const m of team()){ const d=dp(m), i=team().indexOf(m); if(!up(m)) continue;
      if(d.poi){ const x=Math.max(1,Math.floor(mhp(m)/16)); d.hp=Math.max(1,d.hp-x); pop(i,x,"#b6ff6a",1); await msg(`${nm(m)} is hurt by poison.`,.5); }
      if(CI(m)[0]==="lender"&&d.hp<mhp(m)){ const h=Math.max(1,Math.floor(mhp(m)*.05)); d.hp=Math.min(mhp(m),d.hp+h); pop(i,h,"#7dffa0",1); } }
    if(has("crooner").length) team().filter(up).forEach(m=>{ dp(m).mp=Math.min(mmp(m),dp(m).mp+1); });
    has("keeper").filter(up).forEach(m=>{ dp(m).mp=Math.min(mmp(m),dp(m).mp+2); });
    for(const f of aliveFoes()) if(f.poi){ hurtFoe(f,Math.max(1,Math.floor(D.MON[f.id].hp/10))); }
    if(aliveFoes().some(f=>f.poi)) await K.wait(.4);
    QB.ms.forEach(s=>{ s.guard=0; s.counter=0; s.hide=0; });
    if(QB.foes.every(f=>f.dead)) return "win";
    return null;
  }
  async function command(m){
    for(;;){ if(!aliveFoes().length) return {k:"wait"};
      const c=await K.menu("qcmd",{items:[{t:"FIGHT"},{t:"SKILL",dis:!skills(m).length},{t:"ITEM"},{t:"RUN"}]});
      if(c<0) return null;
      if(c===0){ const f=await pickFoe(); if(f) return {k:"fight",t:f}; }
      if(c===1){ const id=await pickSkill(m,false); if(!id) continue; const s=D.SK[id]; let t=null;
        if(s.tg==="foe"){ t=await pickFoe(); if(!t) continue; }
        if(s.tg==="ally"){ const j=await pickAlly(`${s.n} on who?`,allyOk(s)); if(j<0) continue; t=team()[j]; }
        return {k:"skill",id,t}; }
      if(c===2){ const id=await pickItem(true); if(!id) continue; const I=D.ITEMS[id];
        const j=await pickAlly(`Use the ${I.n} on who?`,allyOk(I)); if(j<0) continue; return {k:"item",id,t:team()[j]}; }
      if(c===3) return {k:"run"};
    }
  }
  async function pickFoe(){ const L=aliveFoes(); if(!L.length) return null; const i=await K.menu("qtgt",{items:L.map(f=>({t:D.MON[f.id].n,f})),lr:1}); return i<0?null:L[i]; }

  async function killFoe(f){ f.dead=1; await K.tween(.35,k=>{ f.fade=k; }); }
  function hurtFoe(f,d){ f.hp-=d; f.fl=.35; QB.pops.push({x:f.x+fsz(f)/2,y:f.y+8,s:String(d),c:"#ffffff",t:0});
    if(f.hp<=0&&!f.dead) return killFoe(f); return Promise.resolve(); }
  function hurtMember(m,d){ const i=team().indexOf(m), dd=dp(m); dd.hp=Math.max(0,dd.hp-d); QB.shake[i]=.35; pop(i,d,"#ffffff",1); if(!dd.hp) dd.poi=0; }

  async function partyAct(m,a){
    const mi=team().indexOf(m);
    if(a.k==="run"){
      if(QB.boss){ await msg("There's no swimming away from this one!"); return null; }
      const fa=aliveFoes().reduce((s,f)=>s+D.MON[f.id].agi,0)/Math.max(1,aliveFoes().length);
      const ch=clamp(.55+(agi(m)-fa)*.03+(CI(m)[0]==="impostor"?.3:0),.1,.97);
      if(Math.random()<ch){ await msg(`${nm(m)} leads everyone away!`); return "run"; }
      await msg(`${nm(m)} couldn't get away!`); return null; }
    if(a.k==="item"){ await msg(`${nm(m)} uses a ${D.ITEMS[a.id].n}.`,.5); await useItem(a.id,a.t,true); return null; }
    if(a.k==="skill"){ await useSkill(m,a.id,a.t,true); return null; }
    if(a.k==="fight"){
      const f=a.t&&!a.t.dead?a.t:aliveFoes()[0]; if(!f) return null; const M=D.MON[f.id], w=G(dp(m).w), n=hits(m), crit=CI(m)[0]==="slinger"?.2:CI(m)[0]==="raver"?.15:.04;
      let tot=0, land=0, cr=0;
      for(let h=0;h<n;h++){ if(rnd(1,100)>clamp(80+(w?w.hit:0)+agi(m)/2-M.ev,15,98)) continue;
        land++; const a0=Math.floor(atk(m)*buffAtk(mi)); let d=rnd(a0,a0*2)-M.def; if(Math.random()<crit){ d+=a0; cr=1; } tot+=Math.max(1,d); }
      if(QB.ms[mi].amb&&land){ tot*=2; QB.ms[mi].amb=0; }
      QB.msg=`${nm(m)} attacks ${M.n}`+(n>1?` (${land} hit${land===1?"":"s"})`:"");
      if(!land){ QB.pops.push({x:f.x+fsz(f)/2,y:f.y+8,s:"Miss",c:"#bfe6ff",t:0}); await msg(QB.msg,.6); return null; }
      parts(f.x+fsz(f)/2,f.y+fsz(f)/2,"#ffffff",6); await hurtFoe(f,tot); await msg(QB.msg+(cr?" Lucky hit!":""),.6);
      if(f.dead) await msg(`${M.n} is defeated!`,.5);
      return null; }
    return null;
  }
  async function foeAct(f,round){
    const M=D.MON[f.id], L=team().filter(up); if(!L.length) return;
    if(f.sleep>0){ f.sleep--; await msg(`${M.n} is too dazed to act.`,.5); return; }
    await K.tween(.15,k=>{ f.lx=Math.sin(k*Math.PI)*8; }); f.lx=0;
    const atkMul=f.atkDn?.75:1;
    if(M.slam&&round%M.slam===0){ await msg(`${M.n} swings his rusty anchor!`,.6);
      for(const m of L){ const i=team().indexOf(m); if(QB.ms[i].hide) continue; hurtMember(m,Math.max(1,Math.floor(rnd(14,22)*atkMul)-Math.floor((def(m)+QB.ms[i].def)/2))); }
      await K.wait(.5); const ko=L.filter(m=>!up(m)); if(ko.length) await msg(ko.map(nm).join(" and ")+(ko.length>1?" are":" is")+" knocked out!");
      return; }
    // a guarding critter draws the hit; hidden ones can't be picked; otherwise the front of the line gets picked on more
    const pool=team().map((m,i)=>({m,i})).filter(o=>up(o.m)&&!QB.ms[o.i].hide);
    if(!pool.length){ await msg(`${M.n} looks around. Where did everyone go?`,.6); return; }
    const g2=pool.find(o=>QB.ms[o.i].guard); let pick=g2;
    if(!pick){ const wts=pool.map(o=>[4,3,2,2][o.i]); let r=Math.random()*wts.reduce((a,b)=>a+b,0), k=0; while(k<pool.length-1&&(r-=wts[k])>0) k++; pick=pool[k]; }
    const t=pick.m, ti=pick.i, ms=QB.ms[ti];
    if(M.zap&&Math.random()<M.zap){ await msg(`${M.n} crackles with a shock!`,.5); parts(212,py(ti)+12,"#ffe14d",12);
      hurtMember(t,rnd(10,18)); await K.wait(.4); if(!up(t)) await msg(`${nm(t)} is knocked out!`); return; }
    const ch=clamp(85-agi(t)/2-ms.eva-(f.hitDn?25:0)-(CI(t)[0]==="raver"?10:0),15,95);
    QB.msg=`${M.n} attacks ${nm(t)}`;
    if(rnd(1,100)>ch){ pop(ti,"Miss","#bfe6ff",1); await msg(QB.msg,.55); return; }
    const guardDef=ms.guard?Math.floor(def(t)*.8):0, puff=ms.counter?6:0, bark=CI(t)[0]==="squire"?(tier(t)?6:3):0;
    hurtMember(t,Math.max(1,Math.floor(rnd(M.atk,M.atk*2)*atkMul)-def(t)-ms.def-guardDef-puff-bark));
    await msg(QB.msg,.55);
    if(!up(t)){ await msg(`${nm(t)} is knocked out!`); return; }

<script>
// ---------- PRAWN: engine (probe slot "PRAWN") ----------
// PRAWN probe panel: a small pixel sim of a young cleaner shrimp and critter companions in the Coral Sea.
// Art: tide-art.js · data + scripts: tide-data.js. Saved per computer in localStorage "tagtool.tide".
// Tag tie-in: app.js calls TIDE.award("print",[item #s]); each item # pays once a day into the drift crate
// by the shrimp's home (Bubble Snacks, Kelp Tonics) and unlocks perks at tag milestones. No XP from tags.
var TIDE=(function(){
  const A=TIDEART, D=TIDEDATA, W=240, H=160, KEY="tagtool.tide", VER=1, SPEED=5;
  const SOLID="T#ouwkmXSELPC~K";
  let S=null, g=null, cv=null, host=null, raf=0, lastT=0, time=0, open=false;
  const dbg={on:false};

  // ---------- save ----------
  function fresh(){ return {v:VER,name:"",map:"home",x:6,y:2,dir:2,team:[],box:[],bag:{snack:0,tonic:0},flags:{},seen:{},caught:{},
    heal:["home",6,3],tags:0,crate:{snack:0,tonic:0},perks:{},newPerks:[],day:null,started:0}; }
  function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.v===VER){ const o=Object.assign(fresh(),s);
      if(o.team.length>D.TEAM_MAX) o.box.push(...o.team.splice(D.TEAM_MAX));   // older saves had room for 6
      return o; } }catch(e){} return fresh(); }
  const st=()=>S||(S=load());   // award() can run before the panel was ever opened
  let depth=0;   // scripts in flight: saving mid-event could store half a cutscene, so it waits until they finish
  function save(){ if(depth>0) return; try{ if(S) localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

  // ---------- tag tool hook: print only, each item # once per day ----------
  function award(kind,keys){
    if(kind!=="print") return; const s=st(), day=new Date().toDateString();
    if(!s.day||s.day.d!==day) s.day={d:day,k:{},blank:0};
    const list=Array.isArray(keys)?keys:Array.from({length:Math.max(1,+keys||1)},()=>""); let n=0;
    for(const k of list){ if(k){ if(s.day.k[k]) continue; s.day.k[k]=1; n++; } else if(s.day.blank<25){ s.day.blank++; n++; } }
    for(let i=0;i<n;i++){ s.tags++; s.crate.snack=Math.min(20,s.crate.snack+1); if(s.tags%3===0) s.crate.tonic=Math.min(10,s.crate.tonic+1);
      for(const p of D.PERKS) if(s.tags>=p.at&&!s.perks[p.id]){ s.perks[p.id]=1; s.newPerks.push(p.id); } }
    if(n){ if(depth>0) return; save(); }    // mid-event: picked up by the save when the event ends
  }

  // ---------- critters ----------
  const SP=id=>D.SPECIES[id], MV=id=>D.MOVES[id];
  const xpAt=L=>Math.floor(.8*L*L*L);
  function stat(m,k){ const b=SP(m.sp).b; if(k==="hp") return Math.floor(2*b[0]*m.lv/100)+m.lv+11;
    return Math.floor(2*b[{atk:1,def:2,spd:3}[k]]*m.lv/100)+5; }
  function mkMon(sp,lv){ const s=SP(sp), L=s.from?[...SP(s.from).learn,...s.learn]:s.learn;   // a molted form met early still knows its base form's moves
    const mv=[...new Set(L.filter(l=>l[0]<=lv).map(l=>l[1]))].slice(-4); const m={sp,lv,xp:xpAt(lv),hp:0,mv}; m.hp=stat(m,"hp"); return m; }
  const nm=m=>SP(m.sp).n, alive=m=>m.hp>0;
  function healAll(){ S.team.forEach(m=>m.hp=stat(m,"hp")); }

  // ---------- input ----------
  const KMAP={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right",
    z:"A",Z:"A"," ":"A",Enter:"A",x:"B",X:"B",Escape:"B",Backspace:"B",c:"M",C:"M",Tab:"M"};
  const held={}; let queue=[], nameBuf=null;
  function kd(e){
    if(e.key==="Escape"&&e.shiftKey) return; if(e.key==="Enter"&&e.altKey) return;
    if(pet){ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); pet.close(); } return; }   // pet screen has its own keys
    e.stopPropagation(); if(!e.ctrlKey&&!e.metaKey) e.preventDefault();
    if(nameBuf){ if(e.key==="Enter"){ nameBuf.done=1; } else if(e.key==="Backspace") nameBuf.s=nameBuf.s.slice(0,-1);
      else if(e.key.length===1&&/[A-Za-z0-9 '\-]/.test(e.key)&&nameBuf.s.length<(nameBuf.max||10)) nameBuf.s+=e.key; return; }

      else if(act.k==="tonic"){ S.bag.tonic--; const m=S.team[act.i], h=Math.min(20,stat(m,"hp")-m.hp); m.hp+=h; await say(`${nm(m)} drank a Kelp Tonic and got ${h} HP back!`); }

          await say(`${def.name} sent out ${nm(foe())}!`); await tween(.35,k=>B.fo=200*(1-k)); }

  const me=()=>S.team[B.mi], foe=()=>B.foes[B.fi];

  async function chooseAction(){

  async function doMove(side,mv){

    const lbl=m=>(m===foe()?(B.wild?"Wild ":"Foe "):"")+nm(m);

  async function gainXp(){

  // one owner for XP, levels and molts: PRAWN rounds and Lantern Deep (src/deep.js) both call these

  async function moltMon(m){

    m.sp=ev.to; m.hp=Math.max(1,Math.round(m.hp*stat(m,"hp")/oh)); S.seen[m.sp]=1; S.caught[m.sp]=1; if(B&&me()===m) B.dm=m.hp;

    S.bag.snack--; const f=foe(), sp=SP(f.sp);
    await say("{P} offered a Bubble Snack!");
    B.snack={t:0}; await tween(.5,k=>B.snack.t=k); B.snack=null;
    await tween(.25,k=>B.bub=k);
    let ch=sp.rate*(1-.7*f.hp/stat(f,"hp"))*(S.perks.charm?1.35:1)+.06; ch=Math.min(.95,ch);
    const p=Math.pow(ch,1/3);
    for(let i=0;i<3;i++){ await wait(.35); await tween(.35,k=>B.wob=Math.sin(k*Math.PI*2)); B.wob=0;
      if(Math.random()>p){ await tween(.2,k=>B.bub=1-k); await say(["Oh no! It wriggled out of the bubble!","Aww! It almost joined!","Argh! So close!"][i]); return false; } }
    await wait(.3); E.jingle(1);
    await say(`Yay! ${sp.n} became your friend!`);
    S.seen[f.sp]=1; S.caught[f.sp]=1;
    if(S.team.length<D.TEAM_MAX) S.team.push(f); else { S.box.push(f); await say(`Your team is full, so ${sp.n} swam home to the tide pool by your burrow. (Swap it in from TEAM.)`); }
    B.used[S.team.indexOf(f)]=0; delete B.used[S.team.indexOf(f)];
    return true;
  }

      const sn=Object.keys(D.SPECIES).filter(id=>S.seen[id]), st=Math.min(26,(W-28)/Math.max(1,sn.length-1));
      sn.forEach((id,i)=>g.drawImage(A.icon(id),Math.round(3+i*st),H-24+Math.round(Math.sin(time*3+i)*2))); }
  }
  function drawFx(dt){ fx=fx.filter(p=>(p.t+=dt)<.8); fx.forEach(p=>{ if(p.t<0) return; const s=Math.round(2+p.t*8), a=1-p.t/.8; g.globalAlpha=a; g.fillStyle=Math.floor(p.t*12)%2?"#ffe14d":"#ffffff";

  function drawFade(){ if(fade<=0) return;

  let scene="title";
  function popDraw(){ if(!popMon) return; box(W/2-34,20,68,68,"#e8fbff","#5fb3e8"); g.drawImage(A.critter(popMon),W/2-24,30+Math.round(Math.sin(time*3)*2)); }

  function frame(ts){ const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts; if(!pet) tick(dt); raf=requestAnimationFrame(frame); }
  function tick(dt){ time+=dt;
    try{
      for(const a of anims.slice()){ if(a.c){ if(a.c()){ anims.splice(anims.indexOf(a),1); a.res(); } continue; }
        a.t+=dt; const k=Math.min(1,a.t/a.d); a.fn(k); if(k>=1){ anims.splice(anims.indexOf(a),1); a.res(); } }
      if(ui) uiUpdate(); else if(dlg) dlgUpdate(dt);
      else if(!busy&&!nameBuf){ if(scene==="world") worldUpdate(dt); else if(scene==="title") titleUpdate(); else if(scene==="deep"&&hasDeep()) DEEP.update(dt); }
      queue.length=0;
      SK=scene==="deep"?SKINS.deep:SKINS.prawn;
      if(scene==="title") drawTitle(); else if(scene==="intro") drawIntro(); else if(scene==="battle"&&B) drawBattle(dt);
      else if(scene==="deep"&&hasDeep()) DEEP.draw(dt); else if(MAP) drawWorld();
      popDraw(); drawFx(dt);
      if(!(ui&&(ui.kind==="cmd"||ui.kind==="moves"))) drawDlg(); drawUi(); nameBox(); drawFade();
    }catch(e){ console.error("[Tide]",e); if(dbg.on) throw e; }
  }
  function fit(){ if(!cv||!host) return; const s=Math.max(1,Math.floor(Math.min(host.clientWidth/W,(host.clientHeight-8)/H)));
    cv.style.width=W*s+"px"; cv.style.height=H*s+"px"; }

  // ---------- the probe slot ----------
  function ui_(h){
    host=h; depth=0; pet=null; st(); open=true; anims=[]; dlg=null; ui=null; busy=0; fade=0; fadeKind="black"; B=null; nameBuf=null; queue=[]; for(const k in held) held[k]=0;
    scene="title"; title={cur:0}; popMon=null; fx=[];
    h.innerHTML=""; cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    cv.style.cssText="image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 40px rgba(80,200,255,.25);border-radius:4px";
    h.appendChild(cv); g=cv.getContext("2d"); g.imageSmoothingEnabled=false; fit();
    if(hasDeep()) DEEP.attach(deepKit());
    window.addEventListener("keydown",kd,true); window.addEventListener("keyup",ku,true); window.addEventListener("resize",fit);
    const iv=setInterval(()=>{ if((scene==="world"||scene==="deep")&&!B) save(); },30000);
    lastT=performance.now(); raf=requestAnimationFrame(frame);
    return ()=>{ if(pet) pet.close(); cancelAnimationFrame(raf); clearInterval(iv); window.removeEventListener("keydown",kd,true); window.removeEventListener("keyup",ku,true);
      window.removeEventListener("resize",fit);
      const inDeep=scene==="deep"&&hasDeep();
      if(depth>0||B||(scene!=="world"&&!inDeep)){ depth=0; S=load(); }          // closed mid-event: keep the last clean save
      else { if(inDeep) DEEP.sync(); else { S.map=MID; S.x=P.x; S.y=P.y; S.dir=P.dir; } save(); }
      anims=[]; open=false; };
  }

  // ---------- debug helpers (console: TIDE.dbg.on=true to rethrow errors) ----------
  Object.assign(dbg,{
    S:()=>S, warp:(m,x,y)=>{ loadMap(m); P.x=S.x=x; P.y=S.y=y; S.map=m; scene="world"; },

    dlg:()=>dlg&&{who:dlg.who,text:dlg.pg[dlg.pi].join(" "),opts:dlg.opts}, ui:()=>ui&&{kind:ui.kind,cur:ui.cur,n:(ui.items||[]).length}, typeName:s=>{ if(nameBuf){ nameBuf.s=s; nameBuf.done=1; } }
  });
  return {award, slot:{label:"PRAWN",run:h=>ui_(h)}, dbg};
})();

<script>
// ---------- render probe (internal diagnostics surface) ----------
(function(){
  const K=2520714798, N=11; let seq=[], P=null;
  const h=s=>{ let x=0x811c9dc5; for(const c of s){ x^=c.charCodeAt(0); x=Math.imul(x,0x01000193)>>>0; } return x; };
  const swallow=e=>{ e.preventDefault(); e.stopImmediatePropagation(); };

  // Entries: {label, run(host)}. run() may be async and returns a stop function.
  // While one runs it owns the keys, except Shift+Esc (back to list) and Alt+Enter (close).
  const slots=[];
  if(typeof TIDE!=="undefined"&&TIDE.slot) slots.push(TIDE.slot);      // PRAWN (src/tide.js); the older pet module opens inside it

  function menu(){
    P.stop=null; P.view.innerHTML="";
    const g=document.createElement("div"); g.className="pr-grid";
    slots.forEach((s,i)=>{
      const b=document.createElement("button"); b.className="pr-slot";
      b.textContent=s.label; b.onclick=()=>pick(i); g.appendChild(b);
    });
    P.view.appendChild(g); sel(P.i);
  }
  function sel(i){ if(!slots.length) return; P.i=(i+slots.length)%slots.length; P.view.querySelectorAll(".pr-slot").forEach((b,j)=>b.classList.toggle("pr-on",j===P.i)); }
  async function pick(i){
    const s=slots[i]; if(!s||!P||P.stop) return;
    P.view.innerHTML=""; P.stop=()=>{};
    try{ const stop=await s.run(P.view); if(P&&P.stop) P.stop=stop; else stop(); }catch(e){ if(P) menu(); }
  }

  function open(){
    if(P) return;
    const ov=document.createElement("div"); ov.className="pr-ov";
    ov.innerHTML='<div class="pr-view"></div><button class="pr-x" title="Close">×</button>';
    document.body.appendChild(ov);
    P={ov,view:ov.querySelector(".pr-view"),i:0,stop:null};
    ov.querySelector(".pr-x").onclick=close;
    window.addEventListener("keydown",nav,true);
    menu();
  }
  function nav(e){
    if(!P) return;
    if(e.key==="Enter"&&e.altKey){ swallow(e); close(); return; }
    if(e.key==="Escape"&&e.shiftKey){ swallow(e); if(P.stop){ P.stop(); menu(); } else close(); return; }
    if(P.stop) return;                                  // slot has the keys
    swallow(e);
    if(e.key==="Escape") close();
    else if(e.key==="ArrowRight"||e.key==="ArrowDown") sel(P.i+1);
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp") sel(P.i-1);
    else if(e.key==="Enter"||e.key===" ") pick(P.i);
  }
  function close(){
    if(!P) return; if(P.stop) P.stop(); window.removeEventListener("keydown",nav,true); P.ov.remove(); P=null;
  }

  document.addEventListener("keydown",e=>{
    if(!P&&e.altKey&&e.key==="Enter"){ e.preventDefault(); open(); return; }
    if(P||e.ctrlKey||e.metaKey||e.altKey||!e.key) return;
    const t=e.target; if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))){ seq=[]; return; }
    seq.push(e.key.toLowerCase()); if(seq.length>N) seq.shift();
    if(seq.length===N&&h(seq.join(","))===K){ seq=[]; e.preventDefault(); open(); }
  });
})();

</script>
